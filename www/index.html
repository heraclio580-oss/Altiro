// Which session goes on which training day. Every arrangement is scored and the best one kept: hard
// days (long run, hard runs) never back to back, a heavy leg day not right before a hard run, the same
// muscle group not lifted two days running, and the long run on the weekend (Sunday first) when
// there's a weekend training day. At most 7 sessions, so trying every arrangement is cheap -- and it's
// remembered, since it only depends on the days and the kinds of sessions.
const placementCache = new Map();
function placeSessions(days, items){
  const cacheKey = days.join(',')+'|'+items.map(it=>it.sig).join(',');
  if(placementCache.has(cacheKey)) return placementCache.get(cacheKey);
  const hasWeekend = days.includes(5) || days.includes(6);
  const lastDay = days[days.length-1];
  const mixed = items.some(it=>it.kind==='run') && items.some(it=>it.kind==='lift');
  function pairCost(a, b){
    let c = 0;
    if(a.hard && b.hard) c += 10;
    if(a.kind==='lift' && a.legs && b.kind==='run' && b.hard) c += 6;
    if(a.kind==='run' && a.hard && b.kind==='lift' && b.legs) c += 3;
    if(a.kind==='lift' && b.kind==='lift'){
      if(a.group===b.group) c += 4;
      else if(a.legs && b.legs) c += 2;
    }
    if(mixed && a.kind===b.kind) c += 0.5;
    return c;
  }
  const liftCount = items.filter(it=>it.kind==='lift').length;
  function cost(assign){ // assign[dayIdxInDays] = item
    let c = 0;
    // The week's peak lifting day sits in the middle of its lifting days (the later one of two middles).
    const liftPos = assign.filter(it=>it.kind==='lift').findIndex(it=>it.peak);
    if(liftPos>=0){
      const mid = (liftCount-1)/2;
      c += 3*Math.abs(liftPos-mid) + (liftPos<mid ? 0.1 : 0);
    }
    const byDay = {};
    days.forEach((d,i)=>{ byDay[d] = assign[i]; });
    days.forEach((d,i)=>{
      const it = assign[i];
      const next = d===6 ? byDay[0] : byDay[d+1];
      if(next) c += pairCost(it, next) * (d===6 ? 0.5 : 1);
      // Long run Saturday morning (or Sunday); the short recovery run the day after it; the week's fast
      // session early; the longer easy run mid-week.
      if(it.role==='long') c += hasWeekend ? (d===5 ? 0 : d===6 ? 1 : 8) : (lastDay-d);
      if(it.role==='recovery'){ const prev = byDay[d===0 ? 6 : d-1]; c += prev && prev.role==='long' ? 0 : 2; }
      if(it.role==='quality') c += 0.3*d;
      if(it.role==='easyLong') c += 0.2*Math.abs(d-3);
    });
    return c;
  }
  let best = null, bestCost = Infinity;
  const used = new Array(items.length).fill(false), assign = [];
  (function search(pos){
    if(pos===days.length){
      const c = cost(assign);
      if(c < bestCost){ bestCost = c; best = assign.slice(); }
      return;
    }
    const tried = new Set();
    items.forEach((it,i)=>{
      if(used[i] || tried.has(it.sig)) return; // identical sessions are interchangeable -- try one
      tried.add(it.sig);
      used[i] = true; assign.push(it);
      search(pos+1);
      used[i] = false; assign.pop();
    });
  })(0);
  placementCache.set(cacheKey, best);
  return best;
}

// Generates plan week n (0 = the week the plan started) as 7 day slots, Monday first: {p, c} where p
// is the day's session (a Rest Day off the training days) and c an optional short companion session.
function generatePlanWeek(cfg, n){
  const days = cfg.days;
  const week = Array.from({length:7}, ()=>({p:ses('rest','Rest Day','','Día de descanso',''), c:null}));
  if(!days.length) return week;
  const recovery = isRecoveryWeek(n);
  const {runs, lifts} = splitTrainingDays(days.length, cfg.focus, cfg.goal);

  // The running week's building block: one fast session (tempo or intervals), a longer easy run, the
  // long run, and -- with 4 or more runs -- a short recovery run the day after it; any more are easy.
  const q = qualityRunCount(cfg, runs, n);
  const roles = runs ? ['long'] : [];
  if(q && roles.length<runs) roles.push('quality');
  if(roles.length<runs) roles.push('easyLong');
  const extra = runs - roles.length;
  for(let k=0; k<extra; k++) roles.push(k===extra-1 && runs>=4 ? 'recovery' : 'easy');
  const miles = distributeRunMiles(weeklyRunMiles(cfg, runs, n), roles, cfg);

  const items = [];
  let qIdx = 0;
  roles.forEach((role, i)=>{
    const mi = miles[i];
    let kind = role;
    if(role==='quality') kind = recovery ? 'strides' : QUALITY_ROTATION[cfg.level][(n+qIdx++) % QUALITY_ROTATION[cfg.level].length];
    // A "long run" only earns the name once it's genuinely long.
    if(role==='long' && (mi<4 || runs===1 && mi<6)) kind = 'easy';
    if(onWalkJogPlan(cfg, n)) kind = 'walkjog';
    const hard = role==='long' ? kind!=='easy' && kind!=='walkjog' : role==='quality' && !recovery;
    items.push({kind:'run', role, sub:kind, mi, hard, legs:true, sig:'run:'+role+':'+kind+':'+mi});
  });
  // The workout that trains the week's focus lift is its peak, placed mid-week (see liftWave).
  const focus = peakFocusFor(cfg, n);
  const splits = liftSplitFor(lifts, cfg.level);
  // (Of several that do, the one nearest the middle of the split, so the week keeps its usual order.)
  const trainsFocus = sp => focus && liftTemplateFor(LIFT_SESSIONS[sp].en).some(sl=>FOCUS_SLOTS[focus.movement].includes(sl.m));
  const splitMid = (splits.length-1)/2;
  const peakSplit = splits.map((_,k)=>k).filter(k=>trainsFocus(splits[k]))
    .sort((a,b)=> Math.abs(a-splitMid)-Math.abs(b-splitMid) || b-a)[0] ?? -1;
  splits.forEach((split, k)=>{
    const L = LIFT_SESSIONS[split];
    items.push({kind:'lift', split, group:L.group, legs:L.legs, hard:false, peak:k===peakSplit, sig:'lift:'+split+(k===peakSplit ? ':peak' : '')});
  });

  const placed = placeSessions(days, items);
  let easyCount = 0, runOrder = 0;
  days.forEach((d,i)=>{
    const it = placed[i];
    if(it.kind==='run'){
      let p;
      if(it.sub==='walkjog') p = walkJogSessionFor(cfg, n, runOrder);
      else if(['tempo','intervals','fartlek','hills'].includes(it.sub)) p = qualityRunFor(it.sub, it.mi, n);
      else p = runSessionFor(it.sub, it.mi);
      runOrder++;
      const c = it.role==='long' ? COMPANION.foam()
        : it.role==='quality' ? COMPANION.hips()
        : (easyCount++ % 2 ? COMPANION.mobility() : COMPANION.core());
      week[d] = {p, c};
    } else {
      week[d] = {p: liftSessionFor(it.split, cfg, recovery), c: it.legs ? COMPANION.mobility() : COMPANION.core()};
    }
  });
  // The lifting days' weekly wave (see liftWave), in day order.
  const liftDays = days.filter((d,i)=>placed[i].kind==='lift');
  liftWave(liftDays.map(d=>placed[days.indexOf(d)]), cfg, n).forEach((w,i)=>{ week[liftDays[i]].wave = w; });
  // Running and lifting go hand in hand: in a plan with both, a lifting day is followed by an easy
  // 20-30 minute jog -- except the peak day, a day before a hard run or the long run, and for someone
  // still building up to running.
  if(runs && !onWalkJogPlan(cfg, n)){
    liftDays.forEach(d=>{
      const next = week[(d+1)%7].p;
      const hardNext = next.t==='run' && /Long Run|Tempo Run|Interval Run/.test(next.en.title);
      if(week[d].wave && week[d].wave.pos!=='peak' && !hardNext) week[d].c = COMPANION.jog();
    });
  }
  return week;
}

// The weekly wave: lifting starts the week light, builds to one peak day in the middle -- the week's
// heaviest, where the focus lift goes all the way up to a top single -- then steps back down, so the
// week ends recovered rather than sore. top: how heavy each day's pyramid gets, as a share of the
// lift's top weight (see pyramidSteps). A recovery week stays light throughout.
const WAVE_TOP = {light:0.8, build:0.9, step:0.85, peak:1};
// Each week's peak lift, by the user's strength focus. A plan runs in 4-week blocks -- 3 build weeks
// then a recovery week -- and the peak moves on every build week: All-round goes press -> squat ->
// deadlift, then round again with the next variation of each; a single focus peaks a different
// variation of its lift each week, so the same lift is never peaked week after week.
const FOCUS_ROTATION = {
  allround: ['hpush','squat','deadlift'],
  bench: ['hpush'], squat: ['squat'], deadlift: ['deadlift'], press: ['vpush'], arms: ['armstrength'],
};
// A workout "has" the focus lift if it trains that movement -- a deadlift can take a hinge slot, an
// arm-strength lift an arms slot.
const FOCUS_SLOTS = {hpush:['hpush'], squat:['squat'], deadlift:['deadlift','hinge'], vpush:['vpush'], armstrength:['armstrength','arms']};
function peakFocusFor(cfg, n){
  if(isRecoveryWeek(n)) return null;
  const rot = FOCUS_ROTATION[cfg.strengthFocus] || FOCUS_ROTATION.allround;
  const buildWeek = n - Math.floor((n+1)/4);
  return {movement: rot[buildWeek % rot.length], variant: Math.floor(buildWeek / rot.length)};
}
function liftTemplateFor(title){ return LIFT_TEMPLATES[title] || LIFT_TEMPLATES[title.replace(/ B$/,'')] || null; }
// lifts: the week's placed lifting workouts in day order. The peak is the one that trains the focus lift
// (placed mid-week), or when none does, simply the middle one, which then gets it added; the day before
// it builds, the day after steps down, the rest are light.
function liftWave(lifts, cfg, n){
  if(!lifts.length) return [];
  const focus = peakFocusFor(cfg, n);
  if(!focus) return lifts.map(()=>({pos:'light', focus:null}));
  const found = lifts.findIndex(it=>it.peak);
  const peak = found>=0 ? found : Math.ceil((lifts.length-1)/2);
  return lifts.map((_,i)=>({
    pos: i===peak ? 'peak' : i===peak-1 ? 'build' : i===peak+1 ? 'step' : 'light',
    focus: i===peak ? focus : null,
  }));
}
// A generated lifting workout's place in its week's wave, or null for a workout that isn't the plan's
// own for that day (moved there, or added by the user).
function liftWaveFor(session, date){
  const e = planWeekFor(date)[(date.getDay()+6)%7];
  return e && e.wave && e.p.en.title===session.en.title ? e.wave : null;
}
const planWeekCache = new Map();
function planWeekFor(date){
  const cfg = planConfig();
  const n = planWeekIndex(date);
  const key = JSON.stringify(cfg)+'|'+n;
  if(!planWeekCache.has(key)){
    if(planWeekCache.size>300) planWeekCache.clear();
    planWeekCache.set(key, generatePlanWeek(cfg, n));
  }
  return planWeekCache.get(key);
}
// The generated session for a date, as a fresh copy (callers may edit it).
function plannedSessionFor(date){
  const e = planWeekFor(date)[(date.getDay()+6)%7];
  return {p:{...e.p}, c: e.c ? {...e.c} : null};
}

  // Beginners build up to the heavy 5s but don't do the single yet.
  const ladder = peak ? PYRAMID_PEAK.filter(st=> planLevel()!=='beginner' || st[2]!=='top') : PYRAMID_LIGHT;
  const steps = pyramidSteps(ladder, peak ? top : top*WAVE_TOP[wave.pos]);
  const out = list.slice();
  out[0] = {...ex, sets: steps.length, reps: 10, pyramid: {peak, pos: wave.pos, steps, top: Math.max(...steps.map(st=>st.weight))}};
  out.skipped = list.skipped || [];

}
// Each lift's reps come from its own target -- the same numbers Log Performance pre-fills and progression

}

/* ---------------- calendar day lookups (any date, past or future) ---------------- */
function sessionForDate(date){

function dayDataStatus(dd){

    return 'rest';

}
function ensureDayLog(key){

}

function addExtraWorkout(key, session){

function planCustomWorkout(key, opts){

  if(opts.interval) session.interval = opts.interval; // {rounds, workSec, restSec} -- read by the interval timer

    if(opts.type==='run'){ target.pace = opts.target.pace; }

// the primary slot too (same as planning one already does), but ONLY when nothing has claimed the
// slot yet (still the untouched auto-generated default) -- a day that already has its own custom
// plan keeps it, and the new entry just logs alongside it as before. Deliberately leaves
// completed/completedOverride untouched: the caller already manages those, and forcing a value here

// weekStats() (Progress screen's weekly/lifetime mileage) reads a day's actualRunDistance as the
// authoritative "what really happened" number, falling back to parsing the primary session's plan
// text only when that's unset -- but creating or editing a cardio manual entry never touched
// actualRunDistance at all, so a day's real logged distance only ever showed up there by the
// coincidence of promotePrimaryFromLog's plan text happening to start with the right number, and
// EDITING that entry afterward left both the plan text and actualRunDistance frozen at whatever
// they were the moment it was first logged. Call this after creating a manual entry or logging new
// performance for one (see applyLoggedPerformance) -- any change to manualEntries[0]
// (the same "first logged entry" getDayData() itself already treats as the day's real record when
// the primary is still a plain rest day) so Progress, and the promoted primary's own display text if
// one exists, both reflect the entry as it stands now.
function syncActualRunDistanceFromEntry(dayKey, entry){
  if(!entry || entry.type!=='run' || entry.distance==null) return;

  // promoted into) -- a second run logged on a day with its own planned run is a separate run, and

function allPlanDates(){
  const dates = [];
  for(let w=0; w<state.planWeeksLoaded; w++) dates.push(...weekDates(w));

// Cascading move across the ENTIRE loaded Plan list, not just the current week block --
// sourceFlatIdx/targetFlatIdx are positions into allPlanDates() (flat index = weekIdx*7 + the
// day's index within that week). getRawDaySlot()/writeDaySlot() already transparently handle both
// storage shapes a day can use (the current week's live state.week[] array, or a dayLog-based
// override for every other day), so the same cascade works seamlessly whether source and target
// land in the same week block or different ones -- nothing about moving a workout should be
// artificially capped at a week boundary that only exists for display grouping.
function reorderAcrossPlan(sourceFlatIdx, targetFlatIdx){
  if(sourceFlatIdx === targetFlatIdx) return;
  const dates = allPlanDates();
  const step = sourceFlatIdx < targetFlatIdx ? 1 : -1;
  const movingSlot = getRawDaySlot(dates[sourceFlatIdx]);
  // A drag reassigns which content lives on which date, so every date the cascade touches has to be
  // treated -- and persisted -- as an explicit custom plan for that date from here on. Without this,
  // the reorder was purely local: nothing about it was ever saved to the cloud, so signing out and
  // back in re-loaded each date's original auto-generated content and the rearrangement was gone.
  function writeCustom(date, slot){
    const stamped = {...slot, isCustom:true};
    writeDaySlot(date, stamped);
    const key = dateKey(date);
    cloudSavePlannedSession(key, stamped.p);
    cloudSetCompletedOverride(key, stamped.completed);
  }
  for(let i=sourceFlatIdx; i!==targetFlatIdx; i+=step){
    writeCustom(dates[i], getRawDaySlot(dates[i+step]));
  }
  writeCustom(dates[targetFlatIdx], movingSlot);
}

/* ---------------- reschedule (missed day) ----------------
   "Shift rest of week": the missed session becomes today's session, and

function shiftWeekFromMissed(missedIdx){
  const range = [];
  for(let i=TODAY_IDX;i<=6;i++) range.push(i);
  const movable = range.filter(i => !(state.week[i].p.t!=='rest' && state.week[i].completed));
  const missedContent = {p: state.week[missedIdx].p, c: state.week[missedIdx].c};
  const contents = [missedContent, ...movable.map(i => ({p: state.week[i].p, c: state.week[i].c}))];

  state.week[missedIdx].p = ses('rest','Rest Day','','Día de descanso','');
  state.week[missedIdx].c = null;
  state.week[missedIdx].completed = false;

  movable.forEach((idx,k)=>{
    state.week[idx].p = contents[k].p;
    state.week[idx].c = contents[k].c;
    state.week[idx].completed = false;
  });
  state.doneCount = computeDoneCount();
}
function moveSessionTo(fromIdx, toIdx){
  state.week[toIdx].p = state.week[fromIdx].p;
  state.week[toIdx].c = state.week[fromIdx].c;
  state.week[toIdx].completed = false;
  state.week[fromIdx].p = ses('rest','Rest Day','','Día de descanso','');
  state.week[fromIdx].c = null;
  state.week[fromIdx].completed = false;
  state.doneCount = computeDoneCount();
}

/* ---------------- sliders ---------------- */
function makeSlider(trackEl, thumbEl, fillEl, getVal, setVal, onChange){
  function paint(){
    const v = getVal();
    const pct = (v/4)*100;
    fillEl.style.width = pct+'%';
    thumbEl.style.left = pct+'%';
    thumbEl.setAttribute('aria-valuenow', v);
  }
  function posToVal(clientX){
    const r = trackEl.getBoundingClientRect();
    let pct = (clientX - r.left)/r.width;
    pct = Math.max(0, Math.min(1, pct));
    return Math.round(pct*4);
  }
  function commit(clientX){
    const v = posToVal(clientX);
    if(v!==getVal()){ setVal(v); onChange(v); }
    paint();
  }
  const hitEl = trackEl.parentElement;
  hitEl.addEventListener('pointerdown', (e)=>{
    e.preventDefault();
    commit(e.clientX);
    try{ hitEl.setPointerCapture(e.pointerId); }catch(err){}
    const move = (ev)=>commit(ev.clientX);
    const up = ()=>{
      hitEl.removeEventListener('pointermove',move);
      hitEl.removeEventListener('pointerup',up);
      hitEl.removeEventListener('pointercancel',up);
    };
    hitEl.addEventListener('pointermove',move);
    hitEl.addEventListener('pointerup',up);
    hitEl.addEventListener('pointercancel',up);
  });
  thumbEl.addEventListener('keydown', (e)=>{
    let v = getVal();
    if(e.key==='ArrowLeft'||e.key==='ArrowDown'){ v=Math.max(0,v-1); setVal(v); onChange(v); paint(); }
    if(e.key==='ArrowRight'||e.key==='ArrowUp'){ v=Math.min(4,v+1); setVal(v); onChange(v); paint(); }
  });
  paint();
  return {paint};
}

function runLoading(){
  const items = document.querySelectorAll('#checklist .check-item');
  items.forEach(it=>{ it.className='check-item'; it.querySelector('.st').innerHTML=''; });
  let step=0;
  function tick(){
    if(step>0){
      const prev = items[step-1];
      prev.className='check-item done';
      prev.querySelector('.st').innerHTML = `<span style="color:var(--ok-icon)">${ICONS.checkSm}</span>`;
    }
    if(step<items.length){
      items[step].className='check-item active';
      items[step].querySelector('.st').innerHTML = `<span class="spin">${ICONS.spinner}</span>`;
      step++;
      state.loadTimer = setTimeout(tick, 850);
    } else {
      state.planStart = dateKey(WEEK_MONDAY);
      state.week = buildWeek();
      if(state.signedIn && state.userId) saveProfileToCloud();
      state.loadTimer = setTimeout(()=>showScreen('home'), 550);
    }
  }
  tick();
}

/* ---------------- home ---------------- */
function renderHome(){
  ensureWeek();
  const L = STR[state.lang];

  document.getElementById('homeDateLine').textContent = `${DAY_NAMES_FULL[state.lang][TODAY_IDX]}, ${MONTHS_SHORT[state.lang][WEEK_MONDAY.getMonth()]} ${DAY_DATES[TODAY_IDX]}`;

  // A rolling window centered on today, not the Mon-Sun calendar week -- today always sits in the
  // middle cell and past/future days scroll through the same slots as real time passes, instead of
  // today landing wherever it happens to fall in a fixed calendar week (see homeStripDates()).
  const strip = document.getElementById('weekStrip');
  const stripDates = homeStripDates();
  strip.innerHTML = stripDates.map(date=>{
    const dd = getDayData(date);
    const status = dayDataStatus(dd);
    const cls = statusClassFor(status==='rest' ? '' : status, dd.isToday);
    const dow = (date.getDay()+6)%7; // Mon=0..Sun=6, for the short day-name/label lookup only
    return `<div class="day-cell ${cls}" data-date="${dateKey(date)}" data-day="${dow}">
      <span class="dn">${DAY_NAMES_SHORT[state.lang][dow]}</span><span class="dd">${date.getDate()}</span><span class="dot"></span>
    </div>`;
  }).join('');
  strip.querySelectorAll('.day-cell').forEach(c=>{
    c.addEventListener('click', ()=> openDayDetail(c.getAttribute('data-date')));
  });

  const eff = todaySession(); const effL = ST(eff);
  const tip = (SESSION_TIP[eff.t]||SESSION_TIP.rest)[state.lang];
  const comp = state.week[TODAY_IDX].c; const compL = comp ? ST(comp) : null;
  const canStart = eff.t!=='rest' && !state.todayCompleted;
  // A structured strength session tracks progression per exercise, not for the session as a whole,
  // so there's no single "Next Suggested" number to show here anymore -- the exercise list itself
  // (with its own sets x reps prescription) already represents the plan.
  const hasExerciseList = !!exercisesForSession(eff);
  // A structured run's breakdown already carries its paces, step by step.
  const suggestedTarget = (!hasExerciseList && !isPaceFree(eff) && !runBreakdown(eff) && (eff.t==='strength'||eff.t==='run')) ? getProgressionTarget(eff, state.intensityIdx) : null;
  const suggestedTargetStr = suggestedTarget ? (eff.t==='strength' ? `${suggestedTarget.weight} lb x ${suggestedTarget.reps}` : `${fmtPace(suggestedTarget.pace)}/mi`) : null;

  document.getElementById('homeGreeting').textContent = (eff.t==='rest' ? L.greetingRest : L.greetingActive).replace('{name}', state.userName.split(' ')[0]);
  document.getElementById('weatherChip').innerHTML = `${ICONS.sun}<span>72°F · ${L.weatherConditionClear}</span>`;
  document.getElementById('streakChip').innerHTML = `${ICONS.flame}<span>${state.streak} ${L.dayStreakSuffix}</span>`;

  // Distance reads through weekStats() (the same override-aware source Progress's week-detail card
  // uses) rather than the old state.mileage accumulator, which only a handful of call sites ever
  // bumped (Record/extra-workout completion) and never a plain "+ Create Workout" cardio log -- so
  // logging or editing a manual entry's distance never moved this card at all, and since nothing
  // ever persisted or reloaded it either, it silently reset to 0 on every fresh sign-in besides.
  // Measured against the miles actually planned this week (every run's own mileage added up), not a
  // fixed number -- falling back to the default goal only when no runs are planned at all.
  const week = weekStats(0);
  const weekMileage = week.distance;
  const distanceGoal = week.plannedDistance>0 ? +week.plannedDistance.toFixed(2) : state.weeklyDistanceGoal;
  const workoutGoal = Math.max(weekWorkoutGoal(), state.doneCount);
  const wPct = workoutGoal ? Math.min(100, Math.round((state.doneCount/workoutGoal)*100)) : 0;
  let dPct = Math.min(100, Math.round((weekMileage/distanceGoal)*100));
  document.getElementById('ovWorkoutsVal').textContent = `${state.doneCount}/${workoutGoal}`;
  document.getElementById('ovWorkoutsBar').style.width = wPct+'%';
  // A week of timed sessions (walks, run/walks) with no miles planned counts minutes instead.

/* ---------------- progression programming ---------------- */
// A new runner's longest steady jog, from their latest walk/jog log -- what the next sessions' jog
// blocks build from (see jogBlockFor). Week 1's jog isn't a block yet, so it never counts as held.
function recordJogBaseline(min, planned, date){
  const b = buildWeekOf(planWeekIndex(date));
  state.jogBaseline = {min: Math.max(0.5, Math.round(min*2)/2), week: b, held: b>0 && min>=planned};
  saveProfileToCloud();
}
function progressionKey(session){
  return session.t + ':' + session.en.title;
}
function seedProgressionTarget(session, intensityIdx){
  const tier = INTENSITY[intensityIdx];
  if(session.t==='strength'){
    return {weight: [95,135,195][intensityIdx], reps: [12,10,5][intensityIdx]};
  }
  if(session.t==='run'){
    return {pace: tier.pace};
  }
  return null;
}
function getProgressionTarget(session, intensityIdx){
  const key = progressionKey(session);
  if(!state.progression[key]){
    const seeded = seedProgressionTarget(session, intensityIdx);
    if(!seeded) return null;
    state.progression[key] = seeded;
  }
  return state.progression[key];
}
// Per-exercise progression -- exercise weight targets live in the same state.progression map as
// whole-session targets, just keyed by the exercise's stable name instead of a session title. This
// is the same key shape (and the same map) that a matching Personal Record already writes into via
// applyPRToProgression, so a PR for "Bench Press" and a generated Push Day's "Bench Press" exercise
// share one progression trail automatically.
function exerciseProgressionKey(exerciseKey){
  return 'strength:' + exerciseKey;
}
function seedExerciseTarget(ex, intensityIdx){
  if(ex.bodyweight) return null; // nothing to load/track -- just a sets x reps (or duration) prescription
  const base = [95,135,195][intensityIdx];
  return {weight: Math.round(base*(ex.seedFactor||0.5)/5)*5, reps: ex.reps || 10};
}
function getExerciseTarget(ex, intensityIdx){
  const key = exerciseProgressionKey(ex.key);
  if(!state.progression[key]){
    const seeded = seedExerciseTarget(ex, intensityIdx);
    if(!seeded) return null;
    state.progression[key] = seeded;
  }
  return state.progression[key];
}
function saveExerciseTarget(exerciseKey, target){
  state.progression[exerciseProgressionKey(exerciseKey)] = target;
  cloudSaveProgressionTarget({t:'strength', en:{title:exerciseKey}}, target);
}
function applyProgressionResult(session, logged){
  state._lastProgressed = false;
  if(!logged) return;
  if(logged.exercises && logged.exercises.length){
    // Structured strength session -- advance each exercise independently.
    let advanced = 0, total = 0;
    logged.exercises.forEach(res=>{
      if(res.bodyweight) return;
      total++;
      const target = state.progression[exerciseProgressionKey(res.key)];
      if(!target) return;
      if(res.pyramid){
        // A pyramid's weights come from the lift's best set (see pyramidTop): it moves up whenever a
        // set of 5 or more beats it -- the top single is the day's, not something to build on.
        const best = logged.feel==='hard' ? null : (res.sets||[]).filter(st=>st.reps>=5 && st.weight>0)
          .reduce((b,st)=> !b || estimatedMax(st.weight, st.reps) > estimatedMax(b.weight, b.reps) ? st : b, null);
        if(best && estimatedMax(best.weight, best.reps) > estimatedMax(target.weight, target.reps||10) + 0.5){
          target.weight = best.weight; target.reps = best.reps; advanced++; saveExerciseTarget(res.key, target);
        }
        return;
      }
      const met = res.reps >= target.reps && logged.feel !== 'hard';
      if(met){ target.weight += 5; advanced++; saveExerciseTarget(res.key, target); }
    });
    state._lastProgressed = advanced>0;
    state._lastProgressedCount = advanced;
    state._lastProgressedTotal = total;
    return;
  }
  if(session.t!=='strength' && session.t!=='run') return;
  const target = getProgressionTarget(session, state.intensityIdx);
  if(!target) return;
  if(session.t==='strength'){
    const met = logged.reps >= target.reps && logged.feel !== 'hard';
    if(met){ target.weight += 5; state._lastProgressed = true; }
  } else if(session.t==='run'){
    if(isPaceFree(session)) return; // goes by feel -- there's no pace target to move
    const dist = logged.distance!=null ? logged.distance : (plannedMilesOf(session) || 3);
    const actualPace = dist>0 ? logged.time/dist : target.pace;
    const met = actualPace <= target.pace+0.05 && logged.feel !== 'hard';
    if(met){ target.pace = Math.max(4.0, +(target.pace-5/60).toFixed(3)); state._lastProgressed = true; }
  }
}

/* ---------------- log performance sheet ---------------- */
// Live, per-set completion tracking while a structured strength workout is being logged -- purely
// a doing-the-workout UX aid (ticking off each set as it's finished, with the next unfinished
// exercise auto-highlighted), reset fresh every time the sheet opens. It doesn't change what
// actually gets saved -- the weight/reps fields next to it remain the source of truth for that.
let logPerfSetChecks = {}; // {exerciseKey: [bool, ...]}
// Which exercise the user has explicitly tapped to work on -- overrides the "first unfinished
// exercise" auto-highlight, so someone who can't do them in the listed order (e.g. the squat rack
// is taken) can jump straight to whichever one they're actually doing next.
let logPerfSelectedKey = null;
function wireSetCheckDot(dot, rowEl, ex){
  dot.addEventListener('click', ()=>{
    const checks = logPerfSetChecks[ex.key];
    const idx = parseInt(dot.getAttribute('data-set-idx'),10);
    checks[idx] = !checks[idx];
    refreshLogPerfRowState(rowEl, ex);
    refreshLogPerfCurrentHighlight();
  });
}
function refreshLogPerfRowState(rowEl, ex){
  const checks = logPerfSetChecks[ex.key];
  const allChecked = checks.every(Boolean);
  rowEl.classList.toggle('set-complete', allChecked);
  if(ex.bodyweight){
    // No per-set weight/reps to preserve here, so it's safe to just fully redraw the dots.
    const dotsEl = rowEl.querySelector('.set-check-row');
    dotsEl.innerHTML = checks.map((c,i)=>`<button type="button" class="set-check-dot ${c?'checked':''}" data-set-idx="${i}">${c?ICONS.checkSm:i+1}</button>`).join('');
    dotsEl.querySelectorAll('.set-check-dot').forEach(dot=> wireSetCheckDot(dot, rowEl, ex));
  } else {
    // Each set has its own weight/reps inputs (so a pyramid/wave set -- 60x10, 70x10, 90x5 -- can
    // be logged as it actually happened) that must never get wiped by a re-render, so only the
    // check button's own state is touched here, not the row's markup.
    rowEl.querySelectorAll('.set-check-dot').forEach(dot=>{
      const idx = parseInt(dot.getAttribute('data-set-idx'),10);
      dot.classList.toggle('checked', checks[idx]);
      dot.innerHTML = checks[idx] ? ICONS.checkSm : String(idx+1);
    });
  }
}
function updateLogPerfPrescriptionLabel(rowEl, ex){
  const label = rowEl.querySelector('.exercise-log-name span');
  if(label) label.textContent = fmtExercisePrescription({...ex, sets: logPerfSetChecks[ex.key].length});
}
const LOG_PERF_MAX_SETS = 20;
// The prescribed set count is just a starting suggestion -- the user might do one more, or cut a
// set short, so it's editable live while the workout is being logged.
// Adds one weight/reps set row (not yet ticked) to a weighted exercise in Log Performance.
function appendLogPerfSetRow(rowEl, ex, weight, reps, stage){
  const checks = logPerfSetChecks[ex.key];
  const idx = checks.length;
  checks.push(false);
  const div = document.createElement('div');
  div.className = 'set-log-row';
  div.setAttribute('data-set-idx', String(idx));
  div.setAttribute('data-stage', stage || '');
  div.innerHTML = `<span class="set-log-num">${idx+1}</span>
    <input type="number" inputmode="numeric" class="text-input" data-field="weight" data-set-idx="${idx}" placeholder="${state.weightUnit}" value="${escapeHtml(String(weight ?? ''))}">
    <input type="number" inputmode="numeric" class="text-input" data-field="reps" data-set-idx="${idx}" value="${escapeHtml(String(reps ?? ''))}">
    <button type="button" class="set-check-dot" data-set-idx="${idx}">${idx+1}</button>`;
  rowEl.querySelector('.set-rows').appendChild(div);
  wireSetCheckDot(div.querySelector('.set-check-dot'), rowEl, ex);
}
function addLogPerfSet(rowEl, ex){
  const checks = logPerfSetChecks[ex.key];
  if(checks.length>=LOG_PERF_MAX_SETS) return;
  if(!ex.bodyweight){
    const existingRows = [...rowEl.querySelectorAll('.set-rows .set-log-row')];
    const last = existingRows[existingRows.length-1];
    const t = getExerciseTarget(ex, state.intensityIdx);
    // A new set starts from whatever the last set currently shows -- closer to what the user
    // will actually do next than resetting back to the original seeded target.
    const lastWeight = last ? last.querySelector('[data-field="weight"]').value : (t?t.weight:'');
    const lastReps = last ? last.querySelector('[data-field="reps"]').value : (t?t.reps:ex.reps);
    appendLogPerfSetRow(rowEl, ex, lastWeight, lastReps, '');
  } else checks.push(false);
  updateLogPerfPrescriptionLabel(rowEl, ex);
  refreshLogPerfRowState(rowEl, ex);
  refreshLogPerfCurrentHighlight();
}
// The pyramid's calls, made mid-set from the next set not yet ticked:
//   fives  -- a set of 10 would get ugly: it and the rest of the climb become sets of 5.
//   single -- 5 isn't there: this set becomes one clean single (the top for today), and the sets after
//             it are replaced by the way back down from that weight.
function pyramidAction(rowEl, ex, action){
  const checks = logPerfSetChecks[ex.key];
  const rows = [...rowEl.querySelectorAll('.set-rows .set-log-row')];
  const from = checks.findIndex(c=>!c);
  if(from<0) return;
  if(action==='fives'){
    rows.slice(from).forEach(r=>{
      if(r.dataset.stage==='down' || r.dataset.stage==='top') return;
      const reps = r.querySelector('[data-field="reps"]');
      if(!(parseFloat(reps.value)<=5)) reps.value = 5;
    });
  } else {
    const topRow = rows[from];
    topRow.querySelector('[data-field="reps"]').value = 1;
    topRow.dataset.stage = 'top';
    const top = parseFloat(topRow.querySelector('[data-field="weight"]').value) || 0;
    rows.slice(from+1).forEach(r=>r.remove());
    checks.length = from+1;
    PYRAMID_BACK_DOWN.forEach(([pct, reps, stage])=> appendLogPerfSetRow(rowEl, ex, roundPlate(top*pct), reps, stage));
  }
  updateLogPerfPrescriptionLabel(rowEl, ex);
  refreshLogPerfRowState(rowEl, ex);
  refreshLogPerfCurrentHighlight();
}
function removeLogPerfSet(rowEl, ex){
  const checks = logPerfSetChecks[ex.key];
  if(checks.length<=1) return;
  checks.pop();
  if(!ex.bodyweight){
    const setRowsEl = rowEl.querySelector('.set-rows');
    const rowsEls = setRowsEl.querySelectorAll('.set-log-row');
    rowsEls[rowsEls.length-1].remove();
  }
  updateLogPerfPrescriptionLabel(rowEl, ex);
  refreshLogPerfRowState(rowEl, ex);
  refreshLogPerfCurrentHighlight();
}
// "Select the next workout and sets" -- once an exercise's sets are all checked off, highlight the
// next not-yet-finished exercise as the current one automatically, unless the user has explicitly
// picked a different (still-unfinished) one to work on instead.
function refreshLogPerfCurrentHighlight(){
  const rows = [...document.querySelectorAll('#logPerfExercisesList .exercise-log-row')];
  const selectedRow = logPerfSelectedKey
    ? rows.find(r=>r.getAttribute('data-exercise-key')===logPerfSelectedKey && !r.classList.contains('set-complete'))
    : null;
  if(selectedRow){
    rows.forEach(r=> r.classList.toggle('current-exercise', r===selectedRow));
    return;
  }
  logPerfSelectedKey = null; // the picked exercise finished (or was never valid) -- fall back to auto
  let foundCurrent = false;
  rows.forEach(r=>{
    const isCurrent = !r.classList.contains('set-complete') && !foundCurrent;
    if(isCurrent) foundCurrent = true;
    r.classList.toggle('current-exercise', isCurrent);
  });
}
// Same h/m/s -> total-minutes conversion as readHmsMinutes('manualDuration')/writeHmsMinutes('manualDuration', )
// (Create Workout's cardio Duration), reused here so Log Performance's Total Time field works the
// same way -- everything downstream (pace math, logged.time, cloud sync) still just wants minutes.
// A duration entered as separate hours / minutes / seconds boxes (ids <prefix>HInput, <prefix>MInput,
// <prefix>SInput), read and written as total minutes -- null when empty.
function readHmsMinutes(prefix){
  const part = x => parseInt(document.getElementById(prefix+x+'Input').value, 10) || 0;
  const total = part('H')*60 + part('M') + part('S')/60;
  return total>0 ? total : null;
}
function writeHmsMinutes(prefix, totalMin){
  const totalSec = totalMin!=null ? Math.round(totalMin*60) : 0;
  document.getElementById(prefix+'HInput').value = totalMin!=null ? Math.floor(totalSec/3600) : '';
  document.getElementById(prefix+'MInput').value = totalMin!=null ? Math.floor((totalSec%3600)/60) : '';
  document.getElementById(prefix+'SInput').value = totalMin!=null ? totalSec%60 : '';
}
// Which specific workout Log Performance is recording against: the day's own plan ('primary'), one
// of its "Additional Workouts" ('extra', by id), or one of its "Logged Workouts" ('entry', by id) --
// on any date, not just today's session, so tapping any done/past workout reopens what was logged.
function resolveLogTarget(t){
  const log = state.dayLog[t.dayKey];
  if(t.kind==='extra'){
    const w = log && (log.extraWorkouts||[]).find(x=>x.id===t.id);
    return w ? {session: w.session, completed: !!w.completed, performance: w.performance||null, record: w} : null;
  }
  if(t.kind==='entry'){
    const e = log && (log.manualEntries||[]).find(x=>x.id===t.id);
    return e ? {session: ses(e.type, e.name, e.volume||'', e.name, e.volume||''), completed: true, performance: e.performance||null, record: e} : null;
  }
  const dd = getDayData(parseDateKey(t.dayKey));
  return {session: dd.p, completed: dd.completed, performance: (log && log.performance) || null, record: null};
}
// The day's displayed session can really be its first logged entry or first extra (getDayData()'s
// rest-day fallback), or a primary that was itself promoted from the first logged entry the moment
// it was logged (promotePrimaryFromLog) -- that underlying record is what a tap should log against,
// so the same workout never ends up with two separate performance records.
function primaryLogTarget(dd){
  if(dd.primarySource==='extra') return {dayKey: dd.key, kind:'extra', id: dd.extraWorkouts[0].id};
  const first = dd.manualEntries[0];
  if(first && (dd.primarySource==='entry' || (first.type===dd.p.t && first.name===dd.p.en.title))){
    return {dayKey: dd.key, kind:'entry', id: first.id};
  }
  return {dayKey: dd.key, kind:'primary', id: null};
}
function storeLoggedPerformance(t, resolved, logged){
  if(t.kind==='extra'){
    resolved.record.performance = logged;
    if(resolved.record.supabaseId) cloudSetExtraWorkoutPerformance(resolved.record.supabaseId, logged);
  } else if(t.kind==='entry'){
    resolved.record.performance = logged;
    if(resolved.record.supabaseId) cloudSetManualEntryPerformance(resolved.record.supabaseId, logged);
  } else {
    ensureDayLog(t.dayKey).performance = logged;
    cloudSetDayPerformance(t.dayKey, logged);
  }
}
// Everything a Log Performance save means besides the performance itself, for any save that ISN'T
// today's first real recording (that one still goes through startWorkout() -- streak, Summary,
// review, progression): the workout counts as done, and a run's logged distance/time become what
// Progress and the day's own display text read.
function applyLoggedPerformance(t, resolved, logged){
  const key = t.dayKey;
  if(t.kind==='extra'){
    const w = resolved.record;
    w.completed = true;
    if(w.supabaseId) cloudSetExtraWorkoutCompleted(w.supabaseId, true);
    if(w.session.t==='run' && logged.distance!=null){
      w.actualDistance = logged.distance;
      if(w.supabaseId) cloudSetExtraWorkoutDistance(w.supabaseId, logged.distance);
    }
  } else if(t.kind==='entry'){
    const e = resolved.record;
    e.notes = logged.notes;
    if(e.type==='run'){
      e.distance = logged.distance;
      e.durationMin = logged.time;
      e.volume = [e.distance!=null ? `${e.distance} mi` : '', e.durationMin!=null ? fmtDurationClock(e.durationMin) : ''].filter(Boolean).join(' · ');
    }
    if(e.supabaseId) cloudUpdateManualEntry(e.supabaseId, e);
    syncActualRunDistanceFromEntry(key, e);
  } else {
    const idx = currentWeekIdxFor(key);
    ensureDayLog(key).completedOverride = true;
    if(idx===TODAY_IDX) state.todayCompleted = true;
    else if(idx>=0) state.week[idx].completed = true;
    cloudSetCompletedOverride(key, true);
    if(resolved.session.t==='run' && logged.distance!=null){
      ensureDayLog(key).actualRunDistance = logged.distance;
      cloudSetActualRunDistance(key, logged.distance);
    }
  }
  state.doneCount = computeDoneCount();
}
// The Record button / Start Workout always open today's workout in 'record' mode.
function openLogPerformance(extraId){
  openLogPerformanceFor({dayKey: dateKey(TODAY_DATE), kind: extraId ? 'extra' : 'primary', id: extraId || null}, 'record');
}
// mode 'record': actually doing today's workout -- starts from the plan's suggested targets and saves
// through the full Record flow (startWorkout: streak, Summary, review, progression). mode 'revisit':
// tapping a workout that's already done, or one on a past day -- shows what was logged (or the targets
// if nothing was yet) and just saves it in place. Left unset, it's inferred from the workout itself.
function openLogPerformanceFor(logTarget, mode){
  const resolved = resolveLogTarget(logTarget);
  if(!resolved) return;
  const isToday = logTarget.dayKey===dateKey(TODAY_DATE);
  if(!mode) mode = (isToday && logTarget.kind!=='entry' && !resolved.completed) ? 'record' : 'revisit';
  if(!isToday) mode = 'revisit';
  state._logTarget = logTarget;
  state._logMode = mode;
  state._activeExtraId = (isToday && logTarget.kind==='extra') ? logTarget.id : null;
  const eff = resolved.session;
  // Recording today's interval workout still means actually running its timer.
  if(eff.t==='interval' && mode==='record'){ openIntervalTimer(state._activeExtraId); return; }
  state._pendingSession = eff;
  const perf = mode==='revisit' ? resolved.performance : null;
  const exercises = exercisesForSession(eff, parseDateKey(logTarget.dayKey));
  document.getElementById('logPerfChangeExercisesBtn').hidden = !(exercises && mode==='record' && logTarget.kind!=='entry');
  const exercisesListEl = document.getElementById('logPerfExercisesList');
  logPerfSetChecks = {};
  logPerfSelectedKey = null;
  if(exercises){
    exercisesListEl.innerHTML = exercises.map(ex=>{
      const t = getExerciseTarget(ex, state.intensityIdx);
      const loggedEx = perf && perf.exercises ? perf.exercises.find(p=>p.key===ex.key) : null;
      const loggedSets = loggedEx && Array.isArray(loggedEx.sets) && loggedEx.sets.length ? loggedEx.sets : null;
      const setCount = loggedSets ? loggedSets.length : ((loggedEx && loggedEx.setCount) || ex.sets || 1);
      // A workout that's already been logged reopens showing what was actually done -- every set
      // ticked, with its real weight/reps -- instead of the plan's suggested targets.
      logPerfSetChecks[ex.key] = new Array(setCount).fill(!!loggedEx);
      const shownEx = {...ex, sets: setCount};
      const stepperHtml = `<span class="set-stepper">
          <button type="button" class="set-stepper-btn" data-step="-1" title="Remove a set">−</button>
          <button type="button" class="set-stepper-btn" data-step="1" title="Add a set">+</button>
        </span>`;
      if(ex.bodyweight){
        return `<div class="exercise-log-row bodyweight" data-exercise-key="${escapeHtml(ex.key)}">
          <div class="exercise-log-name">${escapeHtml(ex.name)}<span>${fmtExercisePrescription(shownEx)}</span>${stepperHtml}</div>
          <div class="set-check-row"></div>
        </div>`;
      }
      // Each set gets its own weight/reps pair -- a real set is rarely identical to the last (a
      // pyramid or a wave-loaded set varies on purpose), so the sheet needs to capture what
      // actually happened set by set, not one number applied to all of them.
      const setRows = Array.from({length:setCount}, (_,i)=>{
        // A pyramid starts each set from its own step of the ladder.
        const step = !loggedSets && ex.pyramid ? ex.pyramid.steps[i] : null;
        const w = loggedSets ? loggedSets[i].weight : step ? step.weight : (t?t.weight:'');
        const r = loggedSets ? loggedSets[i].reps : step ? step.reps : (t?t.reps:ex.reps);
        return `
        <div class="set-log-row" data-set-idx="${i}" data-stage="${step ? step.stage : ''}">
          <span class="set-log-num">${i+1}</span>
          <input type="number" inputmode="numeric" class="text-input" data-field="weight" data-set-idx="${i}" placeholder="${state.weightUnit}" value="${escapeHtml(String(w ?? ''))}">
          <input type="number" inputmode="numeric" class="text-input" data-field="reps" data-set-idx="${i}" value="${escapeHtml(String(r ?? ''))}">
          <button type="button" class="set-check-dot" data-set-idx="${i}">${i+1}</button>
        </div>`;
      }).join('');
      return `<div class="exercise-log-row" data-exercise-key="${escapeHtml(ex.key)}">
        <div class="exercise-log-name">${escapeHtml(ex.name)}<span>${fmtExercisePrescription(shownEx)}</span>${stepperHtml}</div>
        <div class="set-rows">${setRows}</div>
        ${ex.pyramid ? `<div class="pyr-actions">
          <button type="button" class="btn-text" data-pyr="fives">${STR[state.lang].pyrFivesBtn}</button>
          <button type="button" class="btn-text" data-pyr="single">${STR[state.lang].pyrSingleBtn}</button>
        </div>` : ''}
      </div>`;
    }).join('');
    exercisesListEl.querySelectorAll('.exercise-log-row').forEach(rowEl=>{
      const ex = exercises.find(e=>e.key===rowEl.getAttribute('data-exercise-key'));
      rowEl.querySelectorAll('.set-stepper-btn').forEach(btn=>{
        btn.addEventListener('click', (e)=>{
          e.stopPropagation(); // don't also fire the row's "pick as current exercise" click below
          const step = parseInt(btn.getAttribute('data-step'),10);
          if(step>0) addLogPerfSet(rowEl, ex); else removeLogPerfSet(rowEl, ex);
        });
      });
      if(!ex.bodyweight) rowEl.querySelectorAll('.set-check-dot').forEach(dot=> wireSetCheckDot(dot, rowEl, ex));
      rowEl.querySelectorAll('[data-pyr]').forEach(btn=> btn.addEventListener('click', e=>{
        e.stopPropagation();
        pyramidAction(rowEl, ex, btn.getAttribute('data-pyr'));
      }));
      refreshLogPerfRowState(rowEl, ex);
      // Tapping anywhere on an exercise -- its name, sets, or the weight/reps fields -- picks it
      // as the one being worked on right now, regardless of what order the list shows.
      rowEl.addEventListener('click', ()=>{
        logPerfSelectedKey = ex.key;
        refreshLogPerfCurrentHighlight();
      });
    });
    refreshLogPerfCurrentHighlight();
  } else {
    exercisesListEl.innerHTML = '';
  }
  const target = getProgressionTarget(eff, state.intensityIdx);
  document.getElementById('logPerfWeightSection').hidden = !(eff.t==='strength' && !exercises);
  document.getElementById('logPerfRepsSection').hidden = !(eff.t==='strength' && !exercises);
  document.getElementById('logPerfDistanceSection').hidden = eff.t!=='run';
  // A walk/jog asks how long they jogged without stopping -- the baseline the next sessions build from.
  const jogBlock = plannedJogBlock(eff);
  document.getElementById('logPerfJogSection').hidden = jogBlock==null;
  if(jogBlock!=null) document.getElementById('logPerfJogInput').value = (perf && perf.jogMin!=null) ? perf.jogMin : jogBlock;
  document.getElementById('logPerfTimeSection').hidden = eff.t!=='run';
  // The sheet is shared by every workout now, so every field is set explicitly on each open --
  // nothing left over from whichever workout was logged last.
  if(eff.t==='strength' && !exercises){
    document.getElementById('logPerfWeightInput').value = (perf && perf.weight!=null) ? perf.weight : (target ? target.weight : '');
    document.getElementById('logPerfRepsInput').value = (perf && perf.reps!=null) ? perf.reps : (target ? target.reps : '');
  }
  if(eff.t==='run'){
    // Whatever was actually run wins over the plan's prescribed distance -- the plan's number is
    // only a starting point for a workout that hasn't been logged yet.
    const rec = resolved.record;
    const log = state.dayLog[logTarget.dayKey];
    const knownDist = (perf && perf.distance!=null) ? perf.distance
      : mode!=='revisit' ? null
      : (logTarget.kind==='entry' && rec.distance!=null) ? rec.distance
      : (logTarget.kind==='extra' && rec.actualDistance!=null) ? rec.actualDistance
      : (logTarget.kind==='primary' && log && log.actualRunDistance!=null) ? log.actualRunDistance
      : null;
    // A timed session (walk, run/walk) has no planned distance -- the field starts empty (optional)
    // and the time starts at its planned minutes; anything else starts from the plan's miles and a
    // time at the target pace -- except for someone going by feel, who never gets a pace-based guess.
    const planned = plannedMilesOf(eff);
    const dist = knownDist!=null ? knownDist : (planned || (plannedMinutesOf(eff)!=null ? '' : 3));
    document.getElementById('logPerfDistanceInput').value = dist;
    const knownTime = (perf && perf.time!=null) ? perf.time
      : (mode==='revisit' && logTarget.kind==='entry' && rec.durationMin!=null) ? rec.durationMin
      : null;
    const guessTime = plannedMinutesOf(eff) ?? (target && dist && !isPaceFree(eff) ? target.pace*dist : null);
    writeHmsMinutes('logPerfTime', knownTime!=null ? knownTime : guessTime);
  }
  // A run that came in from Strava links back to it there.
  const stravaLink = document.getElementById('logPerfStravaLink');
  stravaLink.hidden = !(perf && perf.source==='strava' && perf.stravaId);
  if(!stravaLink.hidden) stravaLink.href = `https://www.strava.com/activities/${encodeURIComponent(perf.stravaId)}`;
  const notesInput = document.getElementById('logPerfNotesInput');
  notesInput.value = (perf && perf.notes) || (mode==='revisit' && logTarget.kind==='entry' ? (resolved.record.notes || '') : '');
  notesInput.placeholder = STR[state.lang].workoutNotesPlaceholder;
  document.getElementById('logPerfOverlay').hidden = false;
  // The panel is reused for every workout now -- start each one at the top, not wherever the last
  // one was scrolled to (usually the Save button at the bottom).
  document.querySelector('#logPerfOverlay .sheet-panel').scrollTop = 0;
}
function closeLogPerformance(){
  document.getElementById('logPerfOverlay').hidden = true;
  document.getElementById('recordBtn').classList.remove('recording');
  renderHome();
}
document.getElementById('closeLogPerf').addEventListener('click', closeLogPerformance);
document.getElementById('saveLogPerf').addEventListener('click', function(){
  const logTarget = state._logTarget || {dayKey: dateKey(TODAY_DATE), kind: state._activeExtraId ? 'extra' : 'primary', id: state._activeExtraId || null};
  const resolved = resolveLogTarget(logTarget);
  const eff = state._pendingSession || (resolved && resolved.session) || activeSession();
  const target = getProgressionTarget(eff, state.intensityIdx);
  const logged = {};
  const exercises = exercisesForSession(eff, parseDateKey(logTarget.dayKey));
  if(exercises){
    logged.exercises = [...document.querySelectorAll('#logPerfExercisesList .exercise-log-row')].map(row=>{
      const key = row.getAttribute('data-exercise-key');
      const ex = exercises.find(e=>e.key===key);
      if(ex.bodyweight){
        const actualSets = row.querySelectorAll('.set-check-dot').length;
        return {key, name: ex.name, bodyweight:true, setCount: actualSets, prescription: fmtExercisePrescription({...ex, sets: actualSets})};
      }
      const t = getExerciseTarget(ex, state.intensityIdx);
      const sets = [...row.querySelectorAll('.set-log-row')].map(setRow=>({
        weight: parseFloat(setRow.querySelector('[data-field="weight"]').value) || (t && t.weight) || 0,
        reps: parseFloat(setRow.querySelector('[data-field="reps"]').value) || (t && t.reps) || ex.reps || 0,
      }));
      // Progression tracks the heaviest ("top") set actually logged -- the same "top set" idea the
      // app already uses for a single-target strength session -- since a pyramid/wave set means
      // there's no one number that represents the whole exercise otherwise.
      const top = sets.reduce((best,s)=> s.weight>best.weight ? s : best, sets[0]);
      return {key, name: ex.name, weight: top.weight, reps: top.reps, sets, pyramid: !!ex.pyramid};
    });
  } else if(eff.t==='strength'){
    logged.weight = parseFloat(document.getElementById('logPerfWeightInput').value) || (target && target.weight) || 0;
    logged.reps = parseFloat(document.getElementById('logPerfRepsInput').value) || (target && target.reps) || 0;
  }
  if(eff.t==='run'){
    const plannedDist = plannedMilesOf(eff) || (plannedMinutesOf(eff)!=null ? null : 3);
    logged.distance = parseFloat(document.getElementById('logPerfDistanceInput').value) || plannedDist;
    const jogBlock = plannedJogBlock(eff);
    if(jogBlock!=null){
      const jog = parseFloat(document.getElementById('logPerfJogInput').value);
      if(jog>=0){ logged.jogMin = jog; recordJogBaseline(jog, jogBlock, parseDateKey(logTarget.dayKey)); }
    }
    logged.time = readHmsMinutes('logPerfTime') || plannedMinutesOf(eff) || ((target ? target.pace : 9.5)*(logged.distance || 0)) || null;
  }
  logged.notes = document.getElementById('logPerfNotesInput').value.trim();
  document.getElementById('logPerfOverlay').hidden = true;
  if(!resolved){ startWorkout(logged); return; }
  storeLoggedPerformance(logTarget, resolved, logged);
  // Recording today's workout is still the full Record flow (streak, Summary, review, progression).
  // A revisit -- a past day, a logged entry, or reopening one that's already done to correct it --
  // just saves what was logged and stays put, so re-saving a done workout never re-runs progression.
  if(state._logMode!=='revisit'){
    if(!document.getElementById('dayDetailOverlay').hidden) closeDayDetail();
    startWorkout(logged);
    return;
  }
  applyLoggedPerformance(logTarget, resolved, logged);
  document.getElementById('recordBtn').classList.remove('recording');
  refreshViews();
  showToast(STR[state.lang].workoutLoggedToast);
});

document.getElementById('recordBtn').addEventListener('click', function(){
  if(this.classList.contains('disabled') || this.classList.contains('done') || this.classList.contains('recording')) return;
  if(todaySession().t==='interval'){ openIntervalTimer(); return; }
  this.classList.add('recording');
  document.getElementById('recordLabel').textContent = STR[state.lang].recordingLabel;
  setTimeout(openLogPerformance, 900);
});

// Today's own planned workout was just done: it's completed, the first recording of the day counts
// toward streak/total workouts, and a run's distance counts toward mileage. Shared by the Record flow
// (startWorkout) and a run imported from Strava (fileStravaRun).
function recordTodayPrimary(eff, logged){
  // Recording today's primary session again -- correcting a mistaken entry, or re-recording after
  // toggling "not done" back on to unlock the Record button again -- must not count as a SECOND
  // distinct day trained. isTodayDone() can't tell the two cases apart (toggling "not done" resets
  // it), so this tracks the actual calendar date last counted instead: only the FIRST time a given
  // day is recorded bumps streak/total-workouts, no matter how many times it's re-recorded after.
  const todayKeyStr = dateKey(TODAY_DATE);
  const alreadyCountedToday = state.lastCountedDate === todayKeyStr;
  state.todayCompleted = true;
  // Actually recording a workout is the strongest possible "this is done" signal there is, so it
  // must always win over an earlier explicit "mark as not done" toggle -- otherwise a stale
  // override could silently hide a workout the user just completed for real.
  const log = state.dayLog[todayKeyStr];
  if(log) log.completedOverride = null;
  cloudSetCompletedOverride(todayKeyStr, null);
  state.doneCount = computeDoneCount();
  if(!alreadyCountedToday){
    state.streak += 1;
    if(state.streak > state.bestStreak) state.bestStreak = state.streak;
    state.totalWorkouts += 1;
    state.lastCountedDate = todayKeyStr;
  }
  if(eff.t==='run'){
    // The distance actually run (from the Log Performance sheet) is what should count toward
    // mileage totals -- falling back to the plan's prescribed distance only if none was entered.
    // Re-recording today replaces its previous distance contribution rather than stacking on top
    // of it, for the same reason as the streak/totalWorkouts guard above.
    const mi = (logged && logged.distance!=null) ? logged.distance : plannedMilesOf(eff);
    const dayLog = ensureDayLog(dateKey(TODAY_DATE));
    const prevMi = dayLog.actualRunDistance!=null ? dayLog.actualRunDistance : 0;
    const delta = +(mi-prevMi).toFixed(1);
    state.totalDistance = +(state.totalDistance+delta).toFixed(1);
    dayLog.actualRunDistance = mi;
    cloudSetActualRunDistance(dateKey(TODAY_DATE), mi);
  }
}
function startWorkout(logged){
  const eff = activeSession();
  const extraId = state._activeExtraId;
  if(extraId){
    // Completing an extra (non-primary) workout for today only marks that one workout done -- the
    // primary slot, streak, and total-workouts count stay exactly as they were, the same way
    // logging a plain manual entry already doesn't touch those either. Distance is the one
    // exception: a run is a run regardless of which slot it was logged under, so an extra run's
    // actual distance still counts toward weekly/lifetime mileage (see weekStats()).
    const w = findExtraWorkout(dateKey(TODAY_DATE), extraId);
    if(w){
      w.completed = true;
      if(eff.t==='run'){
        // Re-logging the same extra workout (e.g. correcting a mistaken distance) replaces its
        // previous contribution instead of stacking on top of it -- otherwise re-recording the
        // same workout twice silently inflates the running mileage totals a second time.
        const mi = (logged && logged.distance!=null) ? logged.distance : plannedMilesOf(eff);
        const prevMi = w.actualDistance!=null ? w.actualDistance : 0;
        const delta = +(mi-prevMi).toFixed(1);
        w.actualDistance = mi;
        state.totalDistance = +(state.totalDistance+delta).toFixed(1);
        if(w.supabaseId) cloudSetExtraWorkoutDistance(w.supabaseId, mi);
      }
      if(w.supabaseId) cloudSetExtraWorkoutCompleted(w.supabaseId, true);
    }
    state.doneCount = computeDoneCount();
  } else {
    recordTodayPrimary(eff, logged);
  }
  state._lastSession = eff;
  state._lastLogged = logged || null;
  // Progression isn't calculated yet -- it waits for the post-workout review (rating gates whether
  // a met target actually counts as "advance", same idea the old feel-chip used to serve, just
  // moved to right after seeing the Summary screen instead of before it).
  state._lastProgressed = false;
  state._reviewSubmitted = false;
  saveProfileToCloud(); // streak / totals just changed
  showScreen('summary');
}

/* ---------------- interval timer ---------------- */
let timerState = null; // {rounds, workSec, restSec, roundNum, phase, remainingMs, running, started, tickHandle, lastBeepSecond}
let audioCtx = null;
function getAudioCtx(){
  if(!audioCtx){
    const AC = window.AudioContext || window.webkitAudioContext;
    if(AC) audioCtx = new AC();
  }
  return audioCtx;
}
function playTone(freq, durationMs){
  try{
    const ctx = getAudioCtx();
    if(!ctx) return;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    // Quick attack up to a loud peak, HOLD there for most of the tone's length (rather than an
    // instant spike-and-decay), then a short fade-out -- makes it read as a genuinely loud tone
    // rather than a quiet click. The actual loudness the user hears still scales with the device's
    // own volume control, same as any other audio -- this just raises what we ask for at 100%.
    const durSec = durationMs/1000;
    const decayStart = Math.max(0.015, durSec - 0.06);
    gain.gain.setValueAtTime(0.0001, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.85, ctx.currentTime+0.015);
    gain.gain.exponentialRampToValueAtTime(0.85, ctx.currentTime+decayStart);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+durSec);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + durSec + 0.02);
  }catch(e){ /* audio is a nice-to-have, never block the timer over it */ }
}
function playBeep(){ playTone(880, 140); }
function playBell(){ playTone(1200, 500); }
// "Ready"/"Go"/"Stop" are always spoken in English regardless of the app's display language --
// they're short, universal gym-timer commands, not content that needs translating.
const TIMER_VOICE_CUES = {ready:'Ready', go:'Go', stop:'Stop'};
// Web Speech API voices don't carry a real "gender" field -- this is a best-effort name match
// against common male voice names across Chrome/Safari/Android/iOS, falling back to whatever
// isn't a recognizably female name, then to whatever's available at all.
function pickMaleVoice(){
  try{
    const voices = window.speechSynthesis.getVoices() || [];
    if(!voices.length) return null;
    const english = voices.filter(v=>v.lang && v.lang.toLowerCase().startsWith('en'));
    const pool = english.length ? english : voices;
    const maleHint = /\bmale\b|david|daniel|alex\b|fred|george|james|mark\b|tom\b|guy|ryan|brian|aaron|arthur|gordon|oliver|thomas/i;
    const femaleHint = /\bfemale\b|samantha|victoria|karen|susan|zira|siri|fiona|moira|tessa|kate\b|amy\b|emma\b|joanna|salli|kimberly|allison|ava\b/i;
    return pool.find(v=>maleHint.test(v.name))
      || pool.find(v=>!femaleHint.test(v.name))
      || pool[0];
  }catch(e){ return null; }
}
function speakCue(text){
  try{
    if(!window.speechSynthesis || typeof SpeechSynthesisUtterance==='undefined') return;
    const utter = new SpeechSynthesisUtterance(text);
    utter.rate = 1.1;
    utter.volume = 1; // the Web Speech API's ceiling -- there's no way to amplify a voice past this
    utter.pitch = 0.8; // a deeper pitch reads as a fuller, more male, more commanding voice
    utter.lang = 'en-US';
    const voice = pickMaleVoice();
    if(voice) utter.voice = voice;
    window.speechSynthesis.cancel(); // don't let cues queue/overlap if triggered in quick succession
    window.speechSynthesis.speak(utter);
  }catch(e){ /* speech is a nice-to-have, never block the timer over it */ }
}

const TIMER_COUNTDOWN_SEC = 5;
function defaultTimerState(cfg){
  return {
    rounds: cfg.rounds, workSec: cfg.workSec, restSec: cfg.restSec,
    roundNum: 1, phase: 'countdown', remainingMs: TIMER_COUNTDOWN_SEC*1000,
    running: false, started: false, tickHandle: null, lastBeepSecond: null,
  };
}
function openIntervalTimer(extraId){
  state._activeExtraId = extraId || null;
  const eff = activeSession();
  const cfg = eff.interval || {rounds:6, workSec:180, restSec:60};
  timerState = defaultTimerState(cfg);
  renderTimerUI();
  document.getElementById('intervalTimerOverlay').hidden = false;
}
function closeIntervalTimer(){
  stopTimerTick();
  cancelHoldEnd();
  document.getElementById('intervalTimerOverlay').hidden = true;
}
document.getElementById('closeIntervalTimer').addEventListener('click', closeIntervalTimer);

function renderTimerUI(){
  const L = STR[state.lang];
  const ts = timerState;
  if(!ts) return;
  document.getElementById('timerRoundsVal').textContent = ts.rounds;
  document.getElementById('timerWorkVal').textContent = fmtClock(ts.workSec);
  document.getElementById('timerRestVal').textContent = fmtClock(ts.restSec);
  document.getElementById('timerConfigRow').style.display = ts.started ? 'none' : 'flex';
  const phaseEl = document.getElementById('timerPhaseLabel');
  const roundEl = document.getElementById('timerRoundLabel');
  const displayEl = document.getElementById('timerDisplay');
  const startPauseBtn = document.getElementById('timerStartPauseBtn');
  const resetBtn = document.getElementById('timerResetBtn');
  const finishBtn = document.getElementById('timerFinishBtn');
  const holdEndBtn = document.getElementById('timerHoldEndBtn');
  if(ts.phase==='done'){
    phaseEl.textContent = L.timerCompleteLabel;
    phaseEl.className = 'timer-phase';
    roundEl.textContent = '';
    displayEl.textContent = '🎉';
    displayEl.classList.remove('urgent');
    startPauseBtn.hidden = true;
    resetBtn.hidden = true;
    finishBtn.hidden = false;
    holdEndBtn.hidden = true;
    cancelHoldEnd();
    return;
  }
  finishBtn.hidden = true;
  startPauseBtn.hidden = false;
  resetBtn.hidden = false;
  // Ending the workout early doesn't make sense during the pre-start countdown -- nothing has
  // actually started yet, so Reset/close are the only exits there.
  holdEndBtn.hidden = !ts.started || ts.phase==='countdown';
  phaseEl.textContent = ts.phase==='countdown' ? L.timerGetReadyLabel : (ts.phase==='work' ? L.timerWorkPhase : L.timerRestPhase);
  phaseEl.className = 'timer-phase ' + ts.phase;
  roundEl.textContent = L.timerRoundOf.replace('{n}', ts.roundNum).replace('{total}', ts.rounds);
  const secLeft = Math.max(0, Math.ceil(ts.remainingMs/1000));
  displayEl.textContent = fmtClock(secLeft);
  displayEl.classList.toggle('urgent', secLeft<=3);
  startPauseBtn.textContent = ts.running ? L.timerPauseBtn : (ts.started ? L.timerResumeBtn : L.timerStartBtn);
}
function stopTimerTick(){
  if(timerState && timerState.tickHandle){ clearInterval(timerState.tickHandle); timerState.tickHandle = null; }
}
function advanceTimerPhase(){
  const ts = timerState;
  ts.lastBeepSecond = null;
  // The voice cue is spoken first (before the tone) since text-to-speech engines have a startup
  // delay before any sound actually comes out -- firing it first, then the near-instant Web Audio
  // tone, lands the two closer together than the other order would.
  if(ts.phase==='countdown'){
    speakCue(TIMER_VOICE_CUES.go);
    playBell();
    ts.phase = 'work';
    ts.remainingMs = ts.workSec*1000;
  } else if(ts.phase==='work'){
    speakCue(TIMER_VOICE_CUES.stop);
    playBell();
    ts.phase = 'rest';
    ts.remainingMs = ts.restSec*1000;
  } else if(ts.roundNum >= ts.rounds){
    playBell();
    stopTimerTick();
    ts.phase = 'done';
    ts.running = false;
    renderTimerUI();
    return;
  } else {
    speakCue(TIMER_VOICE_CUES.go);
    playBell();
    ts.roundNum += 1;
    ts.phase = 'work';
    ts.remainingMs = ts.workSec*1000;
  }
  renderTimerUI();
}
function startTimerTick(){
  const ts = timerState;
  // "Ready" fires once, right when the pre-start countdown first begins -- not on every
  // resume-from-pause, which is why this checks !ts.started before that flips to true below.
  if(ts.phase==='countdown' && !ts.started) speakCue(TIMER_VOICE_CUES.ready);
  ts.running = true;
  ts.started = true;
  ts.lastTick = Date.now();
  ts.tickHandle = setInterval(()=>{
    const now = Date.now();
    const elapsed = now - ts.lastTick;
    ts.lastTick = now;
    ts.remainingMs -= elapsed;
    const secLeft = Math.ceil(ts.remainingMs/1000);
    if(secLeft<=3 && secLeft>=1 && secLeft!==ts.lastBeepSecond){
      ts.lastBeepSecond = secLeft;
      playBeep();
    }
    if(ts.remainingMs<=0){ advanceTimerPhase(); return; }
    renderTimerUI();
  }, 200);
  renderTimerUI();
}

// Ending mid-workout requires a deliberate press-and-hold (rather than a single tap) so an

const HOLD_END_MS = 1100;
let holdEndRAF = null, holdEndTimeout = null, holdEndStart = 0;
function cancelHoldEnd(){
  if(holdEndTimeout){ clearTimeout(holdEndTimeout); holdEndTimeout = null; }
  if(holdEndRAF){ cancelAnimationFrame(holdEndRAF); holdEndRAF = null; }
  const fill = document.querySelector('#timerHoldEndBtn .hold-end-fill');

function tickHoldEndFill(){

const DRAG_LONG_PRESS_MS = 220;
// A real finger is never perfectly still during a hold -- 16px was tight enough that ordinary
// touch jitter (not an intentional scroll) could cancel the long-press before it ever armed,
// making the drag hard to trigger reliably on a phone.
const DRAG_MOVE_CANCEL_PX = 28;
function setupDayRowInteraction(wrap){
  wrap.querySelectorAll('.plan-row').forEach(row=>{
    const idx = parseInt(row.getAttribute('data-flat-idx'),10);
    const draggable = row.getAttribute('data-draggable')==='1';
    let timer=null, dragging=false, moved=false, startX=0, startY=0, lastY=0, targetRow=null, previewRows=[], slotCenters=null;

    const addBtn = row.querySelector('.prow-add');
    if(addBtn){
      addBtn.addEventListener('click', ()=>{
        addWorkoutForDate(dateKey(allPlanDates()[idx]));
      });
    }

    function clearTimer(){ if(timer){ clearTimeout(timer); timer=null; } }
    function rowAt(flatIdx){
      return wrap.querySelector(`.plan-row[data-flat-idx="${flatIdx}"]`);
    }
    function captureSlotGeometry(){
      // Snapshot each draggable row's un-transformed center once, across the WHOLE loaded Plan
      // list (every week block), before any live-preview shifting starts. Using this static
      // geometry (rather than elementFromPoint) to pick the drop target means it keeps working
      // correctly even once other rows start animating out of the way -- elementFromPoint would
      // otherwise hit whatever row has animated to that pixel, not the row that logically belongs
      // there.
      slotCenters = [];
      wrap.querySelectorAll('.plan-row[data-draggable="1"]').forEach(r=>{
        const rect = r.getBoundingClientRect();
        slotCenters.push({ flatIdx: parseInt(r.getAttribute('data-flat-idx'),10), center: rect.top+rect.height/2, top: rect.top, bottom: rect.top+rect.height });
      });
    }
    function nearestSlot(clientY){
      if(!slotCenters || !slotCenters.length) return null;
      const minY = Math.min(...slotCenters.map(s=>s.top)) - 24;
      const maxY = Math.max(...slotCenters.map(s=>s.bottom)) + 24;
      if(clientY<minY || clientY>maxY) return null;
      let best = slotCenters[0], bestDist = Math.abs(clientY-slotCenters[0].center);
      for(const s of slotCenters){
        const d = Math.abs(clientY-s.center);
        if(d<bestDist){ bestDist=d; best=s; }
      }
      return best.flatIdx;
    }
    function clearPreview(){
      previewRows.forEach(r=>{ r.style.transform=''; r.classList.remove('shifting'); });
      previewRows = [];
    }
    function applyPreview(targetIdx){
      clearPreview();
      if(targetIdx===idx) return;
      const step = idx < targetIdx ? 1 : -1;
      const shiftPct = step===1 ? -100 : 100;
      for(let i=idx+step; ; i+=step){
        const r = rowAt(i);
        if(r){ r.style.transform = `translateY(${shiftPct}%)`; r.classList.add('shifting'); previewRows.push(r); }
        if(i===targetIdx) break;
      }
    }
    function onMove(e){
      const dx = e.clientX-startX, dy = e.clientY-startY;
      if(!dragging){
        if(Math.abs(dx)>DRAG_MOVE_CANCEL_PX || Math.abs(dy)>DRAG_MOVE_CANCEL_PX){ moved=true; clearTimer(); }
        // Draggable rows own their touch gestures (so a real long-press-drag isn't stolen by
        // page scroll), which means a plain swipe needs the scroll forwarded here by hand.
        if(draggable && moved && e.pointerType!=='mouse'){
          document.getElementById('screen-week').scrollTop -= (e.clientY - lastY);
        }
        lastY = e.clientY;
        return;
      }
      if(e.cancelable) e.preventDefault();
      row.style.transform = `translateY(${dy}px)`;
      const nearestIdx = nearestSlot(e.clientY);
      const nextTarget = (nearestIdx!==null && nearestIdx!==idx) ? rowAt(nearestIdx) : null;
      if(nextTarget !== targetRow){
        if(targetRow) targetRow.classList.remove('drop-target');
        targetRow = nextTarget;
        if(targetRow){
          targetRow.classList.add('drop-target');
          applyPreview(parseInt(targetRow.getAttribute('data-flat-idx'),10));
        } else {
          clearPreview();
        }
      }
    }
    function endDrag(commit){
      clearTimer();
      if(dragging){
        row.classList.remove('dragging');
        row.style.transform = '';
        if(targetRow) targetRow.classList.remove('drop-target');
        clearPreview();
        if(commit && targetRow){
          const targetIdx = parseInt(targetRow.getAttribute('data-flat-idx'),10);
          reorderAcrossPlan(idx, targetIdx);
          refreshViews();
          showToast(STR[state.lang].toastUpdated);
        }
      }
      dragging=false; targetRow=null; slotCenters=null;
      row.removeEventListener('pointermove', onMove);
      row.removeEventListener('pointerup', onUp);
      row.removeEventListener('pointercancel', onCancel);
    }
    function onUp(){
      const wasDragging = dragging;
      const wasMoved = moved;
      endDrag(true);
      if(wasDragging || wasMoved) return;
      // A plain tap (no hold, no movement) previews a future workout, and otherwise opens Day Detail
      // -- the only way to move a day is a genuine press-and-hold drag now.
      const date = allPlanDates()[idx];
      const dd = getDayData(date);
      if(dd.isFuture && dd.p.t!=='rest') openWorkoutPreview(dateKey(date));
      else openDayDetail(dateKey(date));
    }
    function onCancel(){ endDrag(false); }

    row.addEventListener('pointerdown', (e)=>{
      if(e.target.closest('button, .chip')) return;
      startX = e.clientX; startY = e.clientY; lastY = e.clientY; moved = false;
      if(draggable){
        timer = setTimeout(()=>{
          dragging = true;
          captureSlotGeometry();
          row.classList.add('dragging');
          try{ row.setPointerCapture(e.pointerId); }catch(err){}
        }, DRAG_LONG_PRESS_MS);
      }
      row.addEventListener('pointermove', onMove);
      row.addEventListener('pointerup', onUp);
      row.addEventListener('pointercancel', onCancel);
    });
  });
}

// A day's workout, short enough for a calendar cell: a short name ("Long", "Upper", "Walk") and its
// amount ("8 mi", "45 min") -- plus "+1" etc. when the day has more workouts than that. Rest days stay blank.
const CAL_SHORT_NAMES = {
  'Easy Run':{en:'Easy', es:'Suave'}, 'Long Run':{en:'Long', es:'Larga'}, 'Recovery Jog':{en:'Recovery', es:'Recup.'},
  'Tempo Run':{en:'Tempo', es:'Tempo'}, 'Interval Run':{en:'Intervals', es:'Series'}, 'Fartlek Run':{en:'Fartlek', es:'Fartlek'},
  'Hill Repeats':{en:'Hills', es:'Cuestas'}, 'Easy Run + Strides':{en:'Strides', es:'Progres.'},
  'Run/Walk':{en:'Run/Walk', es:'Correr/ Caminar'}, 'Brisk Walk':{en:'Walk', es:'Caminata'},
  'Full Body Strength':{en:'Full Body', es:'Cuerpo compl.'}, 'Upper Body Strength':{en:'Upper', es:'Superior'},
  'Lower Body Strength':{en:'Lower', es:'Inferior'}, 'Push Day Strength':{en:'Push', es:'Empuje'}, 'Pull Day Strength':{en:'Pull', es:'Tracción'},
  'Rest Day':{en:'', es:''},
};
function calendarDescHtml(dd){
  if(dd.p.t==='rest') return '<span class="mo-desc"></span>';
  const baseTitle = dd.p.en.title.replace(/ B$/, '');
  const short = CAL_SHORT_NAMES[baseTitle];
  const title = short ? short[state.lang] : ST(dd.p).title;
  const amount = (ST(dd.p).detail || '').split(' · ')[0];
  // Everything else that day, not counting whichever record the headline itself is (see primaryLogTarget).
  const head = primaryLogTarget(dd);
  const more = dd.extraWorkouts.filter(w=> !(head.kind==='extra' && head.id===w.id)).length
    + dd.manualEntries.filter(e=> !(head.kind==='entry' && head.id===e.id)).length;
  return `<span class="mo-desc">
      <span class="mo-desc-t">${escapeHtml(title)}</span>
      ${amount || more ? `<span class="mo-desc-a">${escapeHtml(amount)}${more ? `${amount?' ':''}+${more}` : ''}</span>` : ''}
    </span>`;
}
function renderCalendar(){
  ensureWeek();
  const base = new Date(TODAY_DATE.getFullYear(), TODAY_DATE.getMonth(), 1);
  const viewMonth = addMonths(base, state.calMonthOffset);
  const year = viewMonth.getFullYear(), month = viewMonth.getMonth();
  document.getElementById('calRange').textContent = `${MONTHS_FULL[state.lang][month]} ${year}`;
  document.getElementById('calPrev').disabled = state.calMonthOffset<=CAL_MIN_OFFSET;
  document.getElementById('calNext').disabled = state.calMonthOffset>=CAL_MAX_OFFSET;

  document.getElementById('calWeekdayRow').innerHTML = DAY_NAMES_SHORT[state.lang].map(n=>`<span>${n[0]}</span>`).join('');

  const firstDow = (new Date(year,month,1).getDay()+6)%7;
  const numDays = new Date(year, month+1, 0).getDate();
  const totalCells = Math.ceil((firstDow+numDays)/7)*7;

  let html = '';
  for(let cellIdx=0; cellIdx<totalCells; cellIdx++){
    const dayNum = cellIdx - firstDow + 1;
    if(dayNum<1 || dayNum>numDays){ html += `<div class="mo-cell outside"></div>`; continue; }
    const date = new Date(year, month, dayNum);
    const dd = getDayData(date);
    const status = statusClassFor(dayDataStatus(dd), dd.isToday);
    html += `<div class="mo-cell ${status}" data-date="${dd.key}">
      <span class="mo-num">${dayNum}</span>
      ${calendarDescHtml(dd)}
      <span class="mo-dot"></span>
    </div>`;
  }
  const grid = document.getElementById('calGrid');
  grid.innerHTML = html;
  grid.querySelectorAll('.mo-cell:not(.outside)').forEach(cell=>{
    cell.addEventListener('click', ()=> openDayDetail(cell.getAttribute('data-date')));
  });
}

let wp = null; // {dayKey, target: {kind:'primary'} | {kind:'extra', id}, editIdx, choice, tuneIdx, fromLog, changed}
// fromLog: opened from Log Performance mid-workout -- only the exercises can be changed there (no
// skipping the workout or jumping to the day's options), and Log Performance is rebuilt on close if
// anything changed.
function openWorkoutPreview(dayKey, target, opts){
  wp = {dayKey, target: target || {kind:'primary'}, editIdx:null, choice:null, tuneIdx:null, fromLog: !!(opts && opts.fromLog), changed:false};
  // Opened by tapping one exercise (Today card): go straight to that lift's numbers.
  if(opts && opts.tuneKey){
    const r = previewedWorkout();
    const exs = r && exercisesForSession(r.session, parseDateKey(dayKey));
    const idx = exs ? exs.findIndex(ex=>ex.key===opts.tuneKey) : -1;
    if(idx>=0) wp.tuneIdx = idx;
  }
  renderWorkoutPreview();
  if(!wp) return;
  document.getElementById('wpSkipWorkoutBtn').hidden = wp.fromLog;
  document.getElementById('wpDayOptionsBtn').hidden = wp.fromLog;
  document.getElementById('workoutPreviewOverlay').hidden = false;
  document.querySelector('#workoutPreviewOverlay .sheet-panel').scrollTop = 0;
}
function closeWorkoutPreview(){
  document.getElementById('workoutPreviewOverlay').hidden = true;
  const was = wp;
  wp = null;
  if(was && was.fromLog && was.changed && !document.getElementById('logPerfOverlay').hidden){
    openLogPerformanceFor(state._logTarget, state._logMode);
  }
}
// The workout being previewed: the day's own (which may really be its first Additional Workout, on a
// day with nothing else planned), or one of its Additional Workouts.
function previewedWorkout(){
  if(wp.target.kind==='extra'){
    const w = findExtraWorkout(wp.dayKey, wp.target.id);
    return w ? {session: w.session, c: null, extra: w} : null;
  }
  const dd = getDayData(parseDateKey(wp.dayKey));
  if(dd.primarySource==='extra'){ wp.target = {kind:'extra', id: dd.extraWorkouts[0].id}; return previewedWorkout(); }
  return {session: dd.p, c: dd.c, extra: null};
}
function exerciseRxText(ex){
  let text = fmtExercisePrescription(ex);
  if(ex.pyramid) return `${text} · ${STR[state.lang].pyramidTop.replace('{w}', ex.pyramid.top)} ${state.weightUnit}`;
  if(!ex.bodyweight){
    const t = getExerciseTarget(ex, state.intensityIdx);
    if(t && t.weight) text += ` · ${t.weight} ${state.weightUnit}`;
  }
  return text;
}
function renderWorkoutPreview(){

    document.getElementById('wpBreakdownSection').hidden = !steps;
    document.getElementById('wpBreakdown').innerHTML = steps ? steps.map(st=>`<div class="wp-ex">
        <div class="wp-ex-main">
          <div class="wp-ex-name">${escapeHtml(st.label)}${st.amount ? ` <span class="wp-step-amount">${escapeHtml(st.amount)}</span>` : ''}</div>
          <div class="wp-ex-rx">${escapeHtml(st.note)}</div>

  const exSection = document.getElementById('wpExerciseSection');
