name: Android release (Play Store)

# Builds the Android app as a signed App Bundle (.aab), the file Google Play takes, and keeps it with the
# run (Actions -> this run -> Artifacts). Started by hand: Actions -> "Android release (Play Store)" -> Run
# workflow. Each run gets a higher version code, which Play requires for every upload.
#
# Signed with your upload key, kept in four repository secrets (Settings -> Secrets and variables ->
# Actions):
#   ANDROID_UPLOAD_KEYSTORE           the .keystore file, base64-encoded
#   ANDROID_UPLOAD_KEYSTORE_PASSWORD  its password
#   ANDROID_UPLOAD_KEY_ALIAS          the key's alias inside it
#   ANDROID_UPLOAD_KEY_PASSWORD       the key's password (often the same as the keystore's)
# With Play App Signing (the default for new apps), Google signs what users install with its own key; this
# one only proves an upload came from you, and Play can reset it if it's ever lost.
#
# Unlike the test APK (android-test-apk.yml), this build doesn't check the website for newer test builds.

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version people see in the store (for example 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: read

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check the upload key is set
        env:
          KS: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
          KS_PASS: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KS" ] || missing="$missing ANDROID_UPLOAD_KEYSTORE"
          [ -n "$KS_PASS" ] || missing="$missing ANDROID_UPLOAD_KEYSTORE_PASSWORD"
          [ -n "$ALIAS" ] || missing="$missing ANDROID_UPLOAD_KEY_ALIAS"
          [ -n "$KEY_PASS" ] || missing="$missing ANDROID_UPLOAD_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Add these repository secrets first (Settings -> Secrets and variables -> Actions):$missing"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22   # Capacitor 8 needs Node 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21   # Capacitor 8's Android project builds with Java 21

      - name: Install packages
        run: npm ci

      # The same build stamp the website gets (see deploy-pages.yml) -- but no test-app id, so the store
      # app never offers the test APK.
      - name: Stamp build
        run: |
          sed -i "s/__ALTIRO_BUILD__/${GITHUB_SHA}/" www/index.html
          printf '{"build":"%s"}\n' "$GITHUB_SHA" > www/version.json
          npm install --prefix /tmp/esb --no-save esbuild@0.24.0
          NODE_PATH=/tmp/esb/node_modules node scripts/minify-inline.js www/index.html

      - name: Create the Android project
        run: |
          npx cap add android
          npx cap sync android
          node scripts/native-config.js

      - name: App icons and splash screen
        run: npx capacitor-assets generate --android --iconBackgroundColor '#000000' --iconBackgroundColorDark '#000000' --splashBackgroundColor '#0a0a0a' --splashBackgroundColorDark '#0a0a0a'

      - name: Version
        env:
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          echo "$VERSION_NAME" | grep -Eq '^[0-9]+(\.[0-9]+){1,3}$' || { echo "::error::Version should look like 1.0.0"; exit 1; }
          sed -i -E "s/versionCode [0-9]+/versionCode ${GITHUB_RUN_NUMBER}/; s/versionName \"[^\"]*\"/versionName \"${VERSION_NAME}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Build the App Bundle
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      # (An App Bundle is signed with jarsigner, as Google's docs describe.)
      - name: Sign it with the upload key
        env:
          KS: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
          KS_PASS: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          out="Altiro-${VERSION_NAME}-${GITHUB_RUN_NUMBER}.aab"
          cp android/app/build/outputs/bundle/release/app-release.aab "$out"
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore "$RUNNER_TEMP/upload.keystore" -storepass:env KS_PASS -keypass:env KEY_PASS \
            "$out" "$ALIAS"
          jarsigner -verify "$out" | tail -1
          rm -f "$RUNNER_TEMP/upload.keystore"
          echo "AAB=$out" >> "$GITHUB_ENV"

      - name: Keep the App Bundle with this run
        uses: actions/upload-artifact@v4
        with:
          name: Altiro-play-${{ inputs.version_name }}-${{ github.run_number }}
          path: ${{ env.AAB }}
          retention-days: 30
