    recBtn.classList.add('done');
    recIcon.innerHTML = ICONS.checkSm;
    recLabel.textContent = L.recordDoneLabel;
  } else {
    recIcon.innerHTML = TYPE_ICON[eff.t];
    recLabel.textContent = eff.t==='interval' ? L.startTimerLabel : L.recordActionLabel;
  }
}

/* ---------------- progression programming ---------------- */
function progressionKey(session){
  return session.t + ':' + session.en.title;
}
function seedProgressionTarget(session, intensityIdx){
  const tier = INTENSITY[intensityIdx];
  if(session.t==='strength'){
    return {weight: [95,135,195][intensityIdx], reps: [12,10,5][intensityIdx]};
  }
  if(session.t==='run'){
    return {pace: tier.pace};
  }
  return null;
}
function getProgressionTarget(session, intensityIdx){
  const key = progressionKey(session);
  if(!state.progression[key]){
    const seeded = seedProgressionTarget(session, intensityIdx);
    if(!seeded) return null;
    state.progression[key] = seeded;
  }
  return state.progression[key];
}
// Per-exercise progression -- exercise weight targets live in the same state.progression map as
// whole-session targets, just keyed by the exercise's stable name instead of a session title. This
// is the same key shape (and the same map) that a matching Personal Record already writes into via
// applyPRToProgression, so a PR for "Bench Press" and a generated Push Day's "Bench Press" exercise
// share one progression trail automatically.
function exerciseProgressionKey(exerciseKey){
  return 'strength:' + exerciseKey;
}
function seedExerciseTarget(ex, intensityIdx){
  if(ex.bodyweight) return null; // nothing to load/track -- just a sets x reps (or duration) prescription
  const base = [95,135,195][intensityIdx];
  return {weight: Math.round(base*(ex.seedFactor||0.5)/5)*5, reps: ex.reps || 10};
}
function getExerciseTarget(ex, intensityIdx){
  const key = exerciseProgressionKey(ex.key);
  if(!state.progression[key]){
    const seeded = seedExerciseTarget(ex, intensityIdx);
    if(!seeded) return null;
    state.progression[key] = seeded;
  }
  return state.progression[key];
}
function saveExerciseTarget(exerciseKey, target){
  state.progression[exerciseProgressionKey(exerciseKey)] = target;
  cloudSaveProgressionTarget({t:'strength', en:{title:exerciseKey}}, target);
}
function applyProgressionResult(session, logged){
  state._lastProgressed = false;
  if(!logged) return;
  if(logged.exercises && logged.exercises.length){
    // Structured strength session -- advance each exercise independently.
    let advanced = 0, total = 0;
    logged.exercises.forEach(res=>{
      if(res.bodyweight) return;
      total++;
      const target = state.progression[exerciseProgressionKey(res.key)];
      if(!target) return;
      const met = res.reps >= target.reps && logged.feel !== 'hard';
      if(met){ target.weight += 5; advanced++; saveExerciseTarget(res.key, target); }
    });
    state._lastProgressed = advanced>0;
    state._lastProgressedCount = advanced;
    state._lastProgressedTotal = total;
    return;
  }
  if(session.t!=='strength' && session.t!=='run') return;
  const target = getProgressionTarget(session, state.intensityIdx);
  if(!target) return;
  if(session.t==='strength'){
    const met = logged.reps >= target.reps && logged.feel !== 'hard';
    if(met){ target.weight += 5; state._lastProgressed = true; }
  } else if(session.t==='run'){
    const dist = logged.distance!=null ? logged.distance : (parseFloat(session.en.detail) || 3);
    const actualPace = dist>0 ? logged.time/dist : target.pace;
    const met = actualPace <= target.pace+0.05 && logged.feel !== 'hard';
    if(met){ target.pace = Math.max(4.0, +(target.pace-5/60).toFixed(3)); state._lastProgressed = true; }
  }
}

/* ---------------- log performance sheet ---------------- */
// Live, per-set completion tracking while a structured strength workout is being logged -- purely
// a doing-the-workout UX aid (ticking off each set as it's finished, with the next unfinished
// exercise auto-highlighted), reset fresh every time the sheet opens. It doesn't change what
// actually gets saved -- the weight/reps fields next to it remain the source of truth for that.
let logPerfSetChecks = {}; // {exerciseKey: [bool, ...]}
// Which exercise the user has explicitly tapped to work on -- overrides the "first unfinished
// exercise" auto-highlight, so someone who can't do them in the listed order (e.g. the squat rack
// is taken) can jump straight to whichever one they're actually doing next.
let logPerfSelectedKey = null;
function refreshLogPerfRowState(rowEl, ex){
  const checks = logPerfSetChecks[ex.key];
  const allChecked = checks.every(Boolean);
  rowEl.classList.toggle('set-complete', allChecked);
  if(ex.bodyweight){
    // No per-set weight/reps to preserve here, so it's safe to just fully redraw the dots.
    const dotsEl = rowEl.querySelector('.set-check-row');
    dotsEl.innerHTML = checks.map((c,i)=>`<button type="button" class="set-check-dot ${c?'checked':''}" data-set-idx="${i}">${c?ICONS.checkSm:i+1}</button>`).join('');
    dotsEl.querySelectorAll('.set-check-dot').forEach(dot=>{
      dot.addEventListener('click', ()=>{
        const idx = parseInt(dot.getAttribute('data-set-idx'),10);
        checks[idx] = !checks[idx];
        refreshLogPerfRowState(rowEl, ex);
        refreshLogPerfCurrentHighlight();
      });
    });
  } else {
    // Each set has its own weight/reps inputs (so a pyramid/wave set -- 60x10, 70x10, 90x5 -- can
    // be logged as it actually happened) that must never get wiped by a re-render, so only the
    // check button's own state is touched here, not the row's markup.
    rowEl.querySelectorAll('.set-check-dot').forEach(dot=>{
      const idx = parseInt(dot.getAttribute('data-set-idx'),10);
      dot.classList.toggle('checked', checks[idx]);
      dot.innerHTML = checks[idx] ? ICONS.checkSm : String(idx+1);
    });
  }
}
function updateLogPerfPrescriptionLabel(rowEl, ex){
  const label = rowEl.querySelector('.exercise-log-name span');
  if(label) label.textContent = fmtExercisePrescription({...ex, sets: logPerfSetChecks[ex.key].length});
}
const LOG_PERF_MAX_SETS = 12;
// The prescribed set count is just a starting suggestion -- the user might do one more, or cut a
// set short, so it's editable live while the workout is being logged.
function addLogPerfSet(rowEl, ex){
  const checks = logPerfSetChecks[ex.key];
  if(checks.length>=LOG_PERF_MAX_SETS) return;
  const idx = checks.length;
  checks.push(false);
  if(!ex.bodyweight){
    const setRowsEl = rowEl.querySelector('.set-rows');
    const existingRows = [...setRowsEl.querySelectorAll('.set-log-row')];
    const last = existingRows[existingRows.length-1];
    const t = getExerciseTarget(ex, state.intensityIdx);
    // A new set starts from whatever the last set currently shows -- closer to what the user
    // will actually do next than resetting back to the original seeded target.
    const lastWeight = last ? last.querySelector('[data-field="weight"]').value : (t?t.weight:'');
    const lastReps = last ? last.querySelector('[data-field="reps"]').value : (t?t.reps:ex.reps);
    const div = document.createElement('div');
    div.className = 'set-log-row';
    div.setAttribute('data-set-idx', String(idx));
    div.innerHTML = `<span class="set-log-num">${idx+1}</span>
      <input type="number" inputmode="numeric" class="text-input" data-field="weight" data-set-idx="${idx}" placeholder="${state.weightUnit}" value="${escapeHtml(lastWeight)}">
      <input type="number" inputmode="numeric" class="text-input" data-field="reps" data-set-idx="${idx}" value="${escapeHtml(lastReps)}">
      <button type="button" class="set-check-dot" data-set-idx="${idx}">${idx+1}</button>`;
    setRowsEl.appendChild(div);
    div.querySelector('.set-check-dot').addEventListener('click', ()=>{
      checks[idx] = !checks[idx];
      refreshLogPerfRowState(rowEl, ex);
      refreshLogPerfCurrentHighlight();
    });
  }
  updateLogPerfPrescriptionLabel(rowEl, ex);
  refreshLogPerfRowState(rowEl, ex);
  refreshLogPerfCurrentHighlight();
}
function removeLogPerfSet(rowEl, ex){
  const checks = logPerfSetChecks[ex.key];
  if(checks.length<=1) return;
  checks.pop();
  if(!ex.bodyweight){
    const setRowsEl = rowEl.querySelector('.set-rows');
    const rowsEls = setRowsEl.querySelectorAll('.set-log-row');
    rowsEls[rowsEls.length-1].remove();
  }
  updateLogPerfPrescriptionLabel(rowEl, ex);
  refreshLogPerfRowState(rowEl, ex);
  refreshLogPerfCurrentHighlight();
}
// "Select the next workout and sets" -- once an exercise's sets are all checked off, highlight the
// next not-yet-finished exercise as the current one automatically, unless the user has explicitly
// picked a different (still-unfinished) one to work on instead.
function refreshLogPerfCurrentHighlight(){
  const rows = [...document.querySelectorAll('#logPerfExercisesList .exercise-log-row')];
  const selectedRow = logPerfSelectedKey
    ? rows.find(r=>r.getAttribute('data-exercise-key')===logPerfSelectedKey && !r.classList.contains('set-complete'))
    : null;
  if(selectedRow){
    rows.forEach(r=> r.classList.toggle('current-exercise', r===selectedRow));
    return;
  }
  logPerfSelectedKey = null; // the picked exercise finished (or was never valid) -- fall back to auto
  let foundCurrent = false;
  rows.forEach(r=>{
    const isCurrent = !r.classList.contains('set-complete') && !foundCurrent;
    if(isCurrent) foundCurrent = true;
    r.classList.toggle('current-exercise', isCurrent);
  });
}
function openLogPerformance(extraId){
  state._activeExtraId = extraId || null;
  const eff = activeSession();
  if(eff.t==='interval'){ openIntervalTimer(extraId); return; }
  state._pendingSession = eff;
  const exercises = exercisesForSession(eff);
  const exercisesListEl = document.getElementById('logPerfExercisesList');
  logPerfSetChecks = {};
  logPerfSelectedKey = null;
  if(exercises){
    exercisesListEl.innerHTML = exercises.map(ex=>{
      const t = getExerciseTarget(ex, state.intensityIdx);
      const setCount = ex.sets||1;
      logPerfSetChecks[ex.key] = new Array(setCount).fill(false);
      const stepperHtml = `<span class="set-stepper">
          <button type="button" class="set-stepper-btn" data-step="-1" title="Remove a set">−</button>
          <button type="button" class="set-stepper-btn" data-step="1" title="Add a set">+</button>
        </span>`;
      if(ex.bodyweight){
        return `<div class="exercise-log-row bodyweight" data-exercise-key="${escapeHtml(ex.key)}">
          <div class="exercise-log-name">${escapeHtml(ex.name)}<span>${fmtExercisePrescription(ex)}</span>${stepperHtml}</div>
          <div class="set-check-row"></div>
        </div>`;
      }
      // Each set gets its own weight/reps pair -- a real set is rarely identical to the last (a
      // pyramid or a wave-loaded set varies on purpose), so the sheet needs to capture what
      // actually happened set by set, not one number applied to all of them.
      const setRows = Array.from({length:setCount}, (_,i)=>`
        <div class="set-log-row" data-set-idx="${i}">
          <span class="set-log-num">${i+1}</span>
          <input type="number" inputmode="numeric" class="text-input" data-field="weight" data-set-idx="${i}" placeholder="${state.weightUnit}" value="${t?t.weight:''}">
          <input type="number" inputmode="numeric" class="text-input" data-field="reps" data-set-idx="${i}" value="${t?t.reps:ex.reps}">
          <button type="button" class="set-check-dot" data-set-idx="${i}">${i+1}</button>
        </div>`).join('');
      return `<div class="exercise-log-row" data-exercise-key="${escapeHtml(ex.key)}">
        <div class="exercise-log-name">${escapeHtml(ex.name)}<span>${fmtExercisePrescription(ex)}</span>${stepperHtml}</div>
        <div class="set-rows">${setRows}</div>
      </div>`;
    }).join('');
    exercisesListEl.querySelectorAll('.exercise-log-row').forEach(rowEl=>{
      const ex = exercises.find(e=>e.key===rowEl.getAttribute('data-exercise-key'));
      rowEl.querySelectorAll('.set-stepper-btn').forEach(btn=>{
        btn.addEventListener('click', (e)=>{

          const step = parseInt(btn.getAttribute('data-step'),10);

      });
      if(!ex.bodyweight){
        const checks = logPerfSetChecks[ex.key];
        rowEl.querySelectorAll('.set-check-dot').forEach(dot=>{
          dot.addEventListener('click', ()=>{
            const idx = parseInt(dot.getAttribute('data-set-idx'),10);
            checks[idx] = !checks[idx];
            refreshLogPerfRowState(rowEl, ex);
            refreshLogPerfCurrentHighlight();
          });
        });
      }
      refreshLogPerfRowState(rowEl, ex);
      // Tapping anywhere on an exercise -- its name, sets, or the weight/reps fields -- picks it
      // as the one being worked on right now, regardless of what order the list shows.
      rowEl.addEventListener('click', ()=>{
        logPerfSelectedKey = ex.key;
        refreshLogPerfCurrentHighlight();
      });
    });
    refreshLogPerfCurrentHighlight();
  } else {
    exercisesListEl.innerHTML = '';
  }
  const target = getProgressionTarget(eff, state.intensityIdx);
  document.getElementById('logPerfWeightSection').hidden = !(eff.t==='strength' && !exercises);
  document.getElementById('logPerfRepsSection').hidden = !(eff.t==='strength' && !exercises);
  document.getElementById('logPerfDistanceSection').hidden = eff.t!=='run';
  document.getElementById('logPerfTimeSection').hidden = eff.t!=='run';

    document.getElementById('logPerfWeightInput').value = target.weight;
    document.getElementById('logPerfRepsInput').value = target.reps;
  }
  if(eff.t==='run'){
    // Prefilled with the plan's prescribed distance as a starting point -- editable, since what
    // actually gets run rarely matches the plan exactly, and that's what should count everywhere
    // else (Summary, pace, weekly/total mileage).
    const dist = parseFloat(eff.en.detail) || 3;
    document.getElementById('logPerfDistanceInput').value = dist;
    if(target) document.getElementById('logPerfTimeInput').value = Math.round(target.pace*dist);
  }
  const notesInput = document.getElementById('logPerfNotesInput');
  notesInput.value = '';
  notesInput.placeholder = STR[state.lang].workoutNotesPlaceholder;
  document.getElementById('logPerfOverlay').hidden = false;
}
function closeLogPerformance(){
  document.getElementById('logPerfOverlay').hidden = true;
  document.getElementById('recordBtn').classList.remove('recording');
  renderHome();
}
document.getElementById('closeLogPerf').addEventListener('click', closeLogPerformance);
document.getElementById('saveLogPerf').addEventListener('click', function(){
  const eff = state._pendingSession || activeSession();
  const target = getProgressionTarget(eff, state.intensityIdx);
  const logged = {};
  const exercises = exercisesForSession(eff);
  if(exercises){
    logged.exercises = [...document.querySelectorAll('#logPerfExercisesList .exercise-log-row')].map(row=>{
      const key = row.getAttribute('data-exercise-key');
      const ex = exercises.find(e=>e.key===key);
      if(ex.bodyweight){
        const actualSets = row.querySelectorAll('.set-check-dot').length;
        return {key, name: ex.name, bodyweight:true, prescription: fmtExercisePrescription({...ex, sets: actualSets})};
      }
      const t = getExerciseTarget(ex, state.intensityIdx);
      const sets = [...row.querySelectorAll('.set-log-row')].map(setRow=>({
        weight: parseFloat(setRow.querySelector('[data-field="weight"]').value) || (t && t.weight) || 0,
        reps: parseFloat(setRow.querySelector('[data-field="reps"]').value) || (t && t.reps) || ex.reps || 0,
      }));
      // Progression tracks the heaviest ("top") set actually logged -- the same "top set" idea the
      // app already uses for a single-target strength session -- since a pyramid/wave set means
      // there's no one number that represents the whole exercise otherwise.
      const top = sets.reduce((best,s)=> s.weight>best.weight ? s : best, sets[0]);
      return {key, name: ex.name, weight: top.weight, reps: top.reps, sets};
    });
  } else if(eff.t==='strength'){
    logged.weight = parseFloat(document.getElementById('logPerfWeightInput').value) || (target && target.weight) || 0;
    logged.reps = parseFloat(document.getElementById('logPerfRepsInput').value) || (target && target.reps) || 0;
  }
  if(eff.t==='run'){
    const plannedDist = parseFloat(eff.en.detail) || 3;
    logged.distance = parseFloat(document.getElementById('logPerfDistanceInput').value) || plannedDist;
    logged.time = parseFloat(document.getElementById('logPerfTimeInput').value) || ((target ? target.pace : 9.5)*logged.distance);
  }
  logged.notes = document.getElementById('logPerfNotesInput').value.trim();

document.getElementById('recordBtn').addEventListener('click', function(){
  if(this.classList.contains('disabled') || this.classList.contains('done') || this.classList.contains('recording')) return;
  if(todaySession().t==='interval'){ openIntervalTimer(); return; }
  this.classList.add('recording');
  document.getElementById('recordLabel').textContent = STR[state.lang].recordingLabel;
  setTimeout(openLogPerformance, 900);
});

function startWorkout(logged){
  const eff = activeSession();
  const extraId = state._activeExtraId;
  if(extraId){
    // Completing an extra (non-primary) workout for today only marks that one workout done -- the
    // primary slot, streak, and total-workouts count stay exactly as they were, the same way
    // logging a plain manual entry already doesn't touch those either. Distance is the one
    // exception: a run is a run regardless of which slot it was logged under, so an extra run's
    // actual distance still counts toward weekly/lifetime mileage (see weekStats()).
    const w = findExtraWorkout(dateKey(TODAY_DATE), extraId);
    if(w){
      w.completed = true;
      if(eff.t==='run'){
        // Re-logging the same extra workout (e.g. correcting a mistaken distance) replaces its
        // previous contribution instead of stacking on top of it -- otherwise re-recording the
        // same workout twice silently inflates the running mileage totals a second time.
        const mi = (logged && logged.distance!=null) ? logged.distance : (parseFloat(eff.en.detail)||0);
        const prevMi = w.actualDistance!=null ? w.actualDistance : 0;
        const delta = +(mi-prevMi).toFixed(1);
        w.actualDistance = mi;
        state.mileage = +(state.mileage+delta).toFixed(1);
        state.totalDistance = +(state.totalDistance+delta).toFixed(1);
        if(w.supabaseId) cloudSetExtraWorkoutDistance(w.supabaseId, mi);
      }
      if(w.supabaseId) cloudSetExtraWorkoutCompleted(w.supabaseId, true);
    }
    state.doneCount = computeDoneCount();
  } else {
    // Recording today's primary session again -- correcting a mistaken entry, or re-recording after
    // toggling "not done" back on to unlock the Record button again -- must not count as a SECOND
    // distinct day trained. isTodayDone() can't tell the two cases apart (toggling "not done" resets
    // it), so this tracks the actual calendar date last counted instead: only the FIRST time a given
    // day is recorded bumps streak/total-workouts, no matter how many times it's re-recorded after.
    const todayKeyStr = dateKey(TODAY_DATE);
    const alreadyCountedToday = state.lastCountedDate === todayKeyStr;
    state.todayCompleted = true;
    // Actually recording a workout is the strongest possible "this is done" signal there is, so it
    // must always win over an earlier explicit "mark as not done" toggle -- otherwise a stale
    // override could silently hide a workout the user just completed for real.
    const log = state.dayLog[todayKeyStr];
    if(log) log.completedOverride = null;
    cloudSetCompletedOverride(todayKeyStr, null);
    state.doneCount = computeDoneCount();
    if(!alreadyCountedToday){
      state.streak += 1;
      if(state.streak > state.bestStreak) state.bestStreak = state.streak;
      state.totalWorkouts += 1;
      state.lastCountedDate = todayKeyStr;
    }
    if(eff.t==='run'){
      // The distance actually run (from the Log Performance sheet) is what should count toward
      // mileage totals -- falling back to the plan's prescribed distance only if none was entered.
      // Re-recording today replaces its previous distance contribution rather than stacking on top
      // of it, for the same reason as the streak/totalWorkouts guard above.
      const mi = (logged && logged.distance!=null) ? logged.distance : (parseFloat(eff.en.detail)||0);
      const dayLog = ensureDayLog(dateKey(TODAY_DATE));
      const prevMi = dayLog.actualRunDistance!=null ? dayLog.actualRunDistance : 0;
      const delta = +(mi-prevMi).toFixed(1);
      state.mileage = +(state.mileage+delta).toFixed(1);
      state.totalDistance = +(state.totalDistance+delta).toFixed(1);
      dayLog.actualRunDistance = mi;
      cloudSetActualRunDistance(dateKey(TODAY_DATE), mi);
    }
  }
  state._lastSession = eff;
  state._lastLogged = logged || null;
  // Progression isn't calculated yet -- it waits for the post-workout review (rating gates whether
  // a met target actually counts as "advance", same idea the old feel-chip used to serve, just
  // moved to right after seeing the Summary screen instead of before it).
  state._lastProgressed = false;
  state._reviewSubmitted = false;
  saveProfileToCloud(); // streak / totals just changed
  showScreen('summary');
}

/* ---------------- interval timer ---------------- */
let timerState = null; // {rounds, workSec, restSec, roundNum, phase, remainingMs, running, started, tickHandle, lastBeepSecond}
let audioCtx = null;
function getAudioCtx(){
  if(!audioCtx){
    const AC = window.AudioContext || window.webkitAudioContext;
    if(AC) audioCtx = new AC();
  }
  return audioCtx;
}
function playTone(freq, durationMs){
  try{
    const ctx = getAudioCtx();
    if(!ctx) return;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    // Quick attack up to a loud peak, HOLD there for most of the tone's length (rather than an
    // instant spike-and-decay), then a short fade-out -- makes it read as a genuinely loud tone
    // rather than a quiet click. The actual loudness the user hears still scales with the device's
    // own volume control, same as any other audio -- this just raises what we ask for at 100%.
    const durSec = durationMs/1000;
    const decayStart = Math.max(0.015, durSec - 0.06);
    gain.gain.setValueAtTime(0.0001, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.85, ctx.currentTime+0.015);
    gain.gain.exponentialRampToValueAtTime(0.85, ctx.currentTime+decayStart);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+durSec);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + durSec + 0.02);
  }catch(e){ /* audio is a nice-to-have, never block the timer over it */ }
}
function playBeep(){ playTone(880, 140); }
function playBell(){ playTone(1200, 500); }
// "Ready"/"Go"/"Stop" are always spoken in English regardless of the app's display language --
// they're short, universal gym-timer commands, not content that needs translating.
const TIMER_VOICE_CUES = {ready:'Ready', go:'Go', stop:'Stop'};
// Web Speech API voices don't carry a real "gender" field -- this is a best-effort name match
// against common male voice names across Chrome/Safari/Android/iOS, falling back to whatever
// isn't a recognizably female name, then to whatever's available at all.
function pickMaleVoice(){
  try{
    const voices = window.speechSynthesis.getVoices() || [];
    if(!voices.length) return null;
    const english = voices.filter(v=>v.lang && v.lang.toLowerCase().startsWith('en'));
    const pool = english.length ? english : voices;
    const maleHint = /\bmale\b|david|daniel|alex\b|fred|george|james|mark\b|tom\b|guy|ryan|brian|aaron|arthur|gordon|oliver|thomas/i;
    const femaleHint = /\bfemale\b|samantha|victoria|karen|susan|zira|siri|fiona|moira|tessa|kate\b|amy\b|emma\b|joanna|salli|kimberly|allison|ava\b/i;
    return pool.find(v=>maleHint.test(v.name))
      || pool.find(v=>!femaleHint.test(v.name))
      || pool[0];
  }catch(e){ return null; }
}
function speakCue(text){
  try{
    if(!window.speechSynthesis || typeof SpeechSynthesisUtterance==='undefined') return;
    const utter = new SpeechSynthesisUtterance(text);
    utter.rate = 1.1;
    utter.volume = 1; // the Web Speech API's ceiling -- there's no way to amplify a voice past this
    utter.pitch = 0.8; // a deeper pitch reads as a fuller, more male, more commanding voice
    utter.lang = 'en-US';
    const voice = pickMaleVoice();
    if(voice) utter.voice = voice;
    window.speechSynthesis.cancel(); // don't let cues queue/overlap if triggered in quick succession
    window.speechSynthesis.speak(utter);
  }catch(e){ /* speech is a nice-to-have, never block the timer over it */ }
}

const TIMER_COUNTDOWN_SEC = 5;
function defaultTimerState(cfg){
  return {
    rounds: cfg.rounds, workSec: cfg.workSec, restSec: cfg.restSec,
    roundNum: 1, phase: 'countdown', remainingMs: TIMER_COUNTDOWN_SEC*1000,
    running: false, started: false, tickHandle: null, lastBeepSecond: null,
  };
}
function openIntervalTimer(extraId){
  state._activeExtraId = extraId || null;
  const eff = activeSession();
  const cfg = eff.interval || {rounds:6, workSec:180, restSec:60};
  timerState = defaultTimerState(cfg);
  renderTimerUI();
  document.getElementById('intervalTimerOverlay').hidden = false;
}

  stopTimerTick();

  document.getElementById('intervalTimerOverlay').hidden = true;
}

function renderTimerUI(){
  const L = STR[state.lang];
  const ts = timerState;
  if(!ts) return;
  document.getElementById('timerRoundsVal').textContent = ts.rounds;
  document.getElementById('timerWorkVal').textContent = fmtClock(ts.workSec);
  document.getElementById('timerRestVal').textContent = fmtClock(ts.restSec);
  document.getElementById('timerConfigRow').style.display = ts.started ? 'none' : 'flex';
  const phaseEl = document.getElementById('timerPhaseLabel');
  const roundEl = document.getElementById('timerRoundLabel');
  const displayEl = document.getElementById('timerDisplay');
  const startPauseBtn = document.getElementById('timerStartPauseBtn');
  const resetBtn = document.getElementById('timerResetBtn');
  const finishBtn = document.getElementById('timerFinishBtn');
  const holdEndBtn = document.getElementById('timerHoldEndBtn');
  if(ts.phase==='done'){
    phaseEl.textContent = L.timerCompleteLabel;
    phaseEl.className = 'timer-phase';
    roundEl.textContent = '';
    displayEl.textContent = '🎉';
    displayEl.classList.remove('urgent');
    startPauseBtn.hidden = true;
    resetBtn.hidden = true;
    finishBtn.hidden = false;
    holdEndBtn.hidden = true;
    cancelHoldEnd();
    return;
  }
  finishBtn.hidden = true;
  startPauseBtn.hidden = false;
  resetBtn.hidden = false;
  // Ending the workout early doesn't make sense during the pre-start countdown -- nothing has
  // actually started yet, so Reset/close are the only exits there.
  holdEndBtn.hidden = !ts.started || ts.phase==='countdown';
  phaseEl.textContent = ts.phase==='countdown' ? L.timerGetReadyLabel : (ts.phase==='work' ? L.timerWorkPhase : L.timerRestPhase);
  phaseEl.className = 'timer-phase ' + ts.phase;
  roundEl.textContent = L.timerRoundOf.replace('{n}', ts.roundNum).replace('{total}', ts.rounds);
  const secLeft = Math.max(0, Math.ceil(ts.remainingMs/1000));
  displayEl.textContent = fmtClock(secLeft);
  displayEl.classList.toggle('urgent', secLeft<=3);
  startPauseBtn.textContent = ts.running ? L.timerPauseBtn : (ts.started ? L.timerResumeBtn : L.timerStartBtn);
}
function stopTimerTick(){
  if(timerState && timerState.tickHandle){ clearInterval(timerState.tickHandle); timerState.tickHandle = null; }
}
function advanceTimerPhase(){
  const ts = timerState;
  ts.lastBeepSecond = null;
  // The voice cue is spoken first (before the tone) since text-to-speech engines have a startup
  // delay before any sound actually comes out -- firing it first, then the near-instant Web Audio
  // tone, lands the two closer together than the other order would.
  if(ts.phase==='countdown'){
    speakCue(TIMER_VOICE_CUES.go);
    playBell();
    ts.phase = 'work';
    ts.remainingMs = ts.workSec*1000;
  } else if(ts.phase==='work'){
    speakCue(TIMER_VOICE_CUES.stop);
    playBell();
    ts.phase = 'rest';
    ts.remainingMs = ts.restSec*1000;
  } else if(ts.roundNum >= ts.rounds){
    playBell();
    stopTimerTick();
    ts.phase = 'done';
    ts.running = false;
    renderTimerUI();
    return;
  } else {
    speakCue(TIMER_VOICE_CUES.go);
    playBell();
    ts.roundNum += 1;
    ts.phase = 'work';
    ts.remainingMs = ts.workSec*1000;
  }
  renderTimerUI();
}
function startTimerTick(){
  const ts = timerState;
  // "Ready" fires once, right when the pre-start countdown first begins -- not on every
  // resume-from-pause, which is why this checks !ts.started before that flips to true below.
  if(ts.phase==='countdown' && !ts.started) speakCue(TIMER_VOICE_CUES.ready);
  ts.running = true;
  ts.started = true;
  ts.lastTick = Date.now();
  ts.tickHandle = setInterval(()=>{
    const now = Date.now();
    const elapsed = now - ts.lastTick;
    ts.lastTick = now;
    ts.remainingMs -= elapsed;
    const secLeft = Math.ceil(ts.remainingMs/1000);
    if(secLeft<=3 && secLeft>=1 && secLeft!==ts.lastBeepSecond){
      ts.lastBeepSecond = secLeft;
      playBeep();
    }
    if(ts.remainingMs<=0){ advanceTimerPhase(); return; }
    renderTimerUI();
  }, 200);
  renderTimerUI();
}
document.getElementById('timerStartPauseBtn').addEventListener('click', ()=>{
  if(!timerState) return;
  if(timerState.running){ stopTimerTick(); timerState.running=false; renderTimerUI(); }
  else{ startTimerTick(); }
});
document.getElementById('timerResetBtn').addEventListener('click', ()=>{
  if(!timerState) return;
  stopTimerTick();
  cancelHoldEnd();
  timerState = defaultTimerState({rounds:timerState.rounds, workSec:timerState.workSec, restSec:timerState.restSec});
  renderTimerUI();
});
// Ending mid-workout requires a deliberate press-and-hold (rather than a single tap) so an
// accidental touch on the timer screen can't cut a real workout short.
const HOLD_END_MS = 1100;
let holdEndRAF = null, holdEndTimeout = null, holdEndStart = 0;
function cancelHoldEnd(){
  if(holdEndTimeout){ clearTimeout(holdEndTimeout); holdEndTimeout = null; }
  if(holdEndRAF){ cancelAnimationFrame(holdEndRAF); holdEndRAF = null; }
  const fill = document.querySelector('#timerHoldEndBtn .hold-end-fill');
  if(fill) fill.style.width = '0%';
}
function tickHoldEndFill(){
  const fill = document.querySelector('#timerHoldEndBtn .hold-end-fill');
  const pct = Math.min(100, (Date.now()-holdEndStart)/HOLD_END_MS*100);
  if(fill) fill.style.width = pct+'%';
  if(pct<100) holdEndRAF = requestAnimationFrame(tickHoldEndFill);
}
function concludeWorkoutEarly(){
  if(!timerState) return;
  const rounds = timerState.roundNum;
  stopTimerTick();
  closeIntervalTimer();
  startWorkout({rounds});
}
const holdEndBtn = document.getElementById('timerHoldEndBtn');
holdEndBtn.addEventListener('pointerdown', (e)=>{
  e.preventDefault();
  if(!timerState || timerState.phase==='done') return;
  holdEndStart = Date.now();
  tickHoldEndFill();
  holdEndTimeout = setTimeout(concludeWorkoutEarly, HOLD_END_MS);
});
['pointerup','pointerleave','pointercancel'].forEach(evt=>holdEndBtn.addEventListener(evt, cancelHoldEnd));
document.querySelectorAll('#intervalTimerOverlay [data-field]').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    if(!timerState || timerState.started) return; // locked once the timer has actually run
    const field = btn.getAttribute('data-field');

    if(field==='rest') timerState.restSec = Math.max(5, timerState.restSec+step);
    renderTimerUI();

const DRAG_LONG_PRESS_MS = 220;
// A real finger is never perfectly still during a hold -- 16px was tight enough that ordinary
// touch jitter (not an intentional scroll) could cancel the long-press before it ever armed,
// making the drag hard to trigger reliably on a phone.
const DRAG_MOVE_CANCEL_PX = 28;
function setupDayRowInteraction(wrap){
  wrap.querySelectorAll('.plan-row').forEach(row=>{
    const idx = parseInt(row.getAttribute('data-day'),10);
    const weekIdx = parseInt(row.getAttribute('data-week-idx'),10);
    const draggable = row.getAttribute('data-draggable')==='1';
    let timer=null, dragging=false, moved=false, startX=0, startY=0, lastY=0, targetRow=null, previewRows=[], slotCenters=null;

    function clearTimer(){ if(timer){ clearTimeout(timer); timer=null; } }
    function rowAt(dayIdx){
      const scope = row.closest('.week-block') || wrap;
      return scope.querySelector(`.plan-row[data-day="${dayIdx}"]`);
    }
    function captureSlotGeometry(){
      // Snapshot each draggable row's un-transformed center once, before any live-preview
      // shifting starts. Using this static geometry (rather than elementFromPoint) to pick the
      // drop target means it keeps working correctly even once other rows start animating out
      // of the way -- elementFromPoint would otherwise hit whatever row has animated to that
      // pixel, not the row that logically belongs there.
      const scope = row.closest('.week-block') || wrap;
      slotCenters = [];
      scope.querySelectorAll('.plan-row[data-draggable="1"]').forEach(r=>{
        const rect = r.getBoundingClientRect();
        slotCenters.push({ dayIdx: parseInt(r.getAttribute('data-day'),10), center: rect.top+rect.height/2, top: rect.top, bottom: rect.top+rect.height });
      });
    }
    function nearestSlot(clientY){
      if(!slotCenters || !slotCenters.length) return null;
      const minY = Math.min(...slotCenters.map(s=>s.top)) - 24;
      const maxY = Math.max(...slotCenters.map(s=>s.bottom)) + 24;
      if(clientY<minY || clientY>maxY) return null;
      let best = slotCenters[0], bestDist = Math.abs(clientY-slotCenters[0].center);
      for(const s of slotCenters){
        const d = Math.abs(clientY-s.center);
        if(d<bestDist){ bestDist=d; best=s; }
      }
      return best.dayIdx;
    }
    function clearPreview(){
      previewRows.forEach(r=>{ r.style.transform=''; r.classList.remove('shifting'); });
      previewRows = [];
    }
    function applyPreview(targetIdx){
      clearPreview();
      if(targetIdx===idx) return;
      const step = idx < targetIdx ? 1 : -1;
      const shiftPct = step===1 ? -100 : 100;
      for(let i=idx+step; ; i+=step){
        const r = rowAt(i);
        if(r){ r.style.transform = `translateY(${shiftPct}%)`; r.classList.add('shifting'); previewRows.push(r); }
        if(i===targetIdx) break;
      }
    }
    function onMove(e){
      const dx = e.clientX-startX, dy = e.clientY-startY;
      if(!dragging){
        if(Math.abs(dx)>DRAG_MOVE_CANCEL_PX || Math.abs(dy)>DRAG_MOVE_CANCEL_PX){ moved=true; clearTimer(); }
        // Draggable rows own their touch gestures (so a real long-press-drag isn't stolen by
        // page scroll), which means a plain swipe needs the scroll forwarded here by hand.
        if(draggable && moved && e.pointerType!=='mouse'){
          document.getElementById('screen-week').scrollTop -= (e.clientY - lastY);
        }
        lastY = e.clientY;
        return;
      }
      if(e.cancelable) e.preventDefault();
      row.style.transform = `translateY(${dy}px)`;
      const nearestIdx = nearestSlot(e.clientY);
      const nextTarget = (nearestIdx!==null && nearestIdx!==idx) ? rowAt(nearestIdx) : null;
      if(nextTarget !== targetRow){
        if(targetRow) targetRow.classList.remove('drop-target');
        targetRow = nextTarget;
        if(targetRow){
          targetRow.classList.add('drop-target');
          applyPreview(parseInt(targetRow.getAttribute('data-day'),10));
        } else {
          clearPreview();
        }
      }
    }
    function endDrag(commit){
      clearTimer();
      if(dragging){
        row.classList.remove('dragging');
        row.style.transform = '';
        if(targetRow) targetRow.classList.remove('drop-target');
        clearPreview();
        if(commit && targetRow){
          const targetIdx = parseInt(targetRow.getAttribute('data-day'),10);
          reorderWithinWeek(weekIdx, idx, targetIdx);
          renderWeek(); renderHome(); renderCalendar();
          showToast(STR[state.lang].toastUpdated);
        }
      }
      dragging=false; targetRow=null; slotCenters=null;
      row.removeEventListener('pointermove', onMove);
      row.removeEventListener('pointerup', onUp);
      row.removeEventListener('pointercancel', onCancel);
    }
    function onUp(){
      const wasDragging = dragging;
      const wasMoved = moved;
      endDrag(true);
      if(!wasDragging && !wasMoved){
        openDayDetail(dateKey(weekDates(weekIdx)[idx]));
      }
    }
    function onCancel(){ endDrag(false); }

    row.addEventListener('pointerdown', (e)=>{
      if(e.target.closest('button, .chip')) return;
      startX = e.clientX; startY = e.clientY; lastY = e.clientY; moved = false;
      if(draggable){
        timer = setTimeout(()=>{
          dragging = true;
          captureSlotGeometry();
          row.classList.add('dragging');
          try{ row.setPointerCapture(e.pointerId); }catch(err){}
        }, DRAG_LONG_PRESS_MS);
      }
      row.addEventListener('pointermove', onMove);
      row.addEventListener('pointerup', onUp);
      row.addEventListener('pointercancel', onCancel);
    });
  });
}

/* ---------------- manual workout entry sheet ---------------- */
// "Create Workout" is the single entry point for telling the app about a workout, whether it
// already happened (logged, like the old "+ Add a Workout") or hasn't yet (planned, like the old
// "Plan a Workout"). The "Mark as Completed" toggle is what used to be two separate buttons.
let manualEntryType = 'strength';
let createMarkCompleted = true;
let manualExercises = []; // {key, name, sets, reps} -- optional, user-built sets/reps list for a strength entry
// true when Create Workout was opened by tapping the day's existing primary plan bubble to revise
// it -- saving should update that same plan in place, not fork off a second/"extra" workout for
// the day. False (the default, from the "+ Create Workout" button) always adds a fresh workout.
let manualEntryEditingPrimary = false;
// Set to an existing manualEntries id when Create Workout was opened by tapping an already-logged
// workout bubble in the "Logged Workouts" list to revise it -- saving updates that same entry in
// place instead of appending a new one. Null (the default, from the "+ Create Workout" button)
// always logs a genuinely new entry.
let manualEntryEditingId = null;
function renderManualTypeRow(){
  const L = STR[state.lang];
  const row = document.getElementById('manualTypeRow');
  const types = [['run', L.typeCardio], ['strength', L.typeWeightTraining], ['interval', L.typeInterval]];
  row.innerHTML = types.map(([t,label])=>`<button type="button" class="type-btn ${t===manualEntryType?'sel':''}" data-type="${t}">${MANUAL_TYPE_ICON[t]}<span>${label}</span></button>`).join('');
  row.querySelectorAll('.type-btn').forEach(b=>{
    b.addEventListener('click', ()=>{ manualEntryType = b.getAttribute('data-type'); renderManualTypeRow(); updateCreateTargetSections(); });
  });
}
function updateCreateNameLabel(){
  document.getElementById('createNameLabel').textContent = createMarkCompleted ? STR[state.lang].manualNameLabel : STR[state.lang].planNameLabel;
}
function updateCreateTargetSections(){
  const showTargets = !createMarkCompleted && (manualEntryType==='strength' || manualEntryType==='run');
  // Once a real exercise breakdown is being built, the single session-level weight x reps target
  // is redundant (and its progression data would go unused, since a structured session progresses
  // each exercise on its own) -- so it only shows while the exercise list is still empty.
  const hasExercises = manualEntryType==='strength' && manualExercises.length>0;
  document.getElementById('createWeightSection').hidden = !(showTargets && manualEntryType==='strength') || hasExercises;
  document.getElementById('createRepsSection').hidden = !(showTargets && manualEntryType==='strength') || hasExercises;
  document.getElementById('createPaceSection').hidden = !(showTargets && manualEntryType==='run');
  document.getElementById('createIntervalSection').hidden = manualEntryType!=='interval';
  // Available for any strength entry, planned or already-done -- separate from the single weight x
  // reps target above, which stays as a fallback for a quick plan that doesn't need a full exercise
  // breakdown.
  document.getElementById('createExercisesSection').hidden = manualEntryType!=='strength';
  // An interval workout is completed by actually running its timer, not by a checkbox, so the
  // usual "Mark as Completed" toggle doesn't apply here -- always plan it, never a plain log entry.
  document.getElementById('createCompletedSection').hidden = manualEntryType==='interval';
  // A cardio entry that's already done gets the structured Date/Duration/Distance/Pace layout
  // instead of the generic free-text Volume field -- planning a future run (not yet done) still
  // uses the simpler pace-target field above, since there's no real distance/duration to record yet.
  const isCardioLog = manualEntryType==='run' && createMarkCompleted;
  document.getElementById('cardioLogSection').hidden = !isCardioLog;
  document.getElementById('manualVolumeSection').hidden = isCardioLog;
}
function updateManualPaceDisplay(){
  const dur = parseFloat(document.getElementById('manualDurationInput').value);
  const dist = parseFloat(document.getElementById('manualDistanceInput').value);
  const paceEl = document.getElementById('manualPaceDisplay');
  paceEl.textContent = (dur>0 && dist>0) ? fmtPace(dur/dist)+'/mi' : '-:--/mi';
}
document.getElementById('manualDurationInput').addEventListener('input', updateManualPaceDisplay);
document.getElementById('manualDistanceInput').addEventListener('input', updateManualPaceDisplay);
function renderManualExercisesList(){
  const L = STR[state.lang];
  const listEl = document.getElementById('createExercisesList');
  listEl.innerHTML = manualExercises.map((ex,i)=>`<div class="exercise-build-row" data-idx="${i}">
    <span><span class="eb-name">${escapeHtml(ex.name)}</span><span class="eb-presc">${fmtExercisePrescription(ex)}</span></span>
    <button class="del" data-del-exercise="${i}" type="button">${ICONS.trash}</button>
  </div>`).join('');
  listEl.querySelectorAll('[data-del-exercise]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      manualExercises.splice(parseInt(btn.getAttribute('data-del-exercise'),10), 1);

  updateCreateTargetSections();
}
document.getElementById('addExerciseBtn').addEventListener('click', ()=>{
  const nameInput = document.getElementById('newExerciseName');

function updateCreateCompletedUI(){
  const dd = getDayData(parseDateKey(state.openDayKey));
  // Smart default only -- past/today default to "already done", future defaults to "planned" --
  // but the toggle stays available either way. Logging a future day as done (backfilling, an
  // early workout before a midnight boundary, whatever the reason) should still be possible.
  createMarkCompleted = !dd.isFuture;

  updateCreateTargetSections();
}
document.getElementById('createCompletedToggle').addEventListener('click', function(){

  this.classList.toggle('on', createMarkCompleted);
  updateCreateNameLabel();
  updateCreateTargetSections();
});
function openManualEntry(){

  document.getElementById('createRestDurationInput').value = '';

  document.getElementById('manualDurationInput').value = '';
  document.getElementById('manualDistanceInput').value = '';
  updateManualPaceDisplay();

  manualExercises = [];

  titleLabel.setAttribute('data-i18n', 'manualEntryTitle');

// Re-opens Create Workout pre-filled with the day's current session (custom or auto-suggested) so
// the user can revise and resubmit it, instead of only being able to start over from a blank sheet.
function openManualEntryForEdit(dd){
  openManualEntry();
  manualEntryEditingPrimary = true;
  const L = STR[state.lang];
  manualEntryType = dd.p.t;
  // A custom plan bubble is, by construction, always a planned (not-yet-logged) workout --
  // resubmitting it should keep updating that same plan, not fork off a separate manual log entry.
  createMarkCompleted = false;
  document.getElementById('createCompletedToggle').classList.toggle('on', false);
  document.getElementById('manualNameInput').value = dd.p.en.title;
  document.getElementById('manualVolumeInput').value = dd.p.en.detail || '';
  renderManualTypeRow();
  updateCreateNameLabel();
  updateCreateTargetSections();
  if(dd.p.t==='interval' && dd.p.interval){
    document.getElementById('createRoundsInput').value = dd.p.interval.rounds;
    document.getElementById('createWorkDurationInput').value = fmtClock(dd.p.interval.workSec);
    document.getElementById('createRestDurationInput').value = fmtClock(dd.p.interval.restSec);
  } else if(dd.p.t==='strength' && dd.p.exercises && dd.p.exercises.length){
    manualExercises = dd.p.exercises.map(ex=>({...ex}));
    renderManualExercisesList();
  } else {
    const target = state.progression[progressionKey(dd.p)];
    if(target){
      if(dd.p.t==='strength'){
        if(target.weight!=null) document.getElementById('createWeightInput').value = target.weight;
        if(target.reps!=null) document.getElementById('createRepsInput').value = target.reps;
      } else if(dd.p.t==='run' && target.pace!=null){
        document.getElementById('createPaceInput').value = fmtPace(target.pace);
      }
    }
  }
  const titleLabel = document.getElementById('manualEntryTitleLabel');
  titleLabel.setAttribute('data-i18n', 'editWorkoutTitle');
  titleLabel.textContent = L.editWorkoutTitle;
  document.getElementById('clearWorkoutBtn').hidden = false;
}
// Re-opens Create Workout pre-filled with an already-logged workout bubble so the user can revise
// and resave it in place -- tapping a past workout to view/correct it used to have no edit path at
// all (only delete), so fixing a typo meant deleting it and logging a new one, which just appended
// a duplicate to the bottom of the list instead of updating the original.
function openManualEntryForEditLoggedEntry(entry){
  openManualEntry();
  manualEntryEditingId = entry.id;
  const L = STR[state.lang];
  manualEntryType = entry.type;
  createMarkCompleted = true; // an already-logged entry is, by construction, already done
  document.getElementById('createCompletedToggle').classList.toggle('on', true);
  document.getElementById('manualNameInput').value = entry.name;
  document.getElementById('manualVolumeInput').value = entry.volume || '';
  document.getElementById('manualNotesInput').value = entry.notes || '';
  if(entry.type==='run'){
    if(entry.durationMin!=null) document.getElementById('manualDurationInput').value = entry.durationMin;
    if(entry.distance!=null) document.getElementById('manualDistanceInput').value = entry.distance;
    updateManualPaceDisplay();
  }
  renderManualTypeRow();
  updateCreateNameLabel();
  updateCreateTargetSections();
  const titleLabel = document.getElementById('manualEntryTitleLabel');
  titleLabel.setAttribute('data-i18n', 'editWorkoutTitle');
  titleLabel.textContent = L.editWorkoutTitle;
}
function closeManualEntry(){
  document.getElementById('manualEntryOverlay').hidden = true;
}
document.getElementById('addWorkoutBtn').addEventListener('click', openManualEntry);
document.getElementById('closeManualEntry').addEventListener('click', closeManualEntry);
document.getElementById('clearWorkoutBtn').addEventListener('click', ()=>{
  if(!state.openDayKey) return;
  resetToSuggestedPlan(state.openDayKey);
  closeManualEntry();
  renderDayDetail();
  renderCalendar();
  renderWeek();
  renderHome();
  showToast(STR[state.lang].workoutClearedToast);
});
function readCreateTarget(){
  if(manualEntryType==='strength'){
    const w = parseFloat(document.getElementById('createWeightInput').value);
    const r = parseFloat(document.getElementById('createRepsInput').value);
    return (w>0 && r>0) ? {weight:w, reps:r} : null;
  }
  if(manualEntryType==='run'){
    const m = document.getElementById('createPaceInput').value.trim().match(/^(\d+):(\d\d)$/);
    return m ? {pace: parseInt(m[1],10) + parseInt(m[2],10)/60} : null;
  }
  return null;
}
function parseMinSec(str, fallbackSec){
  const m = str.trim().match(/^(\d+):(\d\d)$/);
  return m ? parseInt(m[1],10)*60 + parseInt(m[2],10) : fallbackSec;
}
function readIntervalConfig(){
  const rounds = Math.max(1, parseInt(document.getElementById('createRoundsInput').value,10) || 6);
  const workSec = parseMinSec(document.getElementById('createWorkDurationInput').value || document.getElementById('createWorkDurationInput').placeholder, 180);
  const restSec = parseMinSec(document.getElementById('createRestDurationInput').value || document.getElementById('createRestDurationInput').placeholder, 60);
  return {rounds, workSec, restSec};
}
document.getElementById('saveManualEntry').addEventListener('click', ()=>{
  const nameInput = document.getElementById('manualNameInput');
  const name = nameInput.value.trim();
  if(!name || !state.openDayKey){ nameInput.style.borderColor = 'var(--accent)'; nameInput.focus(); return; }
  const notes = document.getElementById('manualNotesInput').value.trim();
  const isCardioLog = manualEntryType==='run' && createMarkCompleted;
  let volume = document.getElementById('manualVolumeInput').value.trim();
  let cardioDistance = null, cardioDuration = null;
  if(isCardioLog){
    cardioDistance = parseFloat(document.getElementById('manualDistanceInput').value);
    cardioDuration = parseFloat(document.getElementById('manualDurationInput').value);
    cardioDistance = isNaN(cardioDistance) ? null : cardioDistance;
    cardioDuration = isNaN(cardioDuration) ? null : cardioDuration;
    // Derives the same free-text display shown everywhere else (bubbles, Home, Plan rows) from the
    // structured Distance/Duration fields, so nothing else in the app needs to change to show it.
    volume = [cardioDistance!=null ? `${cardioDistance} mi` : '', cardioDuration!=null ? fmtTime(cardioDuration) : ''].filter(Boolean).join(' · ');
  }

  if(manualEntryType==='interval'){
    // An interval workout is completed by running its timer, not logged as an instant fact --
    // it always becomes the day's actual planned session (like Plan a Workout), never a plain entry.
    planCustomWorkout(state.openDayKey, {title:name, type:'interval', detail:volume, target:null, interval:readIntervalConfig(), replacePrimary:manualEntryEditingPrimary});
    closeManualEntry();
    renderDayDetail();
    renderCalendar();
    renderWeek();
    renderHome();
    showToast(STR[state.lang].workoutPlannedToast);
    return;
  }

  if(createMarkCompleted){
    // A cardio log's Date row can file it under a different day than the one Day Detail was opened
    // for -- everything else always stays on state.openDayKey.
    const dateInputVal = document.getElementById('manualDateInput').value;
    const targetDayKey = (isCardioLog && dateInputVal) ? dateInputVal : state.openDayKey;
    const sourceLog = ensureDayLog(state.openDayKey);
    // Editing an existing logged bubble updates it in place -- only the explicit "+ Create Workout"
    // entry point (which never sets manualEntryEditingId) appends a genuinely new one.
    const existing = manualEntryEditingId ? sourceLog.manualEntries.find(e=>e.id===manualEntryEditingId) : null;
    if(existing && targetDayKey!==state.openDayKey){
      // The date was changed while editing -- move the entry to its new day instead of leaving a
      // stale copy behind under the old one.
      sourceLog.manualEntries = sourceLog.manualEntries.filter(e=>e.id!==existing.id);
      if(existing.supabaseId) cloudDeleteManualEntry(existing.supabaseId);
      const moved = {id:'m'+Date.now()+Math.random().toString(36).slice(2,7), name, type:manualEntryType, volume, notes, distance:cardioDistance, durationMin:cardioDuration};
      ensureDayLog(targetDayKey).manualEntries.push(moved);
      cloudInsertManualEntry(targetDayKey, moved).then(supabaseId=>{ if(supabaseId) moved.supabaseId = supabaseId; });
    } else if(existing){
      existing.name = name; existing.type = manualEntryType; existing.volume = volume; existing.notes = notes;
      existing.distance = cardioDistance; existing.durationMin = cardioDuration;
      if(existing.supabaseId) cloudUpdateManualEntry(existing.supabaseId, existing);
    } else {
      const entry = {id:'m'+Date.now()+Math.random().toString(36).slice(2,7), name, type:manualEntryType, volume, notes, distance:cardioDistance, durationMin:cardioDuration};
      ensureDayLog(targetDayKey).manualEntries.push(entry);
      cloudInsertManualEntry(targetDayKey, entry).then(supabaseId=>{ if(supabaseId) entry.supabaseId = supabaseId; });
    }
    // A fresh log is the clearest possible "this happened" signal, so it should always win over any
    // earlier explicit "mark as not done" toggle -- otherwise a stale override could silently hide a
    // workout the user just told the app they did.
    ensureDayLog(targetDayKey).completedOverride = null;
    const idxInCurrentWeek = currentWeekIdxFor(targetDayKey);
    if(idxInCurrentWeek>=0 && idxInCurrentWeek!==TODAY_IDX){
      state.week[idxInCurrentWeek].completed = true;
    }
    state.doneCount = computeDoneCount();
    manualEntryEditingId = null;
    state.openDayKey = targetDayKey;
  } else {
    planCustomWorkout(state.openDayKey, {title:name, type:manualEntryType, detail:volume, target:readCreateTarget(), exercises: manualEntryType==='strength' ? manualExercises.slice() : null, replacePrimary:manualEntryEditingPrimary});
  }

  closeManualEntry();
  renderDayDetail();
  renderCalendar();
  renderWeek();
  renderHome();
  showToast(STR[state.lang][createMarkCompleted ? 'workoutLoggedToast' : 'workoutPlannedToast']);
});
function deleteManualEntry(key, id){
  const log = state.dayLog[key];
  if(!log) return;
  const entry = log.manualEntries.find(e=>e.id===id);
  log.manualEntries = log.manualEntries.filter(e=>e.id!==id);
  if(entry && entry.supabaseId) cloudDeleteManualEntry(entry.supabaseId);
  state.doneCount = computeDoneCount();
  if(!document.getElementById('dayDetailOverlay').hidden) renderDayDetail();
  renderCalendar();
  renderHome();
  renderWeek();
}

/* ---------------- progress ---------------- */
function weekStats(offset){
  const dates = weekDates(offset);
  let workouts = 0, distance = 0;
  dates.forEach(date=>{
    const dd = getDayData(date);
    const done = dd.completed;
    if((dd.p.t!=='rest' && done) || dd.manualEntries.length>0) workouts++;
    if(dd.p.t==='run' && done){
      distance += dd.actualRunDistance!=null ? dd.actualRunDistance : (parseFloat(ST(dd.p).detail) || 0);
    }
    // A run logged as an extra (secondary) workout for the day still counts toward weekly/lifetime
    // distance -- it's a real run regardless of which slot it was logged under.
    dd.extraWorkouts.forEach(w=>{
      if(w.completed && w.session && w.session.t==='run' && w.actualDistance!=null){
        distance += w.actualDistance;
      }
    });
  });
  return {workouts, distance};
}
function weekBarLabel(offset){
  const L = STR[state.lang];
  if(offset===0) return L.barLabelNow;
  if(offset===-1) return L.barLabel1;
  if(offset===-2) return L.barLabel2;
  if(offset===-3) return L.barLabel3;
  return L.barLabelNAgo.replace('{n}', Math.abs(offset));
}
const PROG_MIN_WINDOW_END = -(PROG_MAX_BACK - PROG_WEEKS_SHOWN);
function renderProgress(){
  const L = STR[state.lang];

  const offsets = [];
  for(let o=state.progWindowEnd-(PROG_WEEKS_SHOWN-1); o<=state.progWindowEnd; o++) offsets.push(o);
  const weekData = offsets.map(o => ({offset:o, ...weekStats(o)}));
  const max = Math.max(7, ...weekData.map(w=>w.workouts));

  document.getElementById('progBarChart').innerHTML = weekData.map(w=>{
    const h = Math.max(6, Math.round((w.workouts/max)*100));
    const cls = [w.offset===0?'current':'', w.offset===state.progSelectedOffset?'selected':''].filter(Boolean).join(' ');
    return `<div class="bar-col ${cls}" data-offset="${w.offset}">
      <div class="col-bar" style="height:${h}%;"></div>
      <div class="col-label">${weekBarLabel(w.offset)}</div>
    </div>`;
  }).join('');
  document.getElementById('progBarChart').querySelectorAll('.bar-col').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.progSelectedOffset = parseInt(el.getAttribute('data-offset'),10);
      renderProgress();
    });
  });

  document.getElementById('progWeeksPrev').disabled = state.progWindowEnd<=PROG_MIN_WINDOW_END;
  document.getElementById('progWeeksNext').disabled = state.progWindowEnd>=0;

  const sel = weekStats(state.progSelectedOffset);
  document.getElementById('progWeekDetail').innerHTML = `
    <div class="wd-range">${weekRangeLabel(state.progSelectedOffset)}</div>
    <div class="wd-stats">
      <div class="wd-stat"><div class="l">${L.weekDetailWorkoutsLabel}</div><div class="v">${sel.workouts}</div></div>
      <div class="wd-stat"><div class="l">${L.weekDetailDistanceLabel}</div><div class="v">${sel.distance.toFixed(1)} mi</div></div>
    </div>`;
  renderPRs();
}

/* ---------------- personal records (lift PRs) ---------------- */
function bestPrValueFor(exercise){
  const key = exercise.trim().toLowerCase();
  return state.prs.filter(p=>p.exercise.trim().toLowerCase()===key).reduce((max,p)=>Math.max(max,p.value), -Infinity);
}
// Entering a PR is an explicit, deliberate signal from the user -- more current and more trusted
// than an intensity-tier guess (getProgressionTarget seeds one of those the moment Home simply
// renders a session title, which happens constantly, so "only fill gaps" would almost never
// actually fire). A PR always updates that exercise's suggested weight; any existing rep target
// is left alone, since the PR is just a weight number, not a full working-set prescription.
function applyPRToProgression(exercise, value){
  const existing = state.progression[exerciseProgressionKey(exercise)];
  const target = {weight: value, reps: (existing && existing.reps) || 5};
  saveExerciseTarget(exercise, target);
}
function renderPRs(){
  const L = STR[state.lang];
  document.getElementById('prExerciseInput').placeholder = L.prExercisePlaceholder;
  document.getElementById('prValueInput').placeholder = state.weightUnit;
  const listEl = document.getElementById('prList');
  const sorted = state.prs.slice().sort((a,b)=> b.createdAt - a.createdAt);
  listEl.innerHTML = sorted.length ? sorted.map(pr=>{
    const isBest = pr.value === bestPrValueFor(pr.exercise);
    const dateStr = new Date(pr.createdAt).toLocaleDateString(state.lang==='es'?'es-ES':'en-US', {month:'short', day:'numeric'});
    return `<div class="manual-entry">
      <div class="body">
        <div class="n">${escapeHtml(pr.exercise)}${isBest?` <span style="color:var(--accent);font-size:10px;font-weight:700;letter-spacing:0.06em;">${L.prBestBadge}</span>`:''}</div>
        <div class="v">${pr.value} ${pr.unit} · ${dateStr}</div>
      </div>
      <button class="del" data-pr-del="${pr.id}" type="button">${ICONS.trash}</button>
    </div>`;
  }).join('') : `<div class="footer-note" style="text-align:left;padding:2px 0;">${L.noPrsLoggedLabel}</div>`;
  listEl.querySelectorAll('[data-pr-del]').forEach(btn=>{
    btn.addEventListener('click', ()=> deletePR(btn.getAttribute('data-pr-del')));
  });
}
document.getElementById('addPrBtn').addEventListener('click', ()=>{
  const exerciseInput = document.getElementById('prExerciseInput');
  const exercise = exerciseInput.value.trim();
  const value = parseFloat(document.getElementById('prValueInput').value);
  if(!exercise || !(value>0)){ exerciseInput.style.borderColor = 'var(--accent)'; exerciseInput.focus(); return; }
  exerciseInput.style.borderColor = '';
  const pr = {id:'pr'+Date.now()+Math.random().toString(36).slice(2,7), exercise, value, unit:state.weightUnit, createdAt:Date.now()};

function deletePR(id){

}

/* ---------------- summary ---------------- */
function fmtTime(mins){
  const h = Math.floor(mins/60), m = Math.round(mins%60);
  return h>0 ? `${h}:${String(m).padStart(2,'0')}:00` : `${m} min`;
}
function fmtPace(paceMin){
  return `${Math.floor(paceMin)}:${String(Math.round((paceMin%1)*60)).padStart(2,'0')}`;
}
function fmtClock(totalSec){
  const m = Math.floor(totalSec/60), s = totalSec%60;
  return `${m}:${String(s).padStart(2,'0')}`;
}
function getSummaryStats(session, intensityIdx, logged){
  const L = STR[state.lang];
  const tier = INTENSITY[intensityIdx];
  if(session.t==='run'){
    // What was actually run (if it was logged) is what the summary/pace should reflect --
    // the planned distance is only a fallback for the pre-completion seeded preview.
    const dist = (logged && logged.distance!=null) ? logged.distance : (parseFloat(session.en.detail) || 3);
    const totalMin = (logged && logged.time) ? logged.time : dist*tier.pace;
    const paceMin = dist>0 ? totalMin/dist : tier.pace;
    const paceStr = fmtPace(paceMin)+'/mi';
    const lo = tier.pace+0.4, hi = tier.pace-0.2;
    const tgt = `${fmtPace(hi)}–${fmtPace(lo)}/mi`;
    const target = getProgressionTarget(session, intensityIdx);
    const stats = [
      {l:L.statDistance, v:dist.toFixed(1)+' mi'},
      {l:L.statTime, v:fmtTime(totalMin)},
      {l:L.statPace, v:paceStr},
      {l:L.statTempoTarget, v:tgt},
    ];
    if(target && state._reviewSubmitted) stats.push({l:L.statProgress, v:fmtPace(target.pace)+'/mi'});
    return stats;
  }
  if(session.t==='strength'){
    const mins = parseFloat(session.en.detail) || 30;
    const stats = [
      {l:L.statTotalVolume, v: tier.vol.toLocaleString()+' lb'},
      {l:L.statTime, v: mins+' min'},
    ];
    if(logged && logged.exercises){
      // A structured session's real detail lives in the per-exercise results list, not a single
      // "top set" line -- see getSummaryExercises() / #summaryExercisesList.
      stats.push({l:L.statExerciseCount, v: logged.exercises.length});
      return stats;
    }
    const setsReps = ['3 x 12','4 x 10','5 x 5'][intensityIdx];
    const weight = (logged && logged.weight) || [95,135,195][intensityIdx];
    const reps = (logged && logged.reps) || [12,10,5][intensityIdx];
    const target = getProgressionTarget(session, intensityIdx);
    stats.push({l:L.statSetsReps, v: setsReps});
    stats.push({l:L.statTopSet, v: `${weight} lb x ${reps}`});
    if(target && state._reviewSubmitted) stats.push({l:L.statProgress, v:`${target.weight} lb`});
    return stats;
  }
  if(session.t==='hike'){
    return [
      {l:L.statDistance, v:'3.2 mi'},
      {l:L.statTime, v:'58 min'},
      {l:L.statElevGain, v:'410 ft'},
      {l:L.statAvgPace, v:'18:07/mi'},
    ];
  }
  if(session.t==='interval'){
    const cfg = session.interval || {rounds:6, workSec:180, restSec:60};
    const rounds = (logged && logged.rounds) || cfg.rounds;
    const totalMin = (rounds*cfg.workSec + Math.max(0,rounds-1)*cfg.restSec)/60;
    return [
      {l:L.intervalRoundsLabel, v: rounds},
      {l:L.timerWorkShort, v: fmtClock(cfg.workSec)},
      {l:L.timerRestShort, v: fmtClock(cfg.restSec)},
      {l:L.statTime, v: fmtTime(totalMin)},
    ];
  }
  return [];
}
function getSummaryExercises(logged){
  if(!logged || !logged.exercises) return null;
  return logged.exercises.map(res=>{
    let result;
    if(res.bodyweight) result = res.prescription;
    else if(res.sets && res.sets.length>1) result = res.sets.map(s=>`${s.weight}x${s.reps}`).join(', ');
    else result = `${res.weight} lb x ${res.reps}`;
    return {name: res.name, result};
  });
}
function renderSummary(){
  const L = STR[state.lang];
  const session = state._lastSession || todaySession();
  const sessL = ST(session);
  document.getElementById('summarySessTitle').textContent = `${sessL.title}${sessL.detail?', '+sessL.detail:''}`;
  const logged = state._lastLogged;
  const stats = getSummaryStats(session, state.intensityIdx, logged);
  document.getElementById('summaryStats').innerHTML = stats.map(s=>`<div class="cell"><div class="l">${s.l}</div><div class="v">${s.v}</div></div>`).join('');
  const exercisesEl = document.getElementById('summaryExercisesList');
  const exResults = getSummaryExercises(logged);
  exercisesEl.hidden = !exResults;
  if(exResults) exercisesEl.innerHTML = exResults.map(r=>`<div class="se-row"><span class="se-name">${escapeHtml(r.name)}</span><span class="se-result">${escapeHtml(r.result)}</span></div>`).join('');
  const noteObj = SUMMARY_NOTE[session.t] || SUMMARY_NOTE.run;
  document.getElementById('summaryNote').textContent = noteObj[state.lang];
  document.getElementById('summaryStreakVal').textContent = `${state.streak} ${L.dayStreakSuffix}`;
  const progNoteEl = document.getElementById('summaryProgressNote');
  const reviewCardEl = document.getElementById('summaryReviewCard');
  if(logged && !state._reviewSubmitted){
    // Right after finishing -- ask for the review before showing any progression result, since
    // the rating given here is what decides whether a met target actually counts as "advance".
    document.getElementById('reviewRatingSlider').value = 3;
    // Pre-fill with whatever notes were jotted down live while the workout was being logged --
    // the reviewer can still edit/extend them before submitting.
    document.getElementById('reviewNotesInput').value = (logged && logged.notes) || '';
    document.getElementById('reviewNotesInput').placeholder = L.reviewNotesPlaceholder;
    renderReviewRatingLabel();
    reviewCardEl.hidden = false;
    progNoteEl.hidden = true;
  } else if(logged && logged.exercises){
    reviewCardEl.hidden = true;
    const msg = (state._lastProgressed ? L.progressionUpMsgExercises : L.progressionHoldMsgExercises)
      .replace('{count}', state._lastProgressedCount).replace('{total}', state._lastProgressedTotal);
    document.getElementById('summaryProgressMsg').textContent = msg;
    progNoteEl.hidden = false;
  } else if((session.t==='strength'||session.t==='run') && logged){
    reviewCardEl.hidden = true;
    const target = getProgressionTarget(session, state.intensityIdx);
    const targetStr = session.t==='strength' ? `${target.weight} lb` : `${fmtPace(target.pace)}/mi`;
    const msg = (state._lastProgressed ? L.progressionUpMsg : L.progressionHoldMsg).replace('{target}', targetStr);
    document.getElementById('summaryProgressMsg').textContent = msg;
    progNoteEl.hidden = false;
  } else {
    reviewCardEl.hidden = true;
    progNoteEl.hidden = true;
  }
}

// Cloud persistence for the fields real users set up during onboarding, plus rollup
// stats. Per-day workout logs / progression sync are a separate, larger follow-up --
// this covers "your setup survives a sign-out / new device" for now.
async function loadProfileFromCloud(){
  if(!state.userId) return;
  const { data, error } = await sb.from('profiles').select('*').eq('id', state.userId).maybeSingle();
  if(error || !data) return;
  if(data.goal) state.goal = data.goal;
  if(data.level) state.level = data.level;
  if(data.training_days) state.trainingDays = data.training_days;
  if(data.focus_ratio!=null) state.focusRatio = data.focus_ratio;
  if(data.intensity_idx!=null) state.intensityIdx = data.intensity_idx;
  if(data.age_bracket) state.age = data.age_bracket;
  if(data.gender) state.gender = data.gender;
  if(data.weight!=null) state.weight = data.weight;
  if(data.weight_unit) state.weightUnit = data.weight_unit;
  if(data.full_name) state.userName = data.full_name;
  if(data.streak!=null) state.streak = data.streak;
  if(data.best_streak!=null) state.bestStreak = data.best_streak;
  if(data.total_workouts!=null) state.totalWorkouts = data.total_workouts;
  if(data.total_distance!=null) state.totalDistance = data.total_distance;
  if(data.last_counted_date) state.lastCountedDate = data.last_counted_date;
  state.week = buildWeek(state.focusRatio);
}
async function saveProfileToCloud(){
  if(!state.userId) return;
  try{
    const payload = {
      full_name: state.userName,
      goal: state.goal,
      level: state.level,
      training_days: state.trainingDays,
      focus_ratio: state.focusRatio,
      intensity_idx: state.intensityIdx,
      age_bracket: state.age,
      gender: state.gender,
      weight: state.weight,
      weight_unit: state.weightUnit,
      streak: state.streak,
      best_streak: state.bestStreak,
      total_workouts: state.totalWorkouts,
      total_distance: state.totalDistance,
      last_counted_date: state.lastCountedDate,
      updated_at: new Date().toISOString(),
    };
    const { error } = await sb.from('profiles').update(payload).eq('id', state.userId);
    if(error){
      // last_counted_date may not exist yet if this migration hasn't been applied to this
      // project's live database -- retry without it so the rest of the profile (streak, totals,
      // etc.) still saves instead of the whole update silently failing over one missing column.
      delete payload.last_counted_date;
      await sb.from('profiles').update(payload).eq('id', state.userId);
    }
  }catch(e){ /* best-effort; local state remains the source of truth for this session */ }
}

/* ---------------- cloud sync: workout logs, manual entries, recorded sessions, progression ---------------- */
async function cloudGetOrCreateWorkoutLog(dateStr){
  if(!state.userId) return null;
  try{
    const { data: existing } = await sb.from('workout_logs').select('id, completed_override')
      .eq('user_id', state.userId).eq('log_date', dateStr).maybeSingle();
    if(existing) return existing;
    const { data: created, error } = await sb.from('workout_logs')
      .insert({ user_id: state.userId, log_date: dateStr }).select('id, completed_override').maybeSingle();
    if(error) throw error;
    return created;
  }catch(e){ return null; }
}
async function cloudSetCompletedOverride(dateStr, value){
  if(!state.userId) return;
  try{
    const row = await cloudGetOrCreateWorkoutLog(dateStr);
    if(!row) return;
    await sb.from('workout_logs').update({ completed_override: value }).eq('id', row.id);
  }catch(e){ /* best-effort */ }
}
async function cloudSetActualRunDistance(dateStr, distance){
  if(!state.userId) return;
  try{
    const row = await cloudGetOrCreateWorkoutLog(dateStr);
    if(!row) return;
    await sb.from('workout_logs').update({ actual_run_distance: distance }).eq('id', row.id);
  }catch(e){ /* best-effort */ }
}
async function cloudInsertManualEntry(dateStr, entry){
  if(!state.userId) return null;
  try{
    const row = await cloudGetOrCreateWorkoutLog(dateStr);
    if(!row) return null;
    // A fresh manual log clears any stale "not done" override, mirroring the local logic in the
    // saveManualEntry handler below.
    await sb.from('workout_logs').update({ completed_override: null }).eq('id', row.id);
    let res = await sb.from('manual_entries').insert({
      workout_log_id: row.id, name: entry.name, type: entry.type, volume: entry.volume, notes: entry.notes,
      distance: entry.distance ?? null, duration_min: entry.durationMin ?? null,
    }).select('id').maybeSingle();
    if(res.error){
      // distance/duration_min may not exist yet if this migration hasn't been applied to this
      // project's live database -- retry without them rather than losing the whole entry.
      res = await sb.from('manual_entries').insert({
        workout_log_id: row.id, name: entry.name, type: entry.type, volume: entry.volume, notes: entry.notes,
      }).select('id').maybeSingle();
    }
    if(res.error) throw res.error;
    return res.data ? res.data.id : null;
  }catch(e){ return null; }
}
