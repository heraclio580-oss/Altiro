<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connecting Strava…</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0E0E10;color:#B9B9C0;font:14px/1.4 system-ui,-apple-system,sans-serif;}
  @media (prefers-color-scheme: light){ body{background:#F6F6F4;color:#55555C;} }
  [hidden]{display:none !important;}
</style>
</head>
<body>
<div style="text-align:center;"><p>Connecting Strava…</p><a id="back" hidden style="display:inline-block;margin-top:10px;padding:12px 22px;border-radius:999px;background:#DA1419;color:#fff;font-weight:600;text-decoration:none;"></a></div>
<script>
// Strava sends the browser here after "Authorize" (or "Cancel") with ?code=...&scope=... (or
// ?error=...). The app itself finishes the connection -- see finishStravaConnect() in index.html.
// It's handed over through localStorage rather than left in the app's own URL, where Supabase's
// sign-in handling would try to read ?code/?error as a sign-in of its own.
// From the store app (state=native): Strava's reply goes back into the app through an altiro:// link
// (handleAppLink), with a button in case the phone asks first or the automatic jump is blocked.
if(new URLSearchParams(location.search).get('state')==='native'){
  var back = 'altiro://strava-callback' + location.search;
  var es = /^es/i.test(navigator.language || '');
  document.querySelector('p').textContent = es ? 'Volviendo a Altiro…' : 'Returning to Altiro…';
  var a = document.getElementById('back');
  a.href = back; a.textContent = es ? 'Abrir Altiro' : 'Open Altiro'; a.hidden = false;
  location.href = back;
} else {
  try{ localStorage.setItem('altiro_strava_callback', JSON.stringify({search: location.search, at: Date.now()})); }catch(e){}
  location.replace('./');
}
</script>
</body>
</html>
