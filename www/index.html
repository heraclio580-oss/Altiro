  if(exercises){
    document.getElementById('wpExerciseList').innerHTML = exercises.map((ex, i)=>{
      const note = ex.swappedFrom
        ? `<div class="wp-ex-note">${escapeHtml(L.wpReplaces.replace('{name}', exerciseDisplayName(ex.swappedFrom)))}<button class="btn-text" type="button" data-undo-swap="${escapeHtml(ex.swappedFrom)}">${L.wpUndo}</button></div>`
        : '';
      // A lift's numbers are tappable to set your own (a timed move has none to set).
      const rx = ex.durationSec!=null
        ? `<div class="wp-ex-rx">${escapeHtml(exerciseRxText(ex))}</div>`
        : `<button class="wp-ex-rx wp-rx-btn" type="button" data-tune="${i}">${escapeHtml(exerciseRxText(ex))}${ICONS.pencil}</button>`;
      const row = `<div class="wp-ex" data-idx="${i}">
          <div class="wp-ex-main">
            <div class="wp-ex-name">${escapeHtml(ex.name)}</div>

            ${ex.pyramid ? pyramidLadderHtml(ex) : ''}
            ${note}
          </div>
          <button class="wp-change" type="button" data-change="${i}">${L.wpChangeBtn}</button>
        </div>`;
      return row + (wp.editIdx===i ? exerciseChooserHtml(ex, exercises.length) : '')
        + (wp.tuneIdx===i ? `<div class="wp-chooser wp-tuner" data-tuner="${i}">
            <div class="st-label">${escapeHtml(L.liftNumbersFor.replace('{name}', ex.name))}</div>
            <div class="lift-fields">${liftNumberInputsHtml(ex)}</div>
            <div class="wp-ex-note">${escapeHtml(L.liftNumbersNote.replace('{name}', ex.name))}</div>
            <div class="wp-scope">
              <button class="btn btn-ghost" type="button" data-tune-cancel>${L.wpCancel}</button>

    }).join('');
    document.getElementById('wpSkippedList').innerHTML = exercises.skipped.map(key=>
      `<div class="wp-ex-note" style="padding-top:8px;">${escapeHtml(L.wpSkippedEvery.replace('{name}', exerciseDisplayName(key)))}<button class="btn-text" type="button" data-undo-swap="${escapeHtml(key)}">${L.wpUndo}</button></div>`
    ).join('');
  }

  const companion = r.c && r.c.t!=='rest' ? ST(r.c) : null;
  document.getElementById('wpCompanionSection').hidden = !companion;
  if(companion) document.getElementById('wpCompanion').textContent = companion.title + (companion.detail ? ` · ${companion.detail}` : '');
}
// A pyramid, step by step -- "Warm-up 45 · 50 · 55 lb × 10", "Heavy sets 85 · 90 · 95 lb × 5", ... --
// with how to run it.
function pyramidLadderHtml(ex){
  const L = STR[state.lang], pyr = ex.pyramid;
  const groups = [];
  pyr.steps.forEach(st=>{
    const g = groups[groups.length-1];
    if(g && g.stage===st.stage && g.reps===st.reps) g.weights.push(st.weight);
    else groups.push({stage:st.stage, reps:st.reps, weights:[st.weight]});
  });
  const rules = !pyr.peak ? L.pyramidRulesLight.replace('{day}', L['wave_'+pyr.pos])
    : pyr.steps.some(st=>st.stage==='top') ? L.pyramidRulesPeak : L.pyramidRulesPeakBeginner;
  return `<div class="wp-pyramid">${groups.map((g,i)=>`<div class="pyr-step" data-stage="${g.stage}">
      <b>${i && groups[i-1].stage===g.stage ? '' : escapeHtml(L['pyrStage_'+g.stage])}</b>
      <span>${g.weights.join(' · ')} ${state.weightUnit} × ${g.reps}</span></div>`).join('')}
    <div class="wp-ex-note">${escapeHtml(rules)}</div></div>`;
}
function exerciseDisplayName(key){
  const def = exerciseDef(key);
  return def ? (state.lang==='es' ? def.es : def.en) : key;
}
// Under the exercise being changed: what it can be swapped for, or skipped (not the last one left --
// that's "Skip this workout"); then, once picked, whether it's for this workout or every workout. A
// move the user typed in themselves isn't part of the plan, so a change to it is always just this workout.
function exerciseChooserHtml(ex, count){
  const L = STR[state.lang];
  const alts = ex.fromPlan || exerciseDef(ex.key) ? exerciseAlternatives(ex.key) : [];
  const chips = alts.map(k=>`<div class="chip ${wp.choice===k?'sel':''}" data-alt="${escapeHtml(k)}">${escapeHtml(exerciseDisplayName(k))}</div>`).join('')
    + (count>1 ? `<div class="chip ${wp.choice==='skip'?'sel':''}" data-alt="skip">${L.wpSkipExercise}</div>` : '');
  const scope = wp.choice==null ? '' : ex.fromPlan
    ? `<div class="st-label">${L.wpApplyTo}</div>
       <div class="wp-scope">
         <button class="btn btn-ghost" type="button" data-scope="one">${L.wpJustThis}</button>
         <button class="btn btn-primary" type="button" data-scope="all">${L.wpEveryWorkout}</button>
       </div>`
    : `<div class="wp-scope"><button class="btn btn-primary" type="button" data-scope="one">${L.wpJustThis}</button></div>`;
  return `<div class="wp-chooser">
      <div class="st-label">${L.wpSwapFor}</div>
      <div class="chip-row">${chips}</div>
      ${scope}
      <button class="btn-text" type="button" data-cancel-change style="margin-top:6px;">${L.wpCancel}</button>
    </div>`;
}
// Saves an exercise list as this one workout's own (it stops following the plan's weekly picks).
function saveWorkoutExercises(r, list){
  const clean = list.map(ex=>{ const c = {...ex}; delete c.swappedFrom; delete c.pyramid; return c; });
  if(r.extra){
    r.extra.session = {...r.extra.session, exercises: clean};
    if(r.extra.supabaseId) cloudSetExtraWorkoutExercises(r.extra.supabaseId, clean);
    return;
  }
  const date = parseDateKey(wp.dayKey);
  const slot = getRawDaySlot(date);
  const p = {...slot.p, exercises: clean};
  writeDaySlot(date, {p, c: slot.c, completed: slot.completed, isCustom: true});
  cloudSavePlannedSession(wp.dayKey, p);
}
function applyExerciseChange(idx, choice, scope){
  const r = previewedWorkout();
  const date = parseDateKey(wp.dayKey);
  const exercises = exercisesForSession(r.session, date);
  const ex = exercises[idx];
  if(scope==='all'){
    const original = ex.swappedFrom || ex.key;
    const swaps = {...state.exerciseSwaps};
    if(choice===original) delete swaps[original];
    else swaps[original] = choice;
    state.exerciseSwaps = swaps;
    saveProfileToCloud();
  } else {
    const list = exercises.slice();
    if(choice==='skip') list.splice(idx, 1);
    else list[idx] = exerciseFromKey(choice, ex);
    saveWorkoutExercises(r, list);
  }
  wp.editIdx = null; wp.choice = null; wp.changed = true;
  refreshViews();
  renderWorkoutPreview();
  showToast(STR[state.lang].exerciseChangedToast);
}
document.getElementById('wpExerciseSection').addEventListener('click', (e)=>{
  const change = e.target.closest('[data-change]');
  if(change){
    const idx = parseInt(change.getAttribute('data-change'),10);
    wp.editIdx = wp.editIdx===idx ? null : idx;
    wp.choice = null;
    wp.tuneIdx = null;
    renderWorkoutPreview();
    return;
  }
  const tune = e.target.closest('[data-tune]');
  if(tune){
    const idx = parseInt(tune.getAttribute('data-tune'),10);
    wp.tuneIdx = wp.tuneIdx===idx ? null : idx;
    wp.editIdx = null; wp.choice = null;
    renderWorkoutPreview();
    const input = document.querySelector(`[data-tuner="${idx}"] input`);
    if(input) input.focus();
    return;
  }
  if(e.target.closest('[data-tune-cancel]')){ wp.tuneIdx = null; renderWorkoutPreview(); return; }
  const tuneSave = e.target.closest('[data-tune-save]');
  if(tuneSave){
    const idx = parseInt(tuneSave.getAttribute('data-tune-save'),10);
    const r = previewedWorkout();
    const ex = exercisesForSession(r.session, parseDateKey(wp.dayKey))[idx];
    const {weight, reps} = readLiftNumberInputs(document.querySelector(`[data-tuner="${idx}"]`));
    if(weight==null && reps==null) return;
    setLiftNumbers(ex.key, ex.bodyweight ? null : weight, reps);
    wp.tuneIdx = null; wp.changed = true;
    refreshViews();
    renderWorkoutPreview();
    showToast(STR[state.lang].liftSavedToast);
    return;
  }
  const alt = e.target.closest('[data-alt]');
  if(alt){ wp.choice = alt.getAttribute('data-alt'); renderWorkoutPreview(); return; }
  const scope = e.target.closest('[data-scope]');
  if(scope && wp.editIdx!=null && wp.choice!=null){ applyExerciseChange(wp.editIdx, wp.choice, scope.getAttribute('data-scope')); return; }
  if(e.target.closest('[data-cancel-change]')){ wp.editIdx = null; wp.choice = null; renderWorkoutPreview(); return; }
  const undo = e.target.closest('[data-undo-swap]');
  if(undo){
    const swaps = {...state.exerciseSwaps};
    delete swaps[undo.getAttribute('data-undo-swap')];
    state.exerciseSwaps = swaps;
    saveProfileToCloud();
    wp.changed = true;
    refreshViews();
    renderWorkoutPreview();
    showToast(STR[state.lang].exerciseChangedToast);
  }
});
// Skipping a whole workout turns the day into a rest day the user chose (so the plan won't refill it;

          : `<button class="btn-text" data-start-extra="${w.id}" type="button" style="white-space:nowrap;">${L.startWorkoutBtn}</button>`)
      : dd.isFuture ? ''

    return `<div class="manual-entry editable" data-extra-id="${w.id}">
      <span class="ic">${TYPE_ICON[w.session.t]}</span>
      <div class="body">
        <div class="n">${escapeHtml(effL.title)}</div>

  }).join('');
  // Tapping the bubble body opens Log Performance for it, or for a future one (which can't be logged
  // yet) a preview of it -- the Start/Mark Done/trash buttons inside it stay their own dedicated actions.
  extraWrap.querySelectorAll('[data-extra-id]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      if(e.target.closest('[data-del-extra], [data-start-extra], [data-mark-extra-done]')) return;
      const target = {dayKey: state.openDayKey, kind:'extra', id: el.getAttribute('data-extra-id')};
      if(dd.isFuture) openWorkoutPreview(state.openDayKey, {kind:'extra', id: target.id});

    btn.addEventListener('click', ()=>{

      closeDayDetail();
      openLogPerformance(id);
    });
  });
  extraWrap.querySelectorAll('[data-mark-extra-done]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      toggleExtraWorkoutCompleted(state.openDayKey, btn.getAttribute('data-mark-extra-done'));
      refreshViews();
      showToast(STR[state.lang].toastUpdated);
    });
  });
  extraWrap.querySelectorAll('[data-del-extra]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      deleteExtraWorkout(state.openDayKey, btn.getAttribute('data-del-extra'));
      refreshViews();
      showToast(STR[state.lang].toastUpdated);
    });

  const entriesWrap = document.getElementById('dayDetailEntries');
  entriesWrap.innerHTML = dd.manualEntries.length ? dd.manualEntries.map(en=>`
    <div class="manual-entry${dd.isFuture?'':' editable'}" data-entry-id="${en.id}">

      <div class="body">

    </div>`).join('') : `<div class="footer-note" style="text-align:left;padding:2px 0;">${L.noWorkoutsLoggedLabel}</div>`;
  // Tapping a logged workout opens Log Performance for it, showing what was logged -- only the
  // explicit trash icon deletes it.
  if(!dd.isFuture){
    entriesWrap.querySelectorAll('[data-entry-id]').forEach(el=>{
      el.addEventListener('click', (e)=>{
        if(e.target.closest('[data-del]')) return;
        openLogPerformanceFor({dayKey: state.openDayKey, kind:'entry', id: el.getAttribute('data-entry-id')});
      });
    });

  entriesWrap.querySelectorAll('[data-del]').forEach(btn=>{

document.getElementById('dayCompleteToggle').addEventListener('click', ()=>{
  if(!state.openDayKey) return;
  const dd = getDayData(parseDateKey(state.openDayKey));
  const next = !dd.completed;
  const idxInCurrentWeek = currentWeekIdxFor(state.openDayKey);
  if(idxInCurrentWeek===TODAY_IDX){
    ensureDayLog(state.openDayKey).completedOverride = next;
    state.todayCompleted = next;
    state.doneCount = computeDoneCount();
  } else if(idxInCurrentWeek>=0){
    // Also stamp completedOverride, not just state.week[idx].completed -- getDayData() ORs in
    // manualEntries.length>0 (and extraWorkouts) before ever looking at completed, so a bare
    // `.completed = false` here is silently ignored whenever the day already has a logged entry
    // (the override is what actually wins). Without this, toggling off did nothing visible until
    // a refresh reloaded the correctly-persisted override from the cloud.
    state.week[idxInCurrentWeek].completed = next;
    ensureDayLog(state.openDayKey).completedOverride = next;
    state.doneCount = computeDoneCount();
  } else {
    ensureDayLog(state.openDayKey).completedOverride = next;
  }
  cloudSetCompletedOverride(state.openDayKey, next);
  refreshViews();
});
function toggleTodayCompleted(){

  refreshViews();
}

/* ---------------- manual workout entry sheet ---------------- */
// "Create Workout" is the single entry point for telling the app about a workout, whether it
// already happened (logged, like the old "+ Add a Workout") or hasn't yet (planned, like the old
// "Plan a Workout"). The "Mark as Completed" toggle is what used to be two separate buttons.
let manualEntryType = 'strength';
let createMarkCompleted = true;
let manualExercises = []; // {key, name, sets, reps} -- optional, user-built sets/reps list for a strength entry
function renderManualTypeRow(){
  const L = STR[state.lang];
  const row = document.getElementById('manualTypeRow');
  const types = [['run', L.typeCardio], ['strength', L.typeWeightTraining], ['interval', L.typeInterval]];
  row.innerHTML = types.map(([t,label])=>`<button type="button" class="type-btn ${t===manualEntryType?'sel':''}" data-type="${t}">${MANUAL_TYPE_ICON[t]}<span>${label}</span></button>`).join('');
  row.querySelectorAll('.type-btn').forEach(b=>{
    b.addEventListener('click', ()=>{ manualEntryType = b.getAttribute('data-type'); renderManualTypeRow(); updateCreateTargetSections(); });
  });
}
function updateCreateNameLabel(){
  document.getElementById('createNameLabel').textContent = createMarkCompleted ? STR[state.lang].manualNameLabel : STR[state.lang].planNameLabel;
}
function updateCreateTargetSections(){
  const showTargets = !createMarkCompleted && (manualEntryType==='strength' || manualEntryType==='run');
  // Once a real exercise breakdown is being built, the single session-level weight x reps target
  // is redundant (and its progression data would go unused, since a structured session progresses
  // each exercise on its own) -- so it only shows while the exercise list is still empty.
  const hasExercises = manualEntryType==='strength' && manualExercises.length>0;
  document.getElementById('createWeightSection').hidden = !(showTargets && manualEntryType==='strength') || hasExercises;
  document.getElementById('createRepsSection').hidden = !(showTargets && manualEntryType==='strength') || hasExercises;
  document.getElementById('createPaceSection').hidden = !(showTargets && manualEntryType==='run');
  document.getElementById('createIntervalSection').hidden = manualEntryType!=='interval';
  // Available for any strength entry, planned or already-done -- separate from the single weight x
  // reps target above, which stays as a fallback for a quick plan that doesn't need a full exercise
  // breakdown.
  document.getElementById('createExercisesSection').hidden = manualEntryType!=='strength';
  // An interval workout is completed by actually running its timer, not by a checkbox, so the
  // usual "Mark as Completed" toggle doesn't apply here -- always plan it, never a plain log entry.
  document.getElementById('createCompletedSection').hidden = manualEntryType==='interval';
  // A cardio entry that's already done gets the structured Date/Duration/Distance/Pace layout
  // instead of the generic free-text Volume field -- planning a future run (not yet done) still
  // uses the simpler pace-target field above, since there's no real distance/duration to record yet.
  const isCardioLog = manualEntryType==='run' && createMarkCompleted;
  document.getElementById('cardioLogSection').hidden = !isCardioLog;
  document.getElementById('manualVolumeSection').hidden = isCardioLog;
}
// The Duration stat reads as separate hour/minute/second fields (so a logged run's real clock time,
// e.g. a 1:23:45 half marathon, doesn't get crammed into a single "minutes" box), but everything
// downstream (pace math, storage, cloud sync) still just wants one number of total minutes -- these
// two helpers are the only place that conversion happens.
function updateManualPaceDisplay(){
  const dur = readHmsMinutes('manualDuration');
  const dist = parseFloat(document.getElementById('manualDistanceInput').value);
  const paceEl = document.getElementById('manualPaceDisplay');
  paceEl.textContent = (dur>0 && dist>0) ? fmtPace(dur/dist)+'/mi' : '-:--/mi';
}
['manualDurationHInput','manualDurationMInput','manualDurationSInput','manualDistanceInput'].forEach(id=>{
  document.getElementById(id).addEventListener('input', updateManualPaceDisplay);
});
function renderManualExercisesList(){

document.getElementById('addExerciseBtn').addEventListener('click', ()=>{

function updateCreateCompletedUI(){

document.getElementById('addWorkoutBtn').addEventListener('click', openManualEntry);

function readCreateTarget(){
  if(manualEntryType==='strength'){
    const w = parseFloat(document.getElementById('createWeightInput').value);
    const r = parseFloat(document.getElementById('createRepsInput').value);
    return (w>0 && r>0) ? {weight:w, reps:r} : null;
  }
  if(manualEntryType==='run'){
    const m = document.getElementById('createPaceInput').value.trim().match(/^(\d+):(\d\d)$/);
    return m ? {pace: parseInt(m[1],10) + parseInt(m[2],10)/60} : null;
  }
  return null;
}
function parseMinSec(str, fallbackSec){
  const m = str.trim().match(/^(\d+):(\d\d)$/);
  return m ? parseInt(m[1],10)*60 + parseInt(m[2],10) : fallbackSec;
}
function readIntervalConfig(){
  const rounds = Math.max(1, parseInt(document.getElementById('createRoundsInput').value,10) || 6);
  const workSec = parseMinSec(document.getElementById('createWorkDurationInput').value || document.getElementById('createWorkDurationInput').placeholder, 180);
  const restSec = parseMinSec(document.getElementById('createRestDurationInput').value || document.getElementById('createRestDurationInput').placeholder, 60);
  return {rounds, workSec, restSec};
}
// Files a workout that already happened onto a day as a "Logged Workout" -- from Create Workout with
// "already done" on, or a run imported from Strava with no planned run to attach to (fileStravaRun).
function logCompletedEntry(targetDayKey, fields){
  const entry = {id:'m'+Date.now()+Math.random().toString(36).slice(2,7), ...fields};
  ensureDayLog(targetDayKey).manualEntries.push(entry);
  const insertPromise = cloudInsertManualEntry(targetDayKey, entry).then(supabaseId=>{ if(supabaseId) entry.supabaseId = supabaseId; });
  // Nothing has claimed this day's headline yet (still a Rest Day or an untouched suggestion) --
  // let this genuinely-logged workout take over as the primary session too, instead of leaving
  // a stale "Rest Day" sitting above the very thing that actually happened.
  if(!getRawDaySlot(parseDateKey(targetDayKey)).isCustom){
    const loggedSession = ses(entry.type, entry.name, entry.volume||'', entry.name, entry.volume||'');
    promotePrimaryFromLog(targetDayKey, loggedSession);
    // Wait for the manual entry's own get-or-create workout_logs row before syncing the plan
    // onto it, so both land on the SAME row instead of racing to create two.
    insertPromise.then(()=> cloudSavePlannedSession(targetDayKey, loggedSession));
  }
  syncActualRunDistanceFromEntry(targetDayKey, entry);
  // A fresh log is the clearest possible "this happened" signal, so it should always win over any
  // earlier explicit "mark as not done" toggle -- otherwise a stale override could silently hide a
  // workout the user just told the app they did.
  ensureDayLog(targetDayKey).completedOverride = null;
  const idxInCurrentWeek = currentWeekIdxFor(targetDayKey);
  if(idxInCurrentWeek>=0 && idxInCurrentWeek!==TODAY_IDX){
    state.week[idxInCurrentWeek].completed = true;
  }
  state.doneCount = computeDoneCount();
  return entry;
}
document.getElementById('saveManualEntry').addEventListener('click', ()=>{
  const nameInput = document.getElementById('manualNameInput');
  const name = nameInput.value.trim();
  if(!name || !state.openDayKey){ nameInput.style.borderColor = 'var(--accent)'; nameInput.focus(); return; }
  const notes = document.getElementById('manualNotesInput').value.trim();
  const isCardioLog = manualEntryType==='run' && createMarkCompleted;
  let volume = document.getElementById('manualVolumeInput').value.trim();
  let cardioDistance = null, cardioDuration = null;
  if(isCardioLog){
    cardioDistance = parseFloat(document.getElementById('manualDistanceInput').value);
    cardioDuration = readHmsMinutes('manualDuration');
    cardioDistance = isNaN(cardioDistance) ? null : cardioDistance;
    // Derives the same free-text display shown everywhere else (bubbles, Home, Plan rows) from the
    // structured Distance/Duration fields, so nothing else in the app needs to change to show it.
    volume = [cardioDistance!=null ? `${cardioDistance} mi` : '', cardioDuration!=null ? fmtDurationClock(cardioDuration) : ''].filter(Boolean).join(' · ');
  }

  if(manualEntryType==='interval'){
    // An interval workout is completed by running its timer, not logged as an instant fact --
    // it always becomes the day's actual planned session (like Plan a Workout), never a plain entry.
    planCustomWorkout(state.openDayKey, {title:name, type:'interval', detail:volume, target:null, interval:readIntervalConfig()});
    closeManualEntry();
    refreshViews();
    showToast(STR[state.lang].workoutPlannedToast);
    return;
  }

  if(createMarkCompleted){
    // A cardio log's Date row can file it under a different day than the one Day Detail was opened
    // for -- everything else always stays on state.openDayKey.
    const dateInputVal = document.getElementById('manualDateInput').value;
    const targetDayKey = (isCardioLog && dateInputVal) ? dateInputVal : state.openDayKey;
    logCompletedEntry(targetDayKey, {name, type:manualEntryType, volume, notes, distance:cardioDistance, durationMin:cardioDuration});
    state.openDayKey = targetDayKey;
  } else {
    planCustomWorkout(state.openDayKey, {title:name, type:manualEntryType, detail:volume, target:readCreateTarget(), exercises: manualEntryType==='strength' ? manualExercises.slice() : null});
  }

  closeManualEntry();
  refreshViews();
  showToast(STR[state.lang][createMarkCompleted ? 'workoutLoggedToast' : 'workoutPlannedToast']);
});
function deleteManualEntry(key, id){
  const log = state.dayLog[key];
  if(!log) return;
  const entry = log.manualEntries.find(e=>e.id===id);
  log.manualEntries = log.manualEntries.filter(e=>e.id!==id);
  if(entry && entry.supabaseId) cloudDeleteManualEntry(entry.supabaseId);
  state.doneCount = computeDoneCount();
  refreshViews();
}

/* ---------------- progress ---------------- */
// The miles a run is planned for, from its detail ("4 mi", "5 mi · 6 x 800m", or a bare "5" the user
// typed) -- 0 for a timed session ("28 min · run 1 min, walk 2 min × 6").
function plannedMilesOf(session){
  const detail = String((session && session.en && session.en.detail) || '');
  const mi = milesInText(detail);
  if(mi!=null) return mi;
  if(/\bmin\b|\bsec\b|\d:\d/i.test(detail)) return 0;
  return parseFloat(detail) || 0;
}
function plannedMinutesOf(session){
  const m = String((session && session.en && session.en.detail) || '').match(/^(\d+)\s*min\b/);
  return m ? Number(m[1]) : null;
}
// Someone new to running goes by feel: no pace targets, suggestions or pace-based progression anywhere.
function isPaceFree(session){
  return !!session && session.t==='run' && (isNewRunner(planConfig()) || /^(Run\/Walk|Brisk Walk|Walk \+ Jog)$/.test(session.en.title));
}
// A structured run, step by step -- warm-up, the main set, recovery between reps, cool-down -- worked out
// from the run's own plan text ("3.5 mi · 2 mi at tempo pace", "5 mi · 9 x 400m", "28 min · run 1 min,
// walk 2 min × 6"). Paces are relative to the user's easy pace (their Easy Run target): tempo about
// 1:15/mi faster, fast repeats about 1:45/mi faster -- and left out entirely for someone going by feel.
// null for a plain easy/long/recovery run (nothing to break down) or a workout the user wrote themselves.
function quarterMile(x){ return Math.round(x*4)/4; }
function fmtStepMiles(x){ return `${+x.toFixed(2)} mi`; }
function runBreakdown(session){
  if(!session || session.t!=='run') return null;
  const L = STR[state.lang];
  const title = session.en.title, detail = session.en.detail || '';
  const total = plannedMilesOf(session);
  const byFeel = isPaceFree(session);
  const easyPace = (getProgressionTarget(ses('run','Easy Run','','',''), state.intensityIdx) || {}).pace || INTENSITY[state.intensityIdx].pace;
  const pace = p => byFeel ? '' : ` · ~${fmtPace(p)}/mi`;
  // Warm-up and cool-down split whatever the main set leaves (at most 1.5 mi each, at least a quarter).
  const ends = mainMiles => {
    const rest = Math.max(0.5, total - mainMiles);
    const warm = Math.max(0.25, quarterMile(Math.min(1.5, rest/2)));
    return [warm, Math.max(0.25, quarterMile(rest - warm))];
  };
  const warm = mi => ({label:L.bdWarmup, amount:fmtStepMiles(mi), note:L.bdWarmEasy});
  const cool = mi => ({label:L.bdCooldown, amount:fmtStepMiles(mi), note:L.bdCoolEasy});
  let m;
  if(title==='Tempo Run' && (m = detail.match(/·\s*([\d.]+)\s*mi at tempo/))){
    const tempo = parseFloat(m[1]);
    const [w, c] = ends(tempo);
    return [warm(w), {label:L.bdTempo, amount:fmtStepMiles(tempo), note:L.bdTempoEffort + pace(easyPace-1.25)}, cool(c)];
  }
  if(title==='Interval Run' && (m = detail.match(/(\d+)\s*x\s*(\d+)m/))){
    const reps = +m[1], meters = +m[2];
    const [w, c] = ends(reps*(meters+200)/1609); // each rep plus a 200m recovery jog
    return [warm(w), {label:L.bdRepeats, amount:`${reps} × ${meters}m`, note:L.bdFastEffort + pace(easyPace-1.75)},
      {label:L.bdRecovery, amount:'200m', note:L.bdJogBetween}, cool(c)];
  }
  if(title==='Fartlek Run' && (m = detail.match(/(\d+)\s*x\s*1 min/))){
    const reps = +m[1];
    const [w, c] = ends(reps*2/easyPace); // a minute fast + about a minute easy, each
    return [warm(w), {label:L.bdSurges, amount:`${reps} × 1 min`, note:L.bdFastEffort},
      {label:L.bdRecovery, amount:'1–2 min', note:L.bdEasyJog}, cool(c)];
  }
  if(title==='Hill Repeats' && (m = detail.match(/(\d+)\s*x\s*60s/))){
    const reps = +m[1];
    const [w, c] = ends(reps*2.5/easyPace); // 60s up + the way back down
    return [warm(w), {label:L.bdHills, amount:`${reps} × 60s`, note:L.bdHillEffort},
      {label:L.bdRecovery, amount:'', note:L.bdDownhill}, cool(c)];
  }
  if(title==='Easy Run + Strides' && total){
    return [{label:L.bdEasyRun, amount:fmtStepMiles(total), note:L.bdEasy + pace(easyPace)}, {label:L.bdStrides, amount:'4 × 20s', note:L.bdStridesEffort}];
  }
  if(title==='Walk + Jog'){
    const M = plannedMinutesOf(session) || 20;
    const walkStep = min => ({label:L.bdWalkLabel, amount:`${min} min`, note:L.bdWalk});
    if((m = detail.match(/walk (\d+) min, then jog the last (\d+) min/))){
      return [walkStep(+m[1]), {label:L.bdJogLabel, amount:`${m[2]} min`, note: /quicker/.test(detail) ? L.bdJogQuicker : L.bdJogAtWalkPace}];
    }
    const warmM = detail.match(/walk (\d+) min, then/);
    const warmMin = warmM ? +warmM[1] : 0;
    const steps = warmMin ? [walkStep(warmMin)] : [];
    if((m = detail.match(/jog (\d+) min \/ walk 1 min/))){
      // Blocks of jog + a minute's walk, as many as fit, then jog whatever's left to the end.
      const block = +m[1], left = M - warmMin, rounds = Math.floor(left/(block+1)), rest = left - rounds*(block+1);
      if(rounds) steps.push({label:L.bdJogWalkLabel, amount:`${rounds} × (${block} + 1 min)`, note:L.bdJogWalkNote.replace('{j}', block)});
      if(rest) steps.push({label:L.bdJogRestLabel, amount:`${rest} min`, note:L.bdJogEasy});
      return steps;
    }
    if((m = detail.match(/jog (?:the whole )?(\d+) min/))) return [...steps, {label:L.bdJogLabel, amount:`${m[1]} min`, note:L.bdJogEasy}];
    return null;
  }
  if(title==='Run/Walk' && (m = detail.match(/run ([\d.]+) min, walk ([\d.]+) min × (\d+)/))){
    return [{label:L.bdWarmup, amount:'5 min', note:L.bdWalk},
      {label:L.bdRunWalk, amount:`${m[3]} × (${m[1]} + ${m[2]} min)`, note:L.bdRunWalkNote},
      {label:L.bdCooldown, amount:'5 min', note:L.bdWalk}];
  }
  return null;
}
function runBreakdownHtml(session, extraClass){
  const steps = runBreakdown(session);
  if(!steps) return '';
  return `<ul class="r-exercise-list run-breakdown ${extraClass||''}">${steps.map(st=>
    `<li><span class="bd-step"><b>${escapeHtml(st.label)}</b> · ${escapeHtml(st.note)}</span><span>${escapeHtml(st.amount)}</span></li>`).join('')}</ul>`;
}
// Miles written in a workout's own text -- "4.5 miles", "16mile", "3.75mi", "4 mi", or "5k"/"10 km"
// (converted). Null when there's no explicit distance.
function milesInText(text){
  if(!text) return null;
  const mi = String(text).match(/(\d+(?:\.\d+)?)\s*(?:miles?|mi)\b/i);
  if(mi) return parseFloat(mi[1]);
  const km = String(text).match(/(\d+(?:\.\d+)?)\s*(?:km|k)\b/i);
  if(km) return +(parseFloat(km[1])*0.621371).toFixed(2);
  return null;
}
// A run's planned mileage, as the user originally wrote it: the name first ("Progression run 4.5
// miles" -- its detail may since have become what was actually run, e.g. "4.02 mi · 40:57"), then a
// bare leading number in the name ("3.2 Tempo run"), then the detail ("4 mi" on a generated plan),
// and only failing all of those, what was actually run.
function plannedRunMiles(session, actual){
  const L = session.en;
  const bare = String(L.title||'').match(/^\s*(\d+(?:\.\d+)?)\s+(?!(?:min|mins|minutes?|hrs?|hours?|secs?|seconds?|x|reps?|sets?)\b)[a-z]/i);
  const miles = milesInText(L.title) ?? (bare ? parseFloat(bare[1]) : null) ?? milesInText(L.detail) ?? actual;
  return miles || 0;
}
// distance: miles actually run this week. plannedDistance: miles planned across every run this
// week, done or not -- what Home's Distance card measures progress against. Each run is counted once
// even when the day's headline is really its first logged entry or first extra (see primaryLogTarget).
function weekStats(offset){
  const dates = weekDates(offset);
  // minutes / plannedMinutes: the same for timed sessions (a new runner's walks and run/walks), which
  // plan minutes rather than miles.
  let workouts = 0, distance = 0, plannedDistance = 0, minutes = 0, plannedMinutes = 0;
  dates.forEach(date=>{
    const dd = getDayData(date);
    const done = dd.completed;
    if((dd.p.t!=='rest' && done) || dd.manualEntries.length>0) workouts++;
    const head = dd.p.t!=='rest' ? primaryLogTarget(dd) : null;
    if(dd.p.t==='run' && head.kind!=='extra'){
      if(done) distance += dd.actualRunDistance!=null ? dd.actualRunDistance : plannedMilesOf(dd.p);
      plannedDistance += plannedRunMiles(dd.p, dd.actualRunDistance);
      const pm = plannedMinutesOf(dd.p);
      if(pm){
        plannedMinutes += pm;
        const perf = state.dayLog[dd.key] && state.dayLog[dd.key].performance;
        if(done) minutes += (perf && perf.time) || pm;
      }
    }
    // A run logged as an extra (secondary) workout for the day still counts toward weekly/lifetime
    // distance -- it's a real run regardless of which slot it was logged under.
    dd.extraWorkouts.forEach(w=>{
      if(!w.session || w.session.t!=='run') return;
      if(w.completed && w.actualDistance!=null) distance += w.actualDistance;
      plannedDistance += plannedRunMiles(w.session, w.actualDistance);
      const pm = plannedMinutesOf(w.session);
      if(pm){ plannedMinutes += pm; if(w.completed) minutes += (w.performance && w.performance.time) || pm; }
    });
    // Same for a second logged run that isn't the day's headline.
    dd.manualEntries.forEach(e=>{
      if(e.type!=='run' || (head && head.kind==='entry' && head.id===e.id)) return;
      if(e.distance!=null) distance += e.distance;
      plannedDistance += plannedRunMiles(ses(e.type, e.name, e.volume||'', e.name, e.volume||''), e.distance);
    });
  });
  return {workouts, distance, plannedDistance, minutes, plannedMinutes};
}
function weekBarLabel(offset){
  const L = STR[state.lang];
  if(offset===0) return L.barLabelNow;
  if(offset===-1) return L.barLabel1;
  if(offset===-2) return L.barLabel2;
  if(offset===-3) return L.barLabel3;
  return L.barLabelNAgo.replace('{n}', Math.abs(offset));
}
const PROG_MIN_WINDOW_END = -(PROG_MAX_BACK - PROG_WEEKS_SHOWN);
function renderProgress(){
  const L = STR[state.lang];

  const offsets = [];
  for(let o=state.progWindowEnd-(PROG_WEEKS_SHOWN-1); o<=state.progWindowEnd; o++) offsets.push(o);
  const weekData = offsets.map(o => ({offset:o, ...weekStats(o)}));
  const max = Math.max(7, ...weekData.map(w=>w.workouts));

  document.getElementById('progBarChart').innerHTML = weekData.map(w=>{
    const h = Math.max(6, Math.round((w.workouts/max)*100));
    const cls = [w.offset===0?'current':'', w.offset===state.progSelectedOffset?'selected':''].filter(Boolean).join(' ');
    return `<div class="bar-col ${cls}" data-offset="${w.offset}">
      <div class="col-bar" style="height:${h}%;"></div>
      <div class="col-label">${weekBarLabel(w.offset)}</div>
    </div>`;
  }).join('');
  document.getElementById('progBarChart').querySelectorAll('.bar-col').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.progSelectedOffset = parseInt(el.getAttribute('data-offset'),10);

  });

  document.getElementById('progWeeksPrev').disabled = state.progWindowEnd<=PROG_MIN_WINDOW_END;
  document.getElementById('progWeeksNext').disabled = state.progWindowEnd>=0;

  const sel = weekStats(state.progSelectedOffset);
  document.getElementById('progWeekDetail').innerHTML = `
    <div class="wd-range">${weekRangeLabel(state.progSelectedOffset)}</div>
    <div class="wd-stats">
      <div class="wd-stat"><div class="l">${L.weekDetailWorkoutsLabel}</div><div class="v">${sel.workouts}</div></div>
      <div class="wd-stat"><div class="l">${L.weekDetailDistanceLabel}</div><div class="v">${sel.distance.toFixed(1)} mi</div></div>
    </div>`;
  renderPRs();
}

/* ---------------- personal records (lift PRs) ---------------- */
function bestPrValueFor(exercise){
  const key = exercise.trim().toLowerCase();
  return state.prs.filter(p=>p.exercise.trim().toLowerCase()===key).reduce((max,p)=>Math.max(max,p.value), -Infinity);
}
// Entering a PR is an explicit, deliberate signal from the user -- more current and more trusted
// than an intensity-tier guess (getProgressionTarget seeds one of those the moment Home simply
// renders a session title, which happens constantly, so "only fill gaps" would almost never
// actually fire). A PR always updates that exercise's suggested weight; any existing rep target
// is left alone, since the PR is just a weight number, not a full working-set prescription.
function applyPRToProgression(exercise, value){
  const existing = state.progression[exerciseProgressionKey(exercise)];
  const target = {weight: value, reps: (existing && existing.reps) || 5};
  saveExerciseTarget(exercise, target);
}
function renderPRs(){
  const L = STR[state.lang];
  document.getElementById('prExerciseInput').placeholder = L.prExercisePlaceholder;
  document.getElementById('prValueInput').placeholder = state.weightUnit;
  const listEl = document.getElementById('prList');
  const sorted = state.prs.slice().sort((a,b)=> b.createdAt - a.createdAt);
  listEl.innerHTML = sorted.length ? sorted.map(pr=>{
    const isBest = pr.value === bestPrValueFor(pr.exercise);
    const dateStr = new Date(pr.createdAt).toLocaleDateString(state.lang==='es'?'es-ES':'en-US', {month:'short', day:'numeric'});
    return `<div class="manual-entry">
      <div class="body">
        <div class="n">${escapeHtml(pr.exercise)}${isBest?` <span style="color:var(--accent);font-size:10px;font-weight:700;letter-spacing:0.06em;">${L.prBestBadge}</span>`:''}</div>
        <div class="v">${pr.value} ${pr.unit} · ${dateStr}</div>
      </div>
      <button class="del" data-pr-del="${pr.id}" type="button">${ICONS.trash}</button>
    </div>`;
  }).join('') : `<div class="footer-note" style="text-align:left;padding:2px 0;">${L.noPrsLoggedLabel}</div>`;
  listEl.querySelectorAll('[data-pr-del]').forEach(btn=>{
    btn.addEventListener('click', ()=> deletePR(btn.getAttribute('data-pr-del')));
  });
}
document.getElementById('addPrBtn').addEventListener('click', ()=>{

/* ---------------- my lifts ---------------- */
// Every lift in the next four weeks of the plan, with the user's own weight and reps for each -- so
// someone new (or coming back) can set their real numbers all at once instead of waiting for the app's
// intensity-based guesses to catch up. Each number applies to that lift in every workout, and the
// usual progression carries on from there.
function planLifts(){
  const found = new Map();
  for(let w=0; w<4; w++) weekDates(w).forEach(date=>{
    const dd = getDayData(date);
    [dd.p, ...dd.extraWorkouts.map(x=>x.session)].forEach(session=>{
      (exercisesForSession(session, date) || []).forEach(ex=>{
        if(ex.durationSec==null && !found.has(ex.key)) found.set(ex.key, ex);
      });
    });
  });
  return [...found.values()];
}
function openLifts(){
  const L = STR[state.lang];
  const lifts = planLifts();
  document.getElementById('liftsList').innerHTML = lifts.length
    ? lifts.map(ex=>`<div class="lift-row" data-lift-key="${escapeHtml(ex.key)}" data-bodyweight="${ex.bodyweight?1:0}">
        <div class="lift-row-name">${escapeHtml(ex.name)}</div>
        <div class="lift-fields">${liftNumberInputsHtml(ex)}</div>
      </div>`).join('')
    : `<p class="fb-sub">${L.myLiftsEmpty}</p>`;
  document.getElementById('saveLiftsBtn').hidden = !lifts.length;
  document.getElementById('liftsOverlay').hidden = false;
}

/* ---------------- summary ---------------- */
function fmtTime(mins){
  const total = Math.round(mins), h = Math.floor(total/60), m = total%60;
  return h>0 ? `${h}:${String(m).padStart(2,'0')}:00` : `${m} min`;
}
function fmtPace(paceMin){
  const sec = Math.round(paceMin*60);
  return `${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`;
}
function fmtClock(totalSec){
  const m = Math.floor(totalSec/60), s = totalSec%60;
  return `${m}:${String(s).padStart(2,'0')}`;
}
// Like fmtTime(), but for a duration entered to the second (the cardio log's h:m:s fields) -- it
// shows the real seconds instead of always rounding down to :00.
function fmtDurationClock(totalMin){
  const totalSec = Math.round(totalMin*60);
  const h = Math.floor(totalSec/3600), m = Math.floor((totalSec%3600)/60), s = totalSec%60;
  return h>0 ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}` : `${m}:${String(s).padStart(2,'0')}`;
}
function getSummaryStats(session, intensityIdx, logged){
  const L = STR[state.lang];
  const tier = INTENSITY[intensityIdx];
  if(session.t==='run'){
    // What was actually run (if it was logged) is what the summary/pace should reflect --
    // the planned distance is only a fallback for the pre-completion seeded preview.
    if(isPaceFree(session)){
      // Going by feel: what was done, never a pace or a pace target.
      const mi = (logged && logged.distance!=null) ? logged.distance : plannedMilesOf(session);
      const min = (logged && logged.time) || plannedMinutesOf(session);
      const stats = [];
      if(min) stats.push({l:L.statTime, v:fmtDurationClock(min)});
      if(mi) stats.push({l:L.statDistance, v:mi.toFixed(1)+' mi'});
      stats.push({l:L.effortLabel, v:L.effortEasy});
      return stats;
    }
    const dist = (logged && logged.distance!=null) ? logged.distance : (plannedMilesOf(session) || 3);
    const totalMin = (logged && logged.time) ? logged.time : dist*tier.pace;
    const paceMin = dist>0 ? totalMin/dist : tier.pace;
    const paceStr = fmtPace(paceMin)+'/mi';
    const lo = tier.pace+0.4, hi = tier.pace-0.2;
    const tgt = `${fmtPace(hi)}–${fmtPace(lo)}/mi`;
    const target = getProgressionTarget(session, intensityIdx);
    const stats = [
      {l:L.statDistance, v:dist.toFixed(1)+' mi'},
      {l:L.statTime, v:fmtTime(totalMin)},
      {l:L.statPace, v:paceStr},
      {l:L.statTempoTarget, v:tgt},
    ];
    if(target && state._reviewSubmitted) stats.push({l:L.statProgress, v:fmtPace(target.pace)+'/mi'});
    return stats;
  }
  if(session.t==='strength'){
    const mins = parseFloat(session.en.detail) || 30;
    const stats = [
      {l:L.statTotalVolume, v: tier.vol.toLocaleString()+' lb'},
      {l:L.statTime, v: mins+' min'},
    ];
    if(logged && logged.exercises){
      // A structured session's real detail lives in the per-exercise results list, not a single
      // "top set" line -- see getSummaryExercises() / #summaryExercisesList.
      stats.push({l:L.statExerciseCount, v: logged.exercises.length});
      return stats;
    }
    const setsReps = ['3 x 12','4 x 10','5 x 5'][intensityIdx];
    const weight = (logged && logged.weight) || [95,135,195][intensityIdx];
    const reps = (logged && logged.reps) || [12,10,5][intensityIdx];
    const target = getProgressionTarget(session, intensityIdx);
    stats.push({l:L.statSetsReps, v: setsReps});
    stats.push({l:L.statTopSet, v: `${weight} lb x ${reps}`});
    if(target && state._reviewSubmitted) stats.push({l:L.statProgress, v:`${target.weight} lb`});
    return stats;
  }
  if(session.t==='hike'){
    return [
      {l:L.statDistance, v:'3.2 mi'},
      {l:L.statTime, v:'58 min'},
      {l:L.statElevGain, v:'410 ft'},
      {l:L.statAvgPace, v:'18:07/mi'},
    ];
  }
  if(session.t==='interval'){
    const cfg = session.interval || {rounds:6, workSec:180, restSec:60};
    const rounds = (logged && logged.rounds) || cfg.rounds;
    const totalMin = (rounds*cfg.workSec + Math.max(0,rounds-1)*cfg.restSec)/60;
    return [
      {l:L.intervalRoundsLabel, v: rounds},
      {l:L.timerWorkShort, v: fmtClock(cfg.workSec)},
      {l:L.timerRestShort, v: fmtClock(cfg.restSec)},
      {l:L.statTime, v: fmtTime(totalMin)},
    ];
  }
  return [];
}
function getSummaryExercises(logged){
  if(!logged || !logged.exercises) return null;
  return logged.exercises.map(res=>{
    let result;
    if(res.bodyweight) result = res.prescription;
    else if(res.sets && res.sets.length>1) result = res.sets.map(s=>`${s.weight}x${s.reps}`).join(', ');
    else result = `${res.weight} lb x ${res.reps}`;
    return {name: res.name, result};
  });
}
function renderSummary(){
  const L = STR[state.lang];
  const session = state._lastSession || todaySession();
  const sessL = ST(session);
  document.getElementById('summarySessTitle').textContent = `${sessL.title}${sessL.detail?', '+sessL.detail:''}`;
  const logged = state._lastLogged;
  const stats = getSummaryStats(session, state.intensityIdx, logged);
  document.getElementById('summaryStats').innerHTML = stats.map(s=>`<div class="cell"><div class="l">${s.l}</div><div class="v">${s.v}</div></div>`).join('');
  const exercisesEl = document.getElementById('summaryExercisesList');
  const exResults = getSummaryExercises(logged);
  exercisesEl.hidden = !exResults;
  if(exResults) exercisesEl.innerHTML = exResults.map(r=>`<div class="se-row"><span class="se-name">${escapeHtml(r.name)}</span><span class="se-result">${escapeHtml(r.result)}</span></div>`).join('');
  const noteObj = SUMMARY_NOTE[session.t] || SUMMARY_NOTE.run;
  document.getElementById('summaryNote').textContent = noteObj[state.lang];
  document.getElementById('summaryStreakVal').textContent = `${state.streak} ${L.dayStreakSuffix}`;
  const progNoteEl = document.getElementById('summaryProgressNote');
  const reviewCardEl = document.getElementById('summaryReviewCard');
  if(logged && !state._reviewSubmitted){
    // Right after finishing -- ask for the review before showing any progression result, since
    // the rating given here is what decides whether a met target actually counts as "advance".
    document.getElementById('reviewRatingSlider').value = 3;
    // Pre-fill with whatever notes were jotted down live while the workout was being logged --
    // the reviewer can still edit/extend them before submitting.
    document.getElementById('reviewNotesInput').value = (logged && logged.notes) || '';
    document.getElementById('reviewNotesInput').placeholder = L.reviewNotesPlaceholder;
    renderReviewRatingLabel();
    reviewCardEl.hidden = false;
    progNoteEl.hidden = true;
  } else if(logged && logged.exercises){
    reviewCardEl.hidden = true;
    const msg = (state._lastProgressed ? L.progressionUpMsgExercises : L.progressionHoldMsgExercises)
      .replace('{count}', state._lastProgressedCount).replace('{total}', state._lastProgressedTotal);
    document.getElementById('summaryProgressMsg').textContent = msg;
    progNoteEl.hidden = false;
  } else if(isPaceFree(session) && logged){
    reviewCardEl.hidden = true;
    document.getElementById('summaryProgressMsg').textContent = L.feelProgressMsg;
    progNoteEl.hidden = false;
  } else if((session.t==='strength'||session.t==='run') && logged){
    reviewCardEl.hidden = true;
    const target = getProgressionTarget(session, state.intensityIdx);
    const targetStr = session.t==='strength' ? `${target.weight} lb` : `${fmtPace(target.pace)}/mi`;
    const msg = (state._lastProgressed ? L.progressionUpMsg : L.progressionHoldMsg).replace('{target}', targetStr);
    document.getElementById('summaryProgressMsg').textContent = msg;
    progNoteEl.hidden = false;
  } else {
    reviewCardEl.hidden = true;
    progNoteEl.hidden = true;
  }
}

async function saveProfileToCloud(){
  if(!state.userId) return;
  try{
    const payload = {
      full_name: state.userName,
      goal: state.goal,
      level: state.level,
      training_days: state.trainingDays,
      focus_ratio: state.focusRatio,
      intensity_idx: state.intensityIdx,

      exercise_swaps: state.exerciseSwaps,
      strength_focus: state.strengthFocus,
      jog_baseline: state.jogBaseline,
      updated_at: new Date().toISOString(),
    };
    const { error } = await sb.from('profiles').update(payload).eq('id', state.userId);
    if(error){
      // Columns added by newer migrations may not exist yet on this project's live database --
      // retry without them so the rest of the profile (streak, totals, etc.) still saves instead of
      // the whole update silently failing over one missing column.
      ['last_counted_date','weekly_miles','equipment','plan_start','exercise_swaps','strength_focus','jog_baseline'].forEach(k=>{ delete payload[k]; });
      await sb.from('profiles').update(payload).eq('id', state.userId);

}

// A day's workout_logs row, found or created once and then remembered -- nearly every save touches it,
// and each used to look it up again first (an extra round trip every time). Sharing one lookup also
// stops two saves for the same new day from both trying to create its row.
const workoutLogRows = new Map(); // 'userId|YYYY-MM-DD' -> Promise<{id} | null>
function rememberWorkoutLogRow(dateStr, id){
  workoutLogRows.set(state.userId+'|'+dateStr, Promise.resolve({id}));
}
function cloudGetOrCreateWorkoutLog(dateStr){
  if(!state.userId) return Promise.resolve(null);
  const cacheKey = state.userId+'|'+dateStr;
  if(!workoutLogRows.has(cacheKey)){
    const lookup = (async ()=>{
      try{
        const { data: existing } = await sb.from('workout_logs').select('id')
          .eq('user_id', state.userId).eq('log_date', dateStr).maybeSingle();
        if(existing) return existing;
        const { data: created, error } = await sb.from('workout_logs')
          .insert({ user_id: state.userId, log_date: dateStr }).select('id').maybeSingle();
        if(error) throw error;
        return created;
      }catch(e){ return null; }
    })();
    workoutLogRows.set(cacheKey, lookup);
    lookup.then(row=>{ if(!row) workoutLogRows.delete(cacheKey); }); // try again next time
  }
  return workoutLogRows.get(cacheKey);
}

async function selectOwnRows(table, columnLists){

async function loadWorkoutDataFromCloud(){
  if(!state.userId) return;
  try{
    const LOG_COLS = 'id, log_date, completed_override, planned_type, planned_title, planned_detail, planned_interval_rounds, planned_interval_work_sec, planned_interval_rest_sec';
    const EXTRA_COLS = 'id, log_date, session_type, title, detail, exercises, interval_rounds, interval_work_sec, interval_rest_sec, completed';
    const [logsRes, extrasRes, targetsRes] = await Promise.all([
      selectOwnRows('workout_logs', [
        `${LOG_COLS}, actual_run_distance, performance, planned_exercises, manual_entries(id, name, type, volume, notes, distance, duration_min, performance)`,
        `${LOG_COLS}, actual_run_distance, performance, manual_entries(id, name, type, volume, notes, distance, duration_min, performance)`,
        `${LOG_COLS}, actual_run_distance, manual_entries(id, name, type, volume, notes, distance, duration_min)`,
        `${LOG_COLS}, manual_entries(id, name, type, volume, notes)`,
      ]),
      selectOwnRows('planned_workouts', [`${EXTRA_COLS}, actual_distance, performance`, `${EXTRA_COLS}, actual_distance`, EXTRA_COLS]),
      sb.from('progression_targets').select('*').eq('user_id', state.userId),
    ]);
    const logs = logsRes.data;
    if(logs){
      logs.forEach(row=>{
        const key = row.log_date; // Postgres `date` serializes as 'YYYY-MM-DD', same shape as dateKey()
        if(row.id) rememberWorkoutLogRow(key, row.id);
        const customSession = row.planned_type
          ? ses(row.planned_type, row.planned_title, row.planned_detail||'', row.planned_title, row.planned_detail||'')
          : null;
        if(customSession && Array.isArray(row.planned_exercises) && row.planned_exercises.length) customSession.exercises = row.planned_exercises;
        if(customSession && row.planned_type==='interval' && row.planned_interval_rounds!=null){
          customSession.interval = {rounds: row.planned_interval_rounds, workSec: row.planned_interval_work_sec, restSec: row.planned_interval_rest_sec};
        }
        state.dayLog[key] = {
          completedOverride: row.completed_override,
          manualEntries: (row.manual_entries||[]).map(e=>(
            { id:'m'+e.id, supabaseId:e.id, name:e.name, type:e.type, volume:e.volume||'', notes:e.notes||'', distance: e.distance ?? null, durationMin: e.duration_min ?? null, performance: e.performance ?? null }
          )),
          session: customSession ? {p: customSession, c: null, isCustom: true} : null,
          actualRunDistance: row.actual_run_distance ?? null,
          performance: row.performance ?? null,
        };
        // The current week's non-today slots track completion (and, for a custom plan, the session
        // itself) on state.week[i] directly rather than through dayLog -- mirror both there too so
        // the Home week-strip (which reads state.week directly) agrees with Day Detail / Calendar
        // (which read dayLog).
        const idx = currentWeekIdxFor(key);
        if(idx>=0){
          if(idx!==TODAY_IDX && typeof row.completed_override==='boolean'){
            state.week[idx].completed = row.completed_override;
          } else if(idx!==TODAY_IDX && customSession){
            // A freshly-loaded custom plan with no completion record yet defaults to not-done,
            // matching buildWeek()'s own default for a future/today training day -- but only when
            // there's no completed_override to respect. This used to run unconditionally AFTER the
            // override mirror above, silently clobbering a real completion back to false for any
            // custom day that was actually completed while it was still "today" -- the Home week
            // strip (which reads state.week directly) would show it as missed even though Calendar/
            // Progress/Day Detail (which read completedOverride straight off dayLog) had it right.
            state.week[idx].completed = false;
          }
          if(customSession){
            state.week[idx].p = customSession;
            state.week[idx].c = null;
            state.week[idx].isCustom = true;
          }
        }
      });
    }
    const extras = extrasRes.data;
    if(extras){
      // Replaced wholesale, never appended to, so loading again can't duplicate them.
      Object.values(state.dayLog).forEach(log=>{ log.extraWorkouts = []; });
      extras.forEach(row=>{
        const key = row.log_date;
        const session = ses(row.session_type, row.title, row.detail||'', row.title, row.detail||'');
        if(row.exercises) session.exercises = row.exercises;
        if(row.session_type==='interval' && row.interval_rounds!=null){
          session.interval = {rounds: row.interval_rounds, workSec: row.interval_work_sec, restSec: row.interval_rest_sec};
        }
        const log = ensureDayLog(key);
        log.extraWorkouts.push({ id:'w'+row.id, supabaseId: row.id, session, completed: !!row.completed, notes:'', actualDistance: row.actual_distance ?? null, performance: row.performance ?? null });
      });
    }
    const targets = targetsRes.data;
    if(targets){
      const prog = {};
      targets.forEach(t=>{
        const entry = {};
        if(t.weight!=null) entry.weight = t.weight;
        if(t.reps!=null) entry.reps = t.reps;
        if(t.pace_min!=null) entry.pace = t.pace_min;
        prog[t.session_key] = entry;
      });
      state.progression = prog;
    }
    state.doneCount = computeDoneCount();
  }catch(e){ /* local state remains authoritative if this fails */ }
}

/* ---------------- strava: runs from the watch, imported automatically ---------------- */
// The `strava` Edge Function (supabase/functions/strava) holds the Strava tokens and pulls recent runs
// into strava_activities. This side files each new run onto its day -- onto that day's planned run
// when there is one, the same as logging it in Log Performance, or as a Logged Workout otherwise --
// and stamps it applied, so a run is only ever imported once, on any device.
const STRAVA_CALLBACK_KEY = 'altiro_strava_callback';
const STRAVA_RESYNC_MS = 60*1000;
let strava = {connected:false, athleteName:'', status:'idle', lastSyncAt:0}; // status: 'idle' | 'syncing' | 'unavailable'

// Calls one of Altiro's Edge Functions as the signed-in user. The user's session token rides in
// x-altiro-user, and Authorization carries the project's anon key: Supabase's "Verify JWT" gateway
// rejects user tokens signed with the newer JWT signing keys (a 401 before the function even runs) but
// accepts the anon key -- so the functions work whether that setting is on or off. Each function checks
// the user's token itself.
async function invokeFunction(name, body){
  let token = null;
  try{ const { data } = await sb.auth.getSession(); token = data && data.session && data.session.access_token; }catch(e){}
  const headers = {Authorization: `Bearer ${SUPABASE_ANON_KEY}`};
  if(token) headers['x-altiro-user'] = token;
  return sb.functions.invoke(name, {body, headers});
}
async function stravaCall(action, extra){
  if(!sb.functions) return {error:{code:'offline'}};
  try{
    const { data, error } = await invokeFunction('strava', {action, ...(extra||{})});
    if(error){
      // A non-2xx reply carries the function's own {error} code in its body; a 404 means the
      // function hasn't been deployed to this project yet.
      let code = null, detail = null, status = error.context && error.context.status;
      try{ const body = await error.context.json(); code = body && body.error; detail = body && (body.message || body.msg); }catch(e){}
      return {error:{code: code || error.message, status, detail}};
    }
    return {data};
  }catch(e){ return {error:{code: String((e && e.message) || e)}}; }
}
// "Couldn't connect to Strava (401)" -- the reason in brackets, so a setup problem can be told apart
// from a passing hiccup (401: the function's "Verify JWT" is on; 5xx: a secret or table is missing).
function stravaFailedText(error){
  const L = STR[state.lang];
  // The function's own error code ("not_signed_in", "not_configured"...) when it sent one -- otherwise the
  // HTTP status, e.g. a bare 401 from Supabase's gateway when the function's Verify JWT is still on.
  const ownCode = error && /^[a-z_0-9]+$/.test(error.code || '') ? error.code : null;
  const why = ownCode || (error && error.status && [error.status, error.detail].filter(Boolean).join(' · '));
  return why ? `${L.stravaFailedToast} (${why})` : L.stravaFailedToast;
}
function stravaUnavailable(error){
  return error.status===404 || error.code==='not_configured';
}
function renderStravaSettings(){
  const L = STR[state.lang];
  let text;
  if(strava.status==='syncing') text = L.stravaSyncingSub;
  else if(strava.status==='unavailable') text = L.stravaUnavailableSub;
  else if(strava.connected) text = strava.athleteName ? L.stravaConnectedSub.replace('{name}', strava.athleteName) : L.stravaConnectedSubPlain;
  else text = L.stravaConnectSub;
  document.getElementById('stravaStatusText').textContent = text;
  // Not connected: Strava's own "Connect with Strava" button. Connected: Sync now and Disconnect.
  const connectBtn = document.getElementById('stravaConnectBtn'), syncBtn = document.getElementById('stravaSyncBtn');
  connectBtn.hidden = strava.connected || strava.status==='unavailable';
  syncBtn.hidden = !strava.connected;
  connectBtn.disabled = syncBtn.disabled = strava.status==='syncing';
  document.getElementById('stravaDisconnectBtn').hidden = !strava.connected;
}

// Files one imported run onto its day. Returns false when the run was already logged by hand -- the
// watch's distance rarely matches to the hundredth, so anything within 5% (or a quarter mile) of a run
// already logged that day counts as the same run.
function fileStravaRun(row){
  const key = String(row.local_date).slice(0,10);
  const miles = +(Number(row.distance_m||0)/1609.344).toFixed(2);
  const minutes = row.moving_time_s ? +(row.moving_time_s/60).toFixed(2) : null;
  const dd = getDayData(parseDateKey(key));
  const sameRun = d => d!=null && Math.abs(d-miles) <= Math.max(0.25, miles*0.05);
  if(sameRun(dd.actualRunDistance)
    || dd.extraWorkouts.some(w=>w.completed && sameRun(w.actualDistance))
    || dd.manualEntries.some(e=>e.type==='run' && sameRun(e.distance))) return false;

  const logged = {distance: miles, time: minutes, notes: '', source: 'strava', stravaId: row.id};
  // The day's planned run, or else its first Additional Workout run, if no distance is logged on it
  // yet -- otherwise this is an extra run that day, filed as its own Logged Workout.
  let target = null;
  const head = dd.p.t!=='rest' ? primaryLogTarget(dd) : null;
  if(dd.p.t==='run' && head.kind==='primary' && dd.actualRunDistance==null){
    target = head;
  } else {
    const w = dd.extraWorkouts.find(x=>x.session && x.session.t==='run' && x.actualDistance==null);
    if(w) target = {dayKey:key, kind:'extra', id:w.id};
  }
  if(target){
    const resolved = resolveLogTarget(target);
    storeLoggedPerformance(target, resolved, logged);
    if(target.kind==='primary' && key===dateKey(TODAY_DATE)){
      recordTodayPrimary(resolved.session, logged);
      saveProfileToCloud(); // streak / totals just changed
    } else {
      applyLoggedPerformance(target, resolved, logged);
    }
  } else {
    const volume = [`${miles} mi`, minutes!=null ? fmtDurationClock(minutes) : ''].filter(Boolean).join(' · ');
    logCompletedEntry(key, {name: row.name || 'Run', type:'run', volume, notes:'', distance: miles, durationMin: minutes});
  }
  return true;
}
async function importStravaActivities(){
  if(!state.userId) return 0;
  const { data: rows, error } = await sb.from('strava_activities')
    .select('id, name, local_date, distance_m, moving_time_s')
    .eq('user_id', state.userId).is('applied_at', null).order('start_date', {ascending: true});
  if(error || !rows || !rows.length) return 0;
  const imported = [];
  for(const row of rows){
    // Claim the run before filing it, so two devices syncing at the same moment can't both file it.
    const { data: claimed } = await sb.from('strava_activities')
      .update({applied_at: new Date().toISOString()}).eq('id', row.id).is('applied_at', null).select('id');
    if(!claimed || !claimed.length) continue;
    if(fileStravaRun(row)) imported.push(row);
  }
  if(!imported.length) return 0;
  refreshViews();
  const L = STR[state.lang];
  showToast(imported.length===1
    ? L.stravaImportedToast.replace('{name}', imported[0].name || 'Run').replace('{mi}', (imported[0].distance_m/1609.344).toFixed(1))
    : L.stravaImportedManyToast.replace('{count}', imported.length));
  return imported.length;
}
// Runs on sign-in, whenever the app comes back to the foreground, and from "Sync now" -- at most once a
// minute unless forced, since the watch -> Garmin -> Strava hop itself takes a minute or two anyway.
async function syncStrava(opts){
  const force = !!(opts && opts.force);
  if(!state.userId || !sb.functions || strava.status==='syncing') return null;
  if(!force && Date.now()-strava.lastSyncAt < STRAVA_RESYNC_MS) return null;
  strava.lastSyncAt = Date.now();
  const wasUnavailable = strava.status==='unavailable';
  strava.status = 'syncing';
  renderStravaSettings();
  const { data, error } = await stravaCall('sync');
  if(error){
    strava.status = (stravaUnavailable(error) || wasUnavailable) && !strava.connected ? 'unavailable' : 'idle';
    renderStravaSettings();
    return null;
  }
  strava.connected = !!data.connected;
  strava.athleteName = data.athlete_name || '';
  strava.status = 'idle';
  renderStravaSettings();
  return strava.connected ? await importStravaActivities() : null;
}
function stravaRedirectUri(){
  return new URL('strava-callback.html', window.location.href).href;
}
async function connectStrava(){
  const L = STR[state.lang];
  const { data, error } = await stravaCall('authorize_url', {redirect_uri: stravaRedirectUri()});
  if(error || !data || !data.url){
    if(error && stravaUnavailable(error)){ strava.status = 'unavailable'; renderStravaSettings(); }
    if(error) console.warn('Strava authorize_url failed', error);
    showToast(stravaFailedText(error));
    return;
  }
  window.location.href = data.url;
}
// Finishes a connection when the app reopens after Strava's "Authorize" page (strava-callback.html
// leaves Strava's reply in localStorage). Returns true if there was one to finish.
async function finishStravaConnect(){
  let cb = null;
  try{
    const raw = localStorage.getItem(STRAVA_CALLBACK_KEY);
    localStorage.removeItem(STRAVA_CALLBACK_KEY);
    cb = raw ? JSON.parse(raw) : null;
  }catch(e){ cb = null; }
  if(!cb || !state.userId || Date.now()-cb.at > 10*60*1000) return false;
  const L = STR[state.lang];
  const params = new URLSearchParams(cb.search || '');
  showScreen('settings');
  if(params.get('error') || !params.get('code')){ showToast(L.stravaCancelledToast); return true; }
  strava.status = 'syncing';
  renderStravaSettings();
  const { data, error } = await stravaCall('connect', {code: params.get('code'), scope: params.get('scope') || ''});
  strava.status = 'idle';
  if(error || !data || !data.connected){
    renderStravaSettings();
    if(error) console.warn('Strava connect failed', error);
    showToast(error && error.code==='missing_activity_scope' ? L.stravaNeedsActivityToast : stravaFailedText(error));
    return true;
  }
  strava.connected = true;
  strava.athleteName = data.athlete_name || '';
  strava.lastSyncAt = Date.now();
  renderStravaSettings();
  if(!(await importStravaActivities())) showToast(L.stravaConnectedToast);
  return true;
}
// Called once the signed-in user's own data has loaded (all three sign-in paths).
function startStravaSync(){
  finishStravaConnect().then(finished=>{ if(!finished) syncStrava({force:true}); });
}
document.getElementById('stravaConnectBtn').addEventListener('click', ()=>{
  if(strava.status==='syncing' || strava.connected) return;
  connectStrava();
});
document.getElementById('stravaSyncBtn').addEventListener('click', async ()=>{
  if(strava.status==='syncing' || !strava.connected) return;
  const count = await syncStrava({force:true});
  if(count===0) showToast(STR[state.lang].stravaUpToDateToast);
});
// Strava's official button/logo files; if one isn't in www/img/strava/ yet, its stand-in shows instead.
document.querySelectorAll('img[data-strava-asset]').forEach(img=>{
  const missing = ()=> img.parentElement.classList.add('asset-missing');
  img.addEventListener('error', missing);
  if(img.complete && !img.naturalWidth) missing();
});
document.getElementById('stravaDisconnectBtn').addEventListener('click', async ()=>{
  const { error } = await stravaCall('disconnect');
  if(error){ showToast(stravaFailedText(error)); return; }
  strava.connected = false;
  strava.athleteName = '';
  renderStravaSettings();
  showToast(STR[state.lang].stravaDisconnectedToast);
});
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='visible') syncStrava();
});

document.getElementById('googleSignInBtn').addEventListener('click', async function(){
  const btn = this;
  if(btn.disabled) return;
  const labelEl = btn.querySelector('.glabel');
  const L = STR[state.lang];
  btn.disabled = true;
  labelEl.textContent = L.signingInMsg;
  document.getElementById('authError').textContent = '';
  const { error } = await sb.auth.signInWithOAuth({ provider: 'google' });
  if(error){
    // Expected until Google OAuth is configured in the Supabase dashboard
    // (Authentication -> Providers -> Google). Surface it rather than fake success.
    document.getElementById('authError').textContent = error.message;
    btn.disabled = false;
    labelEl.textContent = L.googleSignInBtn;
  }
  // On success Supabase redirects the page to Google and back; onAuthStateChange below
  // picks up the resulting session, so there's nothing further to do here.
});

function updateEmailSignupBtn(){
  const email = document.getElementById('emailInput').value.trim();
  const pw = document.getElementById('passwordInput').value;
  document.getElementById('emailSignupBtn').disabled = !(email.includes('@') && email.length>4 && pw.length>=4);
}
document.getElementById('emailInput').addEventListener('input', updateEmailSignupBtn);
document.getElementById('passwordInput').addEventListener('input', updateEmailSignupBtn);
// Every way of arriving signed in -- a saved session on page load, email sign-in, coming back from
// Google -- goes through enterSignedIn(). Supabase ALSO reports each of those as a SIGNED_IN event
// (and again whenever the tab comes back into view), so a given user's data is only loaded once --
// loading it twice at the same time used to duplicate Additional Workouts.
let signedInLoad = null; // {userId, promise}
let signingUp = false;
function setSignedInUser(user){
  state.signedIn = true;
  state.userEmail = user.email;
  state.userName = user.email.split('@')[0]; // replaced by the profile's real name, if there is one
  state.userId = user.id;
}
function enterSignedIn(user){
  if(signedInLoad && signedInLoad.userId===user.id) return signedInLoad.promise;
  setSignedInUser(user);
  const promise = (async ()=>{
    await loadProfileFromCloud(); // rebuilds state.week, which the workout data below is merged into
    await Promise.all([loadWorkoutDataFromCloud(), loadPRsFromCloud()]);
    applyLang();
    // Straight to Home, not the "Building your plan" loading screen -- that screen's animation ends
    // by regenerating state.week from scratch, which would wipe out the planned/logged workouts just
    // loaded (a returning user's plan already exists, there's nothing to "build").
    showScreen('home');
    startStravaSync();
  })();
  signedInLoad = {userId: user.id, promise};
  return promise;
}
document.getElementById('emailSignupBtn').addEventListener('click', async function(){
  const btn = this;
  if(btn.disabled) return;
  const L = STR[state.lang];
  const email = document.getElementById('emailInput').value.trim();
  const password = document.getElementById('passwordInput').value;
  const errEl = document.getElementById('authError');
  errEl.style.color = 'var(--accent)';
  errEl.textContent = '';
  btn.disabled = true;
  btn.textContent = authMode==='signup' ? L.creatingAccountMsg : L.signingInMsg;
  try{
    if(authMode==='signup'){
      signingUp = true;
      const { data, error } = await sb.auth.signUp({ email, password }).finally(()=>{ signingUp = false; });
      if(error) throw error;
      if(!data.session){
        // Email confirmation is required by this Supabase project's Auth settings --
        // there's no session yet, so don't pretend the user is signed in.
        errEl.style.color = 'var(--ok-icon)';
        errEl.textContent = L.confirmEmailMsg;
        authMode = 'signin';
        return;
      }
      setSignedInUser(data.user);
      signedInLoad = {userId: data.user.id, promise: Promise.resolve()}; // nothing to load yet
      showScreen('loading');
    } else {
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if(error) throw error;
      await enterSignedIn(data.user);
    }
  }catch(err){
    errEl.style.color = 'var(--accent)';
    errEl.textContent = err.message || 'Something went wrong.';
  }finally{
    btn.disabled = false;
    updateAuthModeUI();
  }
});

sb.auth.onAuthStateChange((event, session)=>{
  // A brand-new account goes to the "Building your plan" screen instead (see the signup branch above).
  if(event==='SIGNED_IN' && session && !state.signedIn && !signingUp) enterSignedIn(session.user);
  if(event==='SIGNED_OUT'){
    state.signedIn = false;
    state.userId = null;
    signedInLoad = null;
  }
});

/* ---------------- how-it-works tutorial ---------------- */
const TUTORIAL_SLIDE_COUNT = 5;
let tutorialSlide = 0;
let tutorialOrigin = 'welcome';
function renderTutorialSlide(){
  document.querySelectorAll('.tut-slide').forEach(s=>{
    s.hidden = parseInt(s.getAttribute('data-slide'),10) !== tutorialSlide;
  });
  const dotsEl = document.getElementById('tutorialDots');
  dotsEl.innerHTML = Array.from({length:TUTORIAL_SLIDE_COUNT}).map((_,i)=>`<span class="tut-dot ${i===tutorialSlide?'on':''}"></span>`).join('');
  document.getElementById('tutorialBack').style.visibility = tutorialSlide===0 ? 'hidden' : 'visible';
  const L = STR[state.lang];
  document.getElementById('tutorialNext').textContent = tutorialSlide === TUTORIAL_SLIDE_COUNT-1
    ? (tutorialOrigin==='settings' ? L.tutDone : L.tutGetStarted)
    : L.tutNext;
}
function openTutorial(origin){
  tutorialOrigin = origin || 'welcome';
  tutorialSlide = 0;
  renderTutorialSlide();
  document.getElementById('tutorialOverlay').hidden = false;
}
function closeTutorial(){
  document.getElementById('tutorialOverlay').hidden = true;
}
document.getElementById('openTutorialBtn').addEventListener('click', ()=> openTutorial('welcome'));
document.getElementById('settingsTutorialBtn').addEventListener('click', ()=> openTutorial('settings'));
document.getElementById('tutorialSkip').addEventListener('click', closeTutorial);
document.getElementById('tutorialBack').addEventListener('click', ()=>{
  if(tutorialSlide>0){ tutorialSlide--; renderTutorialSlide(); }
});
document.getElementById('tutorialNext').addEventListener('click', ()=>{
  if(tutorialSlide < TUTORIAL_SLIDE_COUNT-1){ tutorialSlide++; renderTutorialSlide(); }
  else {
    closeTutorial();
    if(tutorialOrigin==='welcome') showScreen('onb-goal');
  }
});

/* ---------------- init ---------------- */
setupSliders();
ensureWeek();
applyLang();
showScreen('welcome');
(async function initAuth(){
  // Runs after the synchronous init above so there's no blank-screen flash while this
  // resolves -- a returning signed-in user briefly sees Welcome, then jumps to Home.
  try{
    await supabaseReady; // don't ask the offline stub whether a real session exists
    const { data: { session } } = await sb.auth.getSession();
    if(session) await enterSignedIn(session.user);
  }catch(e){ /* stay on Welcome if the session check fails */ }
})();
})();
