<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Altiro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg-outer:#000000;
  --bg-outer-2:#000000;
  --card:#2A2A2D;
  --card-2:#333336;
  --well:#161618;
  --border:#48484C;
  --text:#F5F5F5;
  --text-2:#A8A8AC;
  --text-3:#7A7A7E;
  --accent:#DA1419;
  --accent-hover:#F23A3F;
  --accent-tint:rgba(218,20,25,0.16);
  --accent-shadow:rgba(218,20,25,0.4);
  --accent-bright:#FF5257;
  --alert:#F23A3F;
  --alert-halo:rgba(242,58,63,0.25);
  --ok-border:#1C8A38;
  --ok-icon:#3FC95F;
  --ok-bg:rgba(0,162,38,0.15);
  --screen-bg:#0B0B0C;
  --sheet-bg:#1C1C1E;
  --tutorial-bg:#1e1f22;
  --toast-bg:#2f3237;
  --toast-text:var(--text);
  --nav-divider:#2C2C2E;
  --divider:#3A3A3D;
  --divider-soft:#4D4D4D;
  --hover-border:#757575;
  --mo-hover-border:#54585f;
  --muted-dot:#5A5A5A;
  --on-accent:#F7ECEA;
  --disabled-bg:#3A3A3A;
  --disabled-text:#6E6E6E;
  --today-tint-text:#F0A9AC;
  --today-ring:#3B82F6;
  --today-ring-tint:rgba(59,130,246,0.16);
  --today-ring-text:#9EC5FF;
  --warn:#E5A93B;
  --ring:#F0F1F3;
  --weather-icon:#E0B24A;
  --r-sm:10px;
  --r-md:14px;
  --r-lg:20px;
  --r-pill:999px;
  --font-display:'Montserrat','Arial Black',sans-serif;
  --font-body:'IBM Plex Sans',-apple-system,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono','SF Mono',monospace;
}
#device[data-theme="light"]{
  --card:#FFFFFF;
  --card-2:#FFFFFF;
  --well:#EFF2F5;
  --border:#E1E4E8;
  --text:#0B0B0C;
  --text-2:#5B6169;
  --text-3:#8A8F96;
  --accent:#1E8449;
  --accent-hover:#27AE60;
  --accent-tint:rgba(30,132,73,0.12);
  --accent-shadow:rgba(30,132,73,0.3);
  --accent-bright:#2ECC71;
  --alert:#D64545;
  --alert-halo:rgba(214,69,69,0.2);
  --ok-border:#4F6B4F;
  --ok-icon:#5F7F5F;
  --ok-bg:rgba(79,107,79,0.10);
  --screen-bg:#F9F9F6;
  --sheet-bg:#FFFFFF;
  --tutorial-bg:#FFFFFF;
  --toast-bg:#2A2C30;
  --toast-text:#F5F5F5;
  --nav-divider:#E4E6E8;
  --divider:#E4E6E8;
  --divider-soft:#D8DADC;
  --hover-border:#B9BCC0;
  --mo-hover-border:#A9ACB0;
  --muted-dot:#C7CACD;
  --on-accent:#FFFFFF;
  --disabled-bg:#E4E6E8;
  --disabled-text:#9CA0A5;
  --today-tint-text:#1B6B3A;
  --today-ring:var(--accent);
  --today-ring-tint:var(--accent-tint);
  --today-ring-text:var(--today-tint-text);
  --warn:#B7791F;
  --ring:#FFFFFF;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  background:
    repeating-linear-gradient(115deg, rgba(255,255,255,0.015) 0 2px, transparent 2px 68px),
    radial-gradient(ellipse at 50% -10%, #1C1C1E 0%, var(--bg-outer) 45%, var(--bg-outer-2) 100%);
  color:var(--text);
  font-family:var(--font-body);
  min-height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:16px;
  padding-inline:16px;
}

/* ---------- prototype navigator (outside the app) ---------- */
.proto-nav{width:100%;max-width:390px;margin-top:18px;display:flex;flex-direction:column;gap:10px;}
.proto-title{font-family:var(--font-mono);font-size:10px;letter-spacing:0.12em;color:#5f6672;text-transform:uppercase;display:flex;align-items:center;justify-content:space-between;}
.proto-title button{font-family:var(--font-mono);font-size:10px;letter-spacing:0.08em;text-transform:uppercase;background:none;border:1px solid #3a3d43;color:#8a8f99;padding:4px 8px;border-radius:var(--r-sm);cursor:pointer;}
.proto-title button:hover{border-color:var(--accent);color:#d8b6b3;}
.proto-pills{display:flex;flex-wrap:wrap;gap:6px;}
.proto-pill{font-family:var(--font-mono);font-size:10px;background:#232529;border:1px solid #34373d;color:#7d838d;padding:5px 8px;border-radius:var(--r-sm);cursor:pointer;letter-spacing:0.03em;line-height:1.4;}
.proto-pill:hover{color:var(--text);border-color:#54585f;}
.proto-pill.current{color:#F0F1F3;border-color:var(--accent);background:rgba(218,20,25,0.14);}

/* ---------- device frame ---------- */
.device-wrap{width:100%;max-width:390px;margin-bottom:28px;}
.device{
  position:relative;width:100%;aspect-ratio:390/844;
  background:var(--bg-outer-2);border:10px solid #0d0e10;border-radius:34px;
  box-shadow:0 30px 60px -20px rgba(0,0,0,0.6), inset 0 0 0 1px #2A2A2C;
  overflow:hidden;
}
.device::before{content:"";position:absolute;top:10px;left:50%;transform:translateX(-50%);width:84px;height:5px;background:#0d0e10;border-radius:3px;z-index:50;}
.screen{position:absolute;inset:0;background:var(--screen-bg);display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;}
.screen[hidden]{display:none;}
/* On an actual phone-width viewport the app fills the screen edge-to-edge like a real mobile web
   app instead of showing a shrunk-down mockup of itself -- the bezel/notch/shadow chrome below is
   a desktop-only presentation choice. Tablet and desktop keep the framed device look. */
@media (max-width:480px){
  body{padding-inline:0;gap:8px;height:100vh;height:100dvh;overflow:hidden;}
  .proto-nav{max-width:none;padding-inline:14px;flex-shrink:0;}
  /* The device fills whatever height is left under the prototype navigator, rather than a flat
     100dvh -- otherwise the nav's own height would push the app below the visible viewport. */
  .device-wrap{max-width:none;margin-bottom:0;flex:1;min-height:0;}
  .device{
    width:100%;height:100%;aspect-ratio:auto;
    border:none;border-radius:0;box-shadow:none;
  }
  .device::before{display:none;}
  /* No more bezel to sit content below, so screens must clear a real notch/status bar themselves. */
  .screen{padding-top:env(safe-area-inset-top,0px);}
}
.screen.anim{animation:screenIn .3s ease both;}
@keyframes screenIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
@media (prefers-reduced-motion: reduce){.screen.anim{animation:none;}}
.screen::-webkit-scrollbar{width:0;height:0;}
.tab-screen{padding-bottom:calc(70px + env(safe-area-inset-bottom,0px));}

.pad{padding:34px 20px 24px;}
.grow{flex:1;}

/* ---------- typography helpers ---------- */
.eyebrow{font-family:var(--font-mono);font-size:10.5px;letter-spacing:0.14em;text-transform:uppercase;color:var(--text-3);}
h1.hl, h2.hl{font-family:var(--font-display);font-weight:600;text-transform:none;line-height:1.18;letter-spacing:0.005em;color:var(--text);margin:8px 0 0;text-wrap:balance;}
h1.hl{font-size:23px;}
h2.hl{font-size:21px;}
p.sub{font-family:var(--font-body);font-size:13.5px;line-height:1.55;color:var(--text-2);margin:10px 0 0;}
.label{font-family:var(--font-display);font-weight:600;font-size:12px;letter-spacing:0.05em;text-transform:uppercase;color:var(--text);}

/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;gap:10px;padding:18px 20px 0;min-height:34px;}
.iconbtn{width:30px;height:30px;display:flex;align-items:center;justify-content:center;background:var(--well);border:1px solid var(--border);border-radius:50%;color:var(--text-2);cursor:pointer;flex-shrink:0;}
.iconbtn:hover{color:var(--text);border-color:var(--hover-border);}
.iconbtn:disabled{opacity:0.35;cursor:default;}
.iconbtn:disabled:hover{color:var(--text-2);border-color:var(--border);}
.iconbtn svg{width:15px;height:15px;}
.topbar .step-tag{font-family:var(--font-mono);font-size:10.5px;letter-spacing:0.1em;color:var(--text-3);text-transform:uppercase;margin-left:2px;}

/* ---------- language toggle ---------- */
.lang-toggle{display:inline-flex;border:1px solid var(--border);border-radius:var(--r-pill);overflow:hidden;flex-shrink:0;}
.lang-btn{padding:6px 10px;font-family:var(--font-mono);font-size:10.5px;letter-spacing:0.05em;background:var(--well);color:var(--text-3);border:none;cursor:pointer;}
.lang-btn+.lang-btn{border-left:1px solid var(--border);}
.lang-btn.active{background:var(--accent);color:var(--on-accent);}
.lang-btn:hover{color:var(--text);}
.lang-btn.active:hover{color:var(--on-accent);}
.welcome-top{display:flex;align-items:center;justify-content:flex-end;gap:10px;}
.brand-logo-wrap{display:flex;justify-content:center;margin-top:6px;}
.brand-logo{width:66%;max-width:230px;height:auto;display:block;}
.tagline{font-family:var(--font-mono);font-size:10.5px;letter-spacing:0.1em;text-transform:uppercase;color:var(--accent-hover);text-align:center;margin-top:16px;}

/* ---------- google sign-in ---------- */
.google-btn{height:46px;border-radius:var(--r-pill);background:#FFFFFF;color:#1f1f1f;border:1px solid #dadce0;font-family:var(--font-body);font-weight:500;font-size:14px;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;cursor:pointer;}
.google-btn:hover{background:#f7f7f7;}
.google-btn:disabled{opacity:0.75;cursor:default;}
.google-btn .gicon{width:18px;height:18px;flex-shrink:0;display:flex;}
.google-btn .gicon svg{width:18px;height:18px;}

/* ---------- progress bar (onboarding) ---------- */
.progress{display:flex;gap:5px;padding:0 20px;margin-top:14px;}
.progress i{flex:1;height:3px;background:var(--well);border-radius:2px;}
.progress i.on{background:var(--accent);}

/* ---------- buttons ---------- */
.btn{height:46px;border-radius:var(--r-pill);border:none;font-family:var(--font-display);font-weight:600;font-size:13px;letter-spacing:0.06em;text-transform:uppercase;cursor:pointer;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;}
.btn[hidden]{display:none;}
.btn-primary{background:linear-gradient(135deg,var(--accent-hover),var(--accent));color:var(--on-accent);box-shadow:0 4px 14px var(--accent-shadow);}
.btn-primary:hover{background:linear-gradient(135deg,var(--accent-bright),var(--accent-hover));}
.btn-primary:disabled{background:var(--disabled-bg);color:var(--disabled-text);cursor:not-allowed;}
.btn-ghost{background:transparent;color:var(--text-2);border:1px solid var(--border);}
.btn-ghost:hover{color:var(--text);border-color:var(--hover-border);}
.btn-text{background:none;border:none;font-family:var(--font-body);font-size:12.5px;color:var(--text-3);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:6px;}
.btn-text:hover{color:var(--text-2);}

.footer-cta{padding:14px 20px calc(18px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--nav-divider);background:var(--screen-bg);display:flex;flex-direction:column;gap:8px;}
.footer-note{font-size:11px;color:var(--text-3);text-align:center;}

/* ---------- option cards ---------- */
.option-list{display:flex;flex-direction:column;gap:10px;margin-top:22px;}
.option-card{background:var(--card);border:1px solid var(--border);border-left:4px solid var(--border);border-radius:var(--r-lg);padding:13px 14px;cursor:pointer;display:flex;flex-direction:column;gap:3px;}
.option-card .t{font-family:var(--font-body);font-weight:600;font-size:14px;color:var(--text);}
.option-card .s{font-size:12px;color:var(--text-3);}
.option-card.sel{border-left-color:var(--accent);border-color:var(--accent);background:linear-gradient(0deg,var(--accent-tint),var(--accent-tint)),var(--card);}
.option-card:hover{border-color:var(--hover-border);}
.option-card.sel:hover{border-color:var(--accent);}

/* ---------- chips (optional quick-info) ---------- */
.chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px;}
.chip{padding:8px 14px;background:var(--well);border:1px solid var(--border);border-radius:var(--r-pill);font-size:12.5px;color:var(--text-2);cursor:pointer;}
.chip.sel{border-color:var(--accent);background:var(--accent-tint);color:var(--text);}
.chip:hover{border-color:var(--hover-border);}
.chip.sel:hover{border-color:var(--accent);}
.field-row{display:flex;gap:8px;margin-top:9px;}
.text-input{flex:1;width:100%;height:44px;background:var(--well);border:1px solid var(--border);border-radius:var(--r-md);padding:0 12px;color:var(--text);font-family:var(--font-body);font-size:14px;min-width:0;}
.text-input:focus{outline:none;border-color:var(--accent);}
.divider-row{display:flex;align-items:center;gap:10px;margin:22px 0;}
.divider-row .line{flex:1;height:1px;background:var(--border);}
.divider-row .or-text{font-family:var(--font-mono);font-size:10px;letter-spacing:0.08em;color:var(--text-3);text-transform:uppercase;}
.text-input::placeholder{color:var(--text-3);}
.text-input:focus{outline:none;border-color:var(--accent);}
textarea.text-input{height:auto;min-height:64px;padding:10px 12px;resize:vertical;font-family:var(--font-body);}
.rating-slider{width:100%;accent-color:var(--accent);height:6px;margin-top:4px;}
.rating-label{text-align:center;font-size:14px;font-weight:600;color:var(--text);margin-top:8px;}
.unit-toggle{display:inline-flex;border:1px solid var(--border);border-radius:var(--r-pill);overflow:hidden;flex-shrink:0;}
.unit-btn{padding:0 12px;height:44px;background:var(--well);color:var(--text-3);border:none;font-family:var(--font-mono);font-size:11px;cursor:pointer;}
.unit-btn+.unit-btn{border-left:1px solid var(--border);}
.unit-btn.sel{background:var(--accent);color:var(--on-accent);}
.days-summary{margin-top:14px;font-family:var(--font-mono);font-size:11px;letter-spacing:0.05em;color:var(--text-2);text-transform:uppercase;}

/* ---------- slider ---------- */
.slider-block{margin-top:26px;}
.slider-endlabels{display:flex;justify-content:space-between;margin-bottom:12px;}
.slider-endlabels span{font-family:var(--font-mono);font-size:9.5px;letter-spacing:0.08em;color:var(--text-3);text-transform:uppercase;max-width:80px;}
.slider-endlabels span:last-child{text-align:right;}
.slider-track-wrap{padding:14px 10px;position:relative;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;}
.slider-track{position:relative;height:4px;background:var(--well);border-radius:2px;cursor:pointer;}
.slider-fill{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:2px;}
.slider-ticks{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:center;pointer-events:none;}
.slider-ticks i{width:3px;height:3px;background:var(--muted-dot);border-radius:50%;}
.slider-thumb{position:absolute;top:50%;width:30px;height:30px;background:var(--accent);border:3px solid var(--ring);border-radius:50%;transform:translate(-50%,-50%);cursor:grab;box-shadow:0 2px 6px rgba(0,0,0,0.4);touch-action:none;}
.slider-thumb:active{cursor:grabbing;}
.slider-value{text-align:center;font-family:var(--font-display);font-weight:600;font-size:13px;letter-spacing:0.04em;text-transform:uppercase;color:var(--text);margin-top:6px;}

.preview-block{margin-top:22px;display:flex;flex-direction:column;gap:10px;}
.preview-card{background:var(--well);border:1px solid var(--divider);border-left:4px solid var(--border);border-radius:var(--r-lg);padding:12px 13px;display:flex;align-items:flex-start;gap:10px;}
.preview-card.primary{border-left-color:var(--accent);}
.preview-card .ic{width:28px;height:28px;flex-shrink:0;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;color:var(--text-2);}
.preview-card .ic svg{width:15px;height:15px;}
.preview-card .body .k{font-family:var(--font-mono);font-size:9.5px;letter-spacing:0.1em;color:var(--text-3);text-transform:uppercase;}
.preview-card .body .v{font-family:var(--font-body);font-weight:600;font-size:14px;color:var(--text);margin-top:2px;}

/* ---------- checklist / loading ---------- */
.load-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;padding:20px 28px;text-align:center;gap:26px;}
.load-wrap h2.hl{text-align:center;}
.checklist{width:100%;display:flex;flex-direction:column;gap:10px;}
.check-item{display:flex;align-items:center;gap:10px;background:var(--well);border:1px solid var(--divider);border-left:4px solid var(--border);border-radius:var(--r-lg);padding:12px 13px;text-align:left;}
.check-item .st{width:20px;height:20px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.check-item .lbl{font-size:13px;color:var(--text-3);font-weight:500;}
.check-item.active{border-left-color:var(--accent);}
.check-item.active .lbl{color:var(--text);}
.check-item.done{border-left-color:var(--ok-border);background:var(--ok-bg);}
.check-item.done .lbl{color:var(--text);}
.spin{animation:spin 0.9s linear infinite;color:var(--accent);}
@keyframes spin{to{transform:rotate(360deg);}}
@media (prefers-reduced-motion: reduce){.spin{animation:none;}}

/* ---------- home header ---------- */
.home-header{padding:18px 20px 0;}
.greeting-row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
.home-greeting{font-family:var(--font-display);font-weight:600;font-size:20px;color:var(--text);}
.home-date{font-family:var(--font-mono);font-size:11px;letter-spacing:0.04em;color:var(--text-3);text-transform:uppercase;margin-top:3px;}
.chip-strip{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
.weather-chip,.streak-chip{display:flex;align-items:center;gap:6px;background:var(--well);border:1px solid var(--divider);border-radius:var(--r-pill);padding:6px 10px;font-family:var(--font-mono);font-size:11px;color:var(--text-2);}
.weather-chip svg{width:13px;height:13px;color:var(--weather-icon);}
.streak-chip svg{width:13px;height:13px;color:var(--accent);}

/* ---------- record button ---------- */
.record-hero{display:flex;flex-direction:column;align-items:center;gap:9px;padding:20px 20px 4px;}
.record-circle{width:92px;height:92px;border-radius:50%;background:linear-gradient(135deg,var(--accent-hover),var(--accent));border:4px solid var(--ring);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 6px 18px var(--accent-shadow);flex-shrink:0;}
.record-circle:hover{background:linear-gradient(135deg,var(--accent-bright),var(--accent-hover));}
.record-circle svg{width:32px;height:32px;color:var(--on-accent);}
.record-circle.disabled{background:var(--well);border-color:var(--border);box-shadow:none;cursor:default;}
.record-circle.disabled svg{color:var(--text-3);}
.record-circle.disabled:hover{background:var(--well);}
.record-circle.done{background:var(--ok-bg);border-color:var(--ok-border);box-shadow:none;cursor:default;}
.record-circle.done svg{color:var(--ok-icon);}
.record-circle.done:hover{background:var(--ok-bg);}
.record-circle.recording{animation:recPulse 1s ease-in-out infinite;cursor:default;}
@keyframes recPulse{0%,100%{box-shadow:0 6px 18px rgba(218,20,25,0.35);}50%{box-shadow:0 6px 26px rgba(218,20,25,0.65);}}
@media (prefers-reduced-motion: reduce){.record-circle.recording{animation:none;}}
.record-label{font-family:var(--font-display);font-weight:600;font-size:12px;letter-spacing:0.06em;text-transform:uppercase;color:var(--text-2);}

/* ---------- weekly overview ---------- */
.overview-card{margin:14px 20px 0;background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px 16px 16px;}
.overview-card .eyebrow{display:block;margin-bottom:12px;}
.ov-row{margin-top:12px;}
.ov-row:first-of-type{margin-top:0;}
.ov-top{display:flex;justify-content:space-between;font-size:12px;color:var(--text-2);margin-bottom:6px;}
.ov-top span:last-child{font-family:var(--font-mono);color:var(--text);font-weight:600;}
.bar-track{height:6px;background:var(--well);border-radius:3px;overflow:hidden;}
.bar-fill{height:100%;background:var(--accent);border-radius:3px;}

/* ---------- home / week strip ---------- */
.week-strip{display:flex;gap:5px;padding:16px 20px 0;}
.day-cell{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 2px 9px;background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);cursor:pointer;}
.day-cell .dn{font-family:var(--font-mono);font-size:9px;letter-spacing:0.05em;color:var(--text-3);text-transform:uppercase;}
.day-cell .dd{font-family:var(--font-mono);font-weight:600;font-size:14px;color:var(--text-2);}
.day-cell .dot{width:5px;height:5px;border-radius:50%;background:var(--muted-dot);}
.day-cell.today{border-color:var(--today-ring);background:linear-gradient(0deg,var(--today-ring-tint),var(--today-ring-tint)),var(--card);}
.day-cell.today .dd{color:var(--text);}
.day-cell.today .dot{background:var(--today-ring);}
.day-cell.upcoming .dot{background:var(--warn);}
.day-cell.done .dot{background:var(--ok-icon);}
.day-cell.done .dd{color:var(--text-2);}
.day-cell.missed .dot{width:7px;height:7px;background:var(--alert);box-shadow:0 0 0 3px var(--alert-halo);}
.day-cell.missed .dd{color:var(--alert);}

.view-week-link{padding:10px 20px 0;text-align:right;}

.session-card{margin:18px 20px 0;background:var(--card);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:var(--r-lg);padding:16px;}
.session-desc-tap{cursor:pointer;}
.session-card .top-row{display:flex;justify-content:space-between;align-items:center;}
.session-card .title{font-family:var(--font-display);font-weight:600;font-size:19px;color:var(--text);margin-top:8px;}
.session-tip{margin-top:10px;padding-top:10px;border-top:1px solid var(--divider-soft);}
.session-tip p{font-size:12.5px;line-height:1.5;color:var(--text-2);margin:0;}
.session-card .paired{margin-top:12px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-3);}
.session-card .paired b{color:var(--text-2);font-weight:500;}

/* ---------- week / plan / calendar rows ---------- */
.day-row{margin:0 20px 10px;background:var(--card);border:1px solid var(--border);border-left:4px solid var(--border);border-radius:var(--r-lg);padding:12px 13px;}
.day-row.editable{cursor:pointer;}
.day-row.editable:hover{border-color:var(--hover-border);}
.week-block-label{font-family:var(--font-mono);font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--ok-icon);margin:14px 20px 2px;}
.week-block:first-child .week-block-label{margin-top:0;}
.day-row.today{border-left-color:var(--today-ring);}
.day-row.done{border-left-color:var(--ok-border);}
.day-row .r-top{display:flex;align-items:center;justify-content:space-between;}
.r-top-right{display:flex;align-items:center;gap:8px;}
.drag-handle{display:flex;align-items:center;justify-content:center;color:var(--text-2);flex-shrink:0;cursor:grab;touch-action:none;padding:10px;margin:-10px;}
.drag-handle svg{width:18px;height:18px;display:block;}
.day-row .r-day{font-family:var(--font-display);font-weight:600;font-size:12.5px;letter-spacing:0.04em;text-transform:uppercase;color:var(--text);display:flex;align-items:center;gap:7px;}
.day-row .r-day .num{font-family:var(--font-mono);color:var(--text-3);font-weight:500;}
.stpill{font-family:var(--font-mono);font-size:9px;letter-spacing:0.08em;text-transform:uppercase;padding:2px 8px;border-radius:var(--r-pill);display:flex;align-items:center;gap:4px;}
.stpill.today{color:var(--today-ring-text);background:var(--today-ring-tint);}
.stpill.done{color:var(--ok-icon);background:var(--ok-bg);}
.stpill.upcoming{color:var(--text-3);background:var(--well);}
.stpill.rest{color:var(--text-3);background:var(--well);}
.stpill.missed{color:var(--alert);background:var(--well);}
.stpill svg{width:10px;height:10px;}
.day-row .r-sessions{margin-top:9px;display:flex;flex-direction:column;gap:5px;}
.r-sess-line{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text-2);}
.r-sess-line svg{width:13px;height:13px;color:var(--text-3);flex-shrink:0;}
.r-sess-line b{color:var(--text);font-weight:500;}
.r-exercise-list{list-style:none;margin:2px 0 0 20px;padding:0;display:flex;flex-direction:column;gap:3px;}
.r-exercise-list.card{margin-left:0;margin-top:6px;}
.exercise-log-row{margin:0 0 14px;}
.exercise-log-row .exercise-log-name{display:flex;align-items:center;font-size:13px;color:var(--text);font-weight:500;margin-bottom:6px;}
.exercise-log-row .exercise-log-name span{font-family:var(--font-mono);font-weight:400;color:var(--text-3);font-size:11px;margin-left:6px;}
.set-stepper{display:flex;align-items:center;gap:4px;margin-left:auto;padding-left:6px;}
.set-stepper-btn{width:20px;height:20px;flex-shrink:0;border-radius:50%;border:1px solid var(--border);background:var(--card);color:var(--text-2);font-size:13px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;}
.set-stepper-btn:hover{border-color:var(--hover-border);color:var(--text);}
.exercise-log-row .exercise-log-inputs{display:flex;gap:8px;}
.exercise-log-row .exercise-log-inputs .text-input{flex:1;}
.exercise-log-row.bodyweight .exercise-log-inputs{display:none;}
.set-log-row{display:flex;align-items:center;gap:6px;margin-bottom:6px;}
.set-log-row .set-log-num{width:14px;flex-shrink:0;font-family:var(--font-mono);font-size:11px;color:var(--text-3);text-align:center;}
.set-log-row .text-input{flex:1;min-width:0;}
.set-log-row .set-check-dot{flex-shrink:0;}
.exercise-log-row{padding:8px;border-radius:var(--r-md);border:1px solid transparent;transition:border-color .15s;cursor:pointer;}
.exercise-log-row.current-exercise{border-color:var(--accent);background:var(--well);}
.exercise-log-row.set-complete .exercise-log-name{color:var(--ok-icon);}
.set-check-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
.set-check-dot{width:26px;height:26px;border-radius:50%;border:1px solid var(--border);background:var(--card);color:var(--text-2);font-family:var(--font-mono);font-size:11px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;}
.set-check-dot svg{width:13px;height:13px;}
.set-check-dot.checked{background:var(--ok-icon);border-color:var(--ok-icon);color:#fff;}
.exercise-build-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;font-size:12.5px;border-bottom:1px solid var(--divider-soft);}
.exercise-build-row .eb-name{color:var(--text);}
.exercise-build-row .eb-presc{font-family:var(--font-mono);color:var(--text-2);margin-left:6px;}
.exercise-add-row{display:flex;gap:6px;margin-top:4px;}
.exercise-add-row input{min-width:0;}
.exercise-add-row #newExerciseName{flex:2;}
.exercise-add-row #newExerciseSets,.exercise-add-row #newExerciseReps{flex:1;}
.summary-exercises{margin:0 20px 14px;background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:12px 14px;}
.summary-exercises .se-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;font-size:12.5px;}
.summary-exercises .se-row+.se-row{border-top:1px solid var(--divider-soft);}
.summary-exercises .se-name{color:var(--text);}
.summary-exercises .se-result{font-family:var(--font-mono);color:var(--text-2);flex-shrink:0;}
.r-exercise-list li{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--text-3);}
.r-exercise-list li span{font-family:var(--font-mono);color:var(--text-2);flex-shrink:0;}
.r-inline-btn{margin-top:11px;}
.r-inline-btn svg{width:14px;height:14px;flex-shrink:0;}
.reschedule-actions{margin-top:11px;display:flex;gap:8px;flex-wrap:wrap;}
.reschedule-actions .btn-ghost{width:auto;flex:1 1 auto;height:34px;font-size:10.5px;padding:0 10px;}
.move-target-row{margin-top:10px;padding-top:10px;border-top:1px solid var(--divider-soft);}
.move-target-row .mt-label{font-family:var(--font-mono);font-size:9.5px;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-3);margin-bottom:8px;}
.cal-stat{margin-top:7px;font-family:var(--font-mono);font-size:11px;color:var(--text-3);}

/* ---------- compact plan list row ---------- */
.plan-row{display:flex;align-items:center;gap:10px;margin:0 20px;padding:9px 0;border-bottom:1px solid var(--border);cursor:pointer;}
.week-block:last-of-type .plan-row:last-child{border-bottom:none;}
.prow-date{display:flex;flex-direction:column;align-items:center;width:32px;flex-shrink:0;}
.prow-dow{font-family:var(--font-mono);font-size:9px;letter-spacing:0.05em;color:var(--text-3);text-transform:uppercase;}
.prow-num{font-family:var(--font-mono);font-weight:600;font-size:15px;color:var(--text-2);}
.plan-row.today .prow-num{color:var(--today-ring);}
.plan-row.missed .prow-num{color:var(--alert);}
.prow-body{flex:1;min-width:0;}
.prow-pill{border-left:3px solid var(--accent);padding-left:8px;display:flex;flex-direction:column;min-width:0;}
.prow-pill.rest{border-left-color:var(--border);}
.prow-title{font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.prow-pill.rest .prow-title{color:var(--text-3);font-weight:500;}
.prow-detail{font-family:var(--font-mono);font-size:10.5px;color:var(--text-3);margin-top:1px;}
.prow-right{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.prow-status{font-family:var(--font-mono);font-size:9px;letter-spacing:0.06em;text-transform:uppercase;padding:3px 7px;border-radius:var(--r-pill);display:flex;align-items:center;}
.prow-status.done{color:var(--ok-icon);background:var(--ok-bg);}
.prow-status.done svg{width:11px;height:11px;}
.prow-status.missed{color:var(--alert);background:var(--well);}
.prow-status.today{color:var(--today-ring-text);background:var(--today-ring-tint);}
.prow-log-dot{width:5px;height:5px;border-radius:50%;background:var(--accent);flex-shrink:0;}
#weekList .plan-row{cursor:pointer;}
#weekList .plan-row[data-draggable="1"]{cursor:grab;touch-action:none;}
.plan-row.dragging{position:relative;z-index:50;background:var(--card);border-radius:var(--r-md);box-shadow:0 12px 26px rgba(0,0,0,0.5);opacity:0.94;cursor:grabbing;touch-action:none;pointer-events:none;}
.plan-row.drop-target{background:linear-gradient(0deg,var(--accent-tint),var(--accent-tint)),var(--card);border-radius:var(--r-md);}
.plan-row.shifting{transition:transform .18s ease;}
@media (prefers-reduced-motion: reduce){.plan-row.shifting{transition:none;}}

.cal-switcher{display:flex;align-items:center;justify-content:space-between;padding:14px 20px 0;}
.cal-range{font-family:var(--font-mono);font-size:12px;letter-spacing:0.05em;color:var(--text);text-transform:uppercase;}
.cal-weekday-row{display:grid;grid-template-columns:repeat(7,1fr);padding:16px 14px 6px;}
.cal-weekday-row span{text-align:center;font-family:var(--font-mono);font-size:9.5px;letter-spacing:0.06em;color:var(--text-3);text-transform:uppercase;}
.mo-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;padding:0 14px 14px;}
.mo-cell{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;border-radius:var(--r-md);background:var(--card);border:1px solid var(--border);cursor:pointer;}
.mo-cell:hover{border-color:var(--mo-hover-border);}
.mo-cell.outside{background:none;border:none;cursor:default;}
.mo-cell .mo-num{font-family:var(--font-mono);font-weight:600;font-size:12px;color:var(--text-2);}
.mo-cell .mo-dot{width:5px;height:5px;border-radius:50%;background:var(--muted-dot);}
.mo-cell.today{border-color:var(--today-ring);background:linear-gradient(0deg,var(--today-ring-tint),var(--today-ring-tint)),var(--card);}
.mo-cell.today .mo-num{color:var(--text);}
.mo-cell.today .mo-dot{background:var(--today-ring);}
.mo-cell.upcoming .mo-dot{background:var(--warn);}
.mo-cell.done .mo-dot{background:var(--ok-icon);}
.mo-cell.missed .mo-num{color:var(--alert);}
.mo-cell.missed .mo-dot{width:7px;height:7px;background:var(--alert);box-shadow:0 0 0 3px var(--alert-halo);}
.mo-cell.has-log{box-shadow:inset 0 0 0 1px var(--accent);}
.type-select-row{display:flex;gap:8px;}
.type-btn{flex:1;height:52px;border-radius:var(--r-md);background:var(--well);border:1px solid var(--border);color:var(--text-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;padding:0 4px;font-family:var(--font-body);}
.type-btn svg{width:16px;height:16px;flex-shrink:0;}
.type-btn span{font-size:10.5px;line-height:1.1;text-align:center;}
.type-btn.sel{border-color:var(--accent);background:var(--accent-tint);color:var(--text);}
.manual-entry{display:flex;align-items:center;gap:10px;background:var(--well);border:1px solid var(--border);border-radius:var(--r-md);padding:9px 10px;margin-top:8px;}
.manual-entry.editable{cursor:pointer;}
.manual-entry.editable:hover{border-color:var(--hover-border);}
.manual-entry .ic{width:26px;height:26px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;color:var(--text-2);flex-shrink:0;}
.manual-entry .ic svg{width:14px;height:14px;}
.manual-entry .body{flex:1;min-width:0;}
.manual-entry .body .n{font-size:13px;font-weight:600;color:var(--text);}
.manual-entry .body .v{font-family:var(--font-mono);font-size:10.5px;color:var(--text-3);margin-top:1px;}
.del{background:none;border:none;color:var(--text-3);cursor:pointer;padding:4px;flex-shrink:0;}
.del svg{width:14px;height:14px;display:block;}

/* Tappable icon/label/value rows for structured stat input (e.g. cardio Date/Duration/Distance/Pace) */
.stat-row{display:flex;align-items:center;gap:10px;background:var(--well);border:1px solid var(--border);border-radius:var(--r-md);padding:11px 12px;margin-top:8px;}
.stat-row .sr-ic{width:18px;height:18px;color:var(--text-3);flex-shrink:0;}
.stat-row .sr-ic svg{width:18px;height:18px;display:block;}
.stat-row .sr-label{flex:1;font-size:13.5px;color:var(--text);}
.stat-row input{flex:1;min-width:0;background:none;border:none;color:var(--text);font-size:13.5px;font-family:var(--font-body);text-align:right;outline:none;padding:0;}
.stat-row input::-webkit-calendar-picker-indicator{filter:invert(0.7);margin-left:6px;}
.stat-row .sr-value{flex-shrink:0;font-family:var(--font-mono);font-size:13.5px;color:var(--text);}
.stat-row .sr-chev{width:12px;height:12px;color:var(--text-3);flex-shrink:0;}
.stat-row.readonly .sr-value{color:var(--text-2);}
.del:hover{color:var(--accent-hover);}

/* ---------- sheet ---------- */
.sheet-overlay{position:absolute;inset:0;background:rgba(10,10,11,0.55);display:flex;align-items:flex-end;z-index:80;}
.sheet-overlay[hidden]{display:none;}
.sheet-panel{width:100%;max-height:88%;background:var(--sheet-bg);border:1px solid var(--divider);border-bottom:none;border-radius:28px 28px 0 0;padding:14px 20px calc(18px + env(safe-area-inset-bottom,0px));overflow-y:auto;animation:sheetUp .26s ease both;}
@keyframes sheetUp{from{transform:translateY(24px);opacity:0.4;}to{transform:none;opacity:1;}}
@media (prefers-reduced-motion: reduce){.sheet-panel{animation:none;}}
.sheet-handle{width:36px;height:4px;background:var(--divider-soft);border-radius:2px;margin:0 auto 14px;}

.timer-overlay{position:absolute;inset:0;background:rgba(10,10,11,0.72);display:flex;align-items:center;justify-content:center;z-index:90;padding:20px;}
.timer-overlay[hidden]{display:none;}
.timer-modal{position:relative;width:100%;max-width:320px;background:var(--sheet-bg);border:1px solid var(--divider);border-radius:28px;padding:24px 22px;text-align:center;animation:sheetUp .22s ease both;}
.timer-close{position:absolute;top:12px;right:12px;}
.timer-phase{font-family:var(--font-mono);font-size:13px;letter-spacing:0.14em;text-transform:uppercase;color:var(--text-3);}
.timer-phase.work{color:var(--accent);}
.timer-phase.rest{color:var(--ok-icon);}
.timer-phase.countdown{color:var(--warn);}
.timer-round{font-size:13px;color:var(--text-2);margin-top:4px;}
.timer-display{font-family:var(--font-mono);font-weight:700;font-size:56px;color:var(--text);margin:18px 0;letter-spacing:0.02em;}
.timer-display.urgent{color:var(--accent);}
.timer-config{display:flex;justify-content:space-between;gap:10px;margin-bottom:20px;}
.timer-config-item{flex:1;}
.timer-config-item .st-label{font-family:var(--font-mono);font-size:9px;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-3);margin-bottom:6px;}
.stepper{display:flex;align-items:center;justify-content:space-between;background:var(--well);border:1px solid var(--border);border-radius:var(--r-md);padding:6px 4px;}
.stepper button{width:22px;height:22px;border-radius:50%;background:var(--card-2);border:none;color:var(--text);font-size:14px;line-height:1;cursor:pointer;flex-shrink:0;}
.stepper span{font-family:var(--font-mono);font-size:12.5px;color:var(--text);flex:1;text-align:center;}
.timer-controls{display:flex;gap:10px;}
.timer-controls .btn{flex:1;}
.hold-end-btn{position:relative;overflow:hidden;width:100%;background:none;border:1px solid var(--alert);border-radius:var(--r-pill);padding:12px;font-family:var(--font-body);font-size:13px;font-weight:600;color:var(--alert);cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:none;}
.hold-end-btn[hidden]{display:none;}
.hold-end-fill{position:absolute;left:0;top:0;bottom:0;width:0%;background:var(--alert);opacity:0.22;pointer-events:none;}
.hold-end-label{position:relative;z-index:1;}
.sheet-head{display:flex;align-items:center;justify-content:space-between;}
.sheet-head .label{font-size:14px;}
.sheet-section{margin-top:20px;}
.sheet-section .st-label{font-family:var(--font-mono);font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-3);margin-bottom:10px;}
.tabs-row{display:flex;gap:6px;flex-wrap:wrap;}
.tab-btn{flex:1 1 calc(50% - 6px);min-width:120px;background:var(--well);border:1px solid var(--border);border-radius:var(--r-md);padding:9px 8px;text-align:center;cursor:pointer;}
.tab-btn .t{font-family:var(--font-body);font-weight:600;font-size:12px;color:var(--text-2);}
.tab-btn .s{font-size:10px;color:var(--text-3);margin-top:2px;}
.tab-btn.sel{border-color:var(--accent);background:var(--accent-tint);}
.tab-btn.sel .t{color:var(--text);}

.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--well);border:1px solid var(--divider);border-radius:var(--r-lg);padding:12px 13px;}
.toggle-row .tt{font-size:13px;color:var(--text);font-weight:500;}
.toggle-row .ts{font-size:11px;color:var(--text-3);margin-top:2px;}
.toggle{width:38px;height:20px;background:var(--card);border:1px solid var(--border);border-radius:var(--r-pill);position:relative;cursor:pointer;flex-shrink:0;}
.toggle .knob{position:absolute;top:2px;left:2px;width:14px;height:14px;background:var(--text-3);border-radius:50%;transition:left .15s ease, background .15s ease;}
.toggle.on{background:var(--accent-tint);border-color:var(--accent);}
.toggle.on .knob{left:18px;background:var(--accent);}
@media (prefers-reduced-motion: reduce){.toggle .knob{transition:none;}}

.sheet-apply{margin-top:22px;}

/* ---------- how-it-works link ---------- */
.how-it-works-btn{
  display:flex;align-items:center;justify-content:center;gap:7px;
  width:100%;margin-top:14px;padding:9px;
  background:none;border:1px solid var(--border);border-radius:var(--r-pill);
  color:var(--text-2);font-family:var(--font-body);font-size:12.5px;cursor:pointer;
}
.how-it-works-btn:hover{color:var(--text);border-color:var(--hover-border);}
.how-it-works-ic{width:14px;height:14px;display:flex;color:var(--accent-hover);flex-shrink:0;}
.how-it-works-ic svg{width:14px;height:14px;}

/* ---------- tutorial overlay ---------- */
.tutorial-overlay{position:absolute;inset:0;background:var(--tutorial-bg);z-index:90;display:flex;flex-direction:column;}
.tutorial-overlay[hidden]{display:none;}
.tutorial-top{display:flex;justify-content:flex-end;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 0;}
.tutorial-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 30px;text-align:center;gap:20px;}
.tut-slide[hidden]{display:none;}
.tut-slide{display:flex;flex-direction:column;align-items:center;gap:20px;width:100%;}
.tut-illus{width:100%;min-height:100px;display:flex;align-items:center;justify-content:center;}
.tut-headline{font-family:var(--font-display);font-weight:600;font-size:19px;color:var(--text);}
.tut-body{font-size:13px;line-height:1.55;color:var(--text-2);max-width:270px;}
.tutorial-dots{display:flex;justify-content:center;gap:7px;padding:4px 0 6px;}
.tut-dot{width:6px;height:6px;border-radius:50%;background:var(--well);border:1px solid var(--border);}
.tut-dot.on{background:var(--accent);border-color:var(--accent);}
.tutorial-nav{display:flex;align-items:center;gap:10px;padding:14px 20px calc(18px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--nav-divider);}
.tutorial-nav .btn-text{flex-shrink:0;padding:6px 4px;}
.tutorial-nav .btn-primary{flex:1;}

/* slide 1: focus slider mock */
.tut-slider-track{position:relative;width:220px;height:4px;background:var(--well);border-radius:2px;}
.tut-slider-thumb{position:absolute;top:50%;left:0%;width:20px;height:20px;background:var(--accent);border:3px solid var(--ring);border-radius:50%;transform:translate(-50%,-50%);animation:tutSlide 2.6s ease-in-out infinite;}
@keyframes tutSlide{0%,100%{left:0%;}50%{left:100%;}}

/* slide 2: week picker mock */
.tut-week{display:flex;gap:6px;}
.tut-day{width:26px;height:36px;border-radius:var(--r-sm);background:var(--well);border:1px solid var(--border);animation:tutWave 2.8s ease-in-out infinite;}
.tut-day:nth-child(1){animation-delay:0s;}
.tut-day:nth-child(2){animation-delay:.12s;}
.tut-day:nth-child(3){animation-delay:.24s;}
.tut-day:nth-child(4){animation-delay:.36s;}
.tut-day:nth-child(5){animation-delay:.48s;}
.tut-day:nth-child(6){animation-delay:.6s;}
.tut-day:nth-child(7){animation-delay:.72s;}
@keyframes tutWave{0%,100%{background:var(--well);border-color:var(--border);}20%{background:var(--accent);border-color:var(--accent);}}

/* slide 3: drag-to-reorder mock */
.tut-drag-mock{display:flex;flex-direction:column;gap:6px;width:210px;}
.tut-drag-row{height:30px;display:flex;align-items:center;gap:8px;padding:0 10px;background:var(--well);border:1px solid var(--border);border-radius:var(--r-sm);}
.tut-drag-grip{width:12px;height:12px;color:var(--text-3);display:flex;flex-shrink:0;}
.tut-drag-grip svg{width:12px;height:12px;}
.tut-drag-day{font-family:var(--font-mono);font-size:9.5px;letter-spacing:0.05em;color:var(--text-3);width:26px;flex-shrink:0;}
.tut-drag-line{flex:1;height:6px;border-radius:3px;background:var(--border);}
.tut-drag-line.rest{background:var(--divider);}
.tut-drag-row.dragged{position:relative;z-index:5;border-color:var(--accent);animation:tutDragMove 3.6s ease-in-out infinite;}
.tut-drag-row.dragged .tut-drag-day{color:var(--text);}
.tut-drag-row.dragged .tut-drag-line{background:var(--accent);}
.tut-drag-row.shift{animation:tutDragShiftUp 3.6s ease-in-out infinite;}
@keyframes tutDragMove{
  0%,100%{transform:translateY(0) scale(1);box-shadow:none;}
  8%,92%{transform:translateY(0) scale(1.04);box-shadow:0 6px 14px rgba(0,0,0,0.35);}
  42%,58%{transform:translateY(72px) scale(1.04);box-shadow:0 6px 14px rgba(0,0,0,0.35);}
}
@keyframes tutDragShiftUp{
  0%,8%,92%,100%{transform:translateY(0);}
  42%,58%{transform:translateY(-36px);}
}

/* slide 4: progress mock */
.tut-bars{display:flex;align-items:flex-end;gap:12px;height:80px;}
.tut-bar{width:20px;border-radius:2px 2px 0 0;background:var(--accent);animation:tutGrow 2.4s ease-in-out infinite;}
.tut-bar:nth-child(1){--h:38%;animation-delay:0s;}
.tut-bar:nth-child(2){--h:58%;animation-delay:.15s;}
.tut-bar:nth-child(3){--h:46%;animation-delay:.3s;}
.tut-bar:nth-child(4){--h:88%;animation-delay:.45s;}
@keyframes tutGrow{0%{height:4px;}55%,100%{height:var(--h);}}

/* slide 5: navigation mock */
.tut-nav-full{display:flex;flex-direction:column;align-items:center;gap:16px;}
.tut-nav-mock{display:flex;gap:16px;}
.tut-navitem{display:flex;flex-direction:column;align-items:center;gap:7px;}
.tut-navitem .ic{width:34px;height:34px;border-radius:50%;background:var(--well);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--text-3);animation:tutNavHighlight 3.2s ease-in-out infinite;}
.tut-navitem .ic svg{width:16px;height:16px;}
.tut-navitem .lbl{font-family:var(--font-mono);font-size:8px;letter-spacing:0.05em;text-transform:uppercase;color:var(--text-3);}
.tut-navitem:nth-child(1) .ic{animation-delay:0s;}
.tut-navitem:nth-child(2) .ic{animation-delay:.8s;}
.tut-navitem:nth-child(3) .ic{animation-delay:1.6s;}
.tut-navitem:nth-child(4) .ic{animation-delay:2.4s;}
@keyframes tutNavHighlight{0%,18%,100%{background:var(--well);border-color:var(--border);color:var(--text-3);}5%{background:var(--accent-tint);border-color:var(--accent);color:var(--accent);}}

.tut-pencil-mock{display:flex;flex-direction:column;align-items:center;gap:6px;}
.tut-pencil-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;width:190px;padding:8px 10px;background:var(--well);border:1px solid var(--border);border-radius:var(--r-md);}
.tut-pencil-label{font-family:var(--font-display);font-weight:600;font-size:10px;color:var(--text-2);}
.tut-pencil-btn{width:20px;height:20px;flex-shrink:0;border-radius:50%;background:var(--card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--text-2);animation:tutPencilPulse 2.4s ease-in-out infinite;}
.tut-pencil-btn svg{width:11px;height:11px;}
.tut-pencil-caption{font-family:var(--font-mono);font-size:8.5px;letter-spacing:0.06em;text-transform:uppercase;color:var(--accent-hover);}
@keyframes tutPencilPulse{0%,40%,100%{background:var(--card);border-color:var(--border);color:var(--text-2);box-shadow:none;}70%{background:var(--accent-tint);border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 4px var(--accent-tint);}}

@media (prefers-reduced-motion: reduce){
  .tut-slider-thumb{animation:none;left:50%;}
  .tut-day{animation:none;}
  .tut-day:nth-child(3){background:var(--accent);border-color:var(--accent);}
  .tut-drag-row.dragged{animation:none;transform:translateY(72px);box-shadow:none;}
  .tut-drag-row.shift{animation:none;transform:translateY(-36px);}
  .tut-bar{animation:none;height:var(--h);}
  .tut-navitem .ic{animation:none;}
  .tut-navitem:nth-child(1) .ic{background:var(--accent-tint);border-color:var(--accent);color:var(--accent);}
  .tut-pencil-btn{animation:none;background:var(--accent-tint);border-color:var(--accent);color:var(--accent);}
}

/* ---------- watch-demo entry points ---------- */
.watch-demo-btn{
  display:inline-flex;align-items:center;gap:6px;
  margin-top:10px;padding:7px 10px;
  background:var(--well);border:1px solid var(--border);border-radius:var(--r-pill);
  color:var(--text-2);font-family:var(--font-mono);font-size:10.5px;letter-spacing:0.05em;text-transform:uppercase;
  cursor:pointer;
}
.watch-demo-btn:hover{color:var(--text);border-color:var(--hover-border);}
.watch-demo-btn svg{width:11px;height:11px;color:var(--accent-hover);flex-shrink:0;}

/* ---------- exercise detail / mock demo player ---------- */
.demo-player{
  position:relative;margin-top:6px;
  aspect-ratio:16/10;
  background:#161618;border:1px solid #3A3A3D;border-radius:var(--r-lg);
  overflow:hidden;display:flex;align-items:center;justify-content:center;
}
.demo-loop-badge{
  position:absolute;top:10px;right:10px;
  font-family:var(--font-mono);font-size:9px;letter-spacing:0.08em;
  color:#A8A8AC;background:rgba(0,0,0,0.35);border:1px solid #3A3A3D;
  padding:3px 9px;border-radius:var(--r-pill);text-transform:uppercase;
}
.demo-anim{width:72px;height:72px;color:#A8A8AC;display:flex;align-items:center;justify-content:center;}
.demo-anim svg{width:72px;height:72px;}
.demo-anim-run{animation:demoBob 1s ease-in-out infinite;}
.demo-anim-strength{animation:demoPulse 1.1s ease-in-out infinite;}
.demo-anim-hike{animation:demoBob 1.3s ease-in-out infinite;}
@keyframes demoBob{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}
@keyframes demoPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.12);}}
.demo-player.paused .demo-anim{animation-play-state:paused;}
.demo-player.paused .demo-progress-fill{animation-play-state:paused;}
.demo-play-btn{
  position:absolute;width:52px;height:52px;border-radius:50%;
  background:linear-gradient(135deg,var(--accent-hover),var(--accent));opacity:0.92;border:3px solid var(--ring);
  display:flex;align-items:center;justify-content:center;color:var(--on-accent);cursor:pointer;
}
.demo-play-btn svg{width:18px;height:18px;}
.demo-progress{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,0.14);}
.demo-progress-fill{height:100%;width:0%;background:var(--accent);animation:demoProgress 4s linear infinite;}
@keyframes demoProgress{0%{width:0%;}100%{width:100%;}}
.demo-mute-btn{
  position:absolute;bottom:10px;right:10px;width:26px;height:26px;border-radius:50%;
  background:rgba(0,0,0,0.35);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;color:var(--text-2);cursor:pointer;
}
.demo-mute-btn svg{width:13px;height:13px;}
.demo-mute-btn.muted{color:var(--accent-hover);}

.demo-session-title{font-family:var(--font-display);font-weight:600;font-size:19px;color:var(--text);margin-top:18px;}
.demo-session-detail{font-family:var(--font-mono);font-size:12px;color:var(--text-3);margin-top:3px;}
.demo-focus-label{font-family:var(--font-mono);font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-3);margin-top:22px;}
.demo-focus-list{margin:10px 0 0;padding-left:18px;}
.demo-focus-list li{font-size:13px;color:var(--text-2);line-height:1.7;}

@media (prefers-reduced-motion: reduce){
  .demo-anim{animation:none!important;}
  .demo-progress-fill{animation:none!important;width:55%;}
}

/* ---------- toast ---------- */
.toast{position:absolute;left:16px;right:16px;bottom:78px;background:var(--toast-bg);border:1px solid var(--divider);border-left:4px solid var(--ok-border);border-radius:var(--r-md);padding:11px 12px;font-size:12.5px;color:var(--toast-text);display:flex;align-items:center;gap:8px;z-index:100;animation:toastIn .2s ease both;}
.toast[hidden]{display:none;}
.toast svg{width:14px;height:14px;color:var(--ok-icon);flex-shrink:0;}
@keyframes toastIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

/* ---------- summary ---------- */
.summary-hero{padding:38px 20px 6px;text-align:center;}
.summary-hero .ring{width:56px;height:56px;margin:0 auto;border-radius:50%;background:var(--ok-bg);border:2px solid var(--ok-border);display:flex;align-items:center;justify-content:center;}
.summary-hero .ring svg{width:26px;height:26px;color:var(--ok-icon);}
.summary-hero h2.hl{text-align:center;margin-top:16px;}
.summary-hero .sess{font-family:var(--font-body);font-size:13px;color:var(--text-2);margin-top:4px;}

.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:22px 20px 0;}
.stats-grid .cell{background:var(--well);border:1px solid var(--divider);border-radius:var(--r-lg);padding:13px 12px;}
.stats-grid .cell .l{font-family:var(--font-mono);font-size:9.5px;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-3);}
.stats-grid .cell .v{font-family:var(--font-mono);font-weight:600;font-size:19px;color:var(--text);margin-top:5px;}

.summary-note{margin:20px 20px 0;background:var(--card);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:var(--r-lg);padding:13px 14px;}
.summary-note p{font-size:13px;line-height:1.5;color:var(--text-2);margin:0;}

.streak-band{margin:18px 20px 0;background:var(--ok-bg);border:1px solid var(--ok-border);border-radius:var(--r-lg);padding:12px 14px;display:flex;align-items:center;gap:10px;}
.streak-band svg{width:20px;height:20px;color:var(--ok-icon);flex-shrink:0;}
.streak-band .v{font-family:var(--font-display);font-weight:600;font-size:15px;color:var(--text);}
.streak-band .l{font-size:11px;color:var(--text-2);margin-top:1px;}

/* ---------- welcome ---------- */
.welcome-bullets{display:flex;flex-direction:column;gap:8px;margin-top:20px;}
.bullet{display:flex;gap:10px;align-items:flex-start;background:var(--well);border:1px solid var(--divider);border-left:4px solid var(--border);border-radius:var(--r-lg);padding:11px 12px;}
.bullet .ic{width:22px;height:22px;flex-shrink:0;color:var(--accent-hover);}
.bullet .ic svg{width:16px;height:16px;}
.bullet p{font-size:12.5px;line-height:1.45;color:var(--text-2);margin:0;}
.trial-box{margin-top:18px;background:var(--accent-tint);border:1px solid var(--accent);border-left:4px solid var(--accent);border-radius:var(--r-lg);padding:13px 14px;}
.trial-box .t{font-family:var(--font-display);font-weight:600;font-size:13.5px;letter-spacing:0.02em;color:var(--text);}
.trial-box .s{font-size:11.5px;color:var(--text-2);margin-top:3px;}

/* ---------- progress tab ---------- */
.barchart{display:flex;align-items:flex-end;gap:10px;height:100px;margin-top:12px;padding:0 2px;border-bottom:1px solid var(--divider);}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;cursor:pointer;}
.bar-col .col-bar{width:100%;background:var(--well);border:1px solid var(--divider);border-radius:var(--r-sm) var(--r-sm) 0 0;min-height:4px;}
.bar-col.selected .col-bar{background:var(--accent);border-color:var(--accent);}
.bar-col .col-label{font-family:var(--font-mono);font-size:8.5px;letter-spacing:0.03em;color:var(--text-3);text-transform:uppercase;text-align:center;}
.bar-col.current .col-label{color:var(--text);font-weight:600;}
.week-detail-card{margin-top:16px;background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:13px 14px;}
.week-detail-card .wd-range{font-family:var(--font-mono);font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-3);}
.week-detail-card .wd-stats{display:flex;gap:24px;margin-top:9px;}
.week-detail-card .wd-stat .l{font-family:var(--font-mono);font-size:9.5px;letter-spacing:0.06em;text-transform:uppercase;color:var(--text-3);}
.week-detail-card .wd-stat .v{font-family:var(--font-mono);font-weight:600;font-size:18px;color:var(--text);margin-top:3px;}

/* ---------- settings tab ---------- */
.profile-card{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px;}
.profile-avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--accent-hover),var(--accent));display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:17px;color:var(--on-accent);flex-shrink:0;}
.profile-card-info{flex:1;min-width:0;}
.profile-name{font-family:var(--font-body);font-weight:600;font-size:14px;color:var(--text);}
.profile-email{font-size:12px;color:var(--text-3);margin-top:2px;}

/* ---------- bottom nav ---------- */
.bottom-nav{position:absolute;left:0;right:0;bottom:0;display:flex;background:var(--screen-bg);border-top:1px solid var(--nav-divider);padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px));z-index:60;}
.bottom-nav[hidden]{display:none;}
.nav-tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:none;cursor:pointer;padding:4px 2px;color:var(--text-3);}
.nav-tab .nav-ic{width:20px;height:20px;display:flex;}
.nav-tab .nav-ic svg{width:20px;height:20px;}
.nav-tab span:last-child{font-family:var(--font-mono);font-size:9px;letter-spacing:0.04em;text-transform:uppercase;}
.nav-tab.active{color:var(--accent);}
.nav-tab:hover{color:var(--text-2);}
.nav-tab.active:hover{color:var(--accent);}
</style>

// Real "today" -- tests pin this via window.__ALTIRO_TEST_TODAY__ (set before the app script
// runs) so the suite stays deterministic; production always falls through to the real clock.
function getRealToday(){
  const override = (typeof window!=='undefined') && window.__ALTIRO_TEST_TODAY__;
  const d = override ? new Date(override) : new Date();
  d.setHours(0,0,0,0);
  return d;
}
const REAL_TODAY = getRealToday();
const TODAY_IDX = (REAL_TODAY.getDay()+6)%7; // JS getDay() is Sun=0..Sat=6; convert to Mon=0..Sun=6
const WEEK_MONDAY = new Date(REAL_TODAY);
WEEK_MONDAY.setDate(REAL_TODAY.getDate() - TODAY_IDX);
function weekDates(offset){
  const days=[];
  for(let i=0;i<7;i++){ const d=new Date(WEEK_MONDAY); d.setDate(d.getDate()+offset*7+i); days.push(d); }
  return days;
}
const DAY_DATES = weekDates(0).map(d=>d.getDate());
const TODAY_DATE = weekDates(0)[TODAY_IDX];

// A stable "which week is this" number for a date -- the same for every day within one Mon-Sun
// week, and one higher for the next week, so exercise selection rotates week to week but stays
// put for the whole week rather than changing on every render/every day.
const ROTATION_EPOCH_MONDAY = new Date(2020,0,6); // an arbitrary real Monday, used only as an anchor
function weekSeedForDate(date){
  const days = Math.floor((date.getTime() - ROTATION_EPOCH_MONDAY.getTime()) / 86400000);
  return Math.floor(days / 7);
}
// Returns this session's exercise breakdown, or null when it's not a strength session with any
// exercises -- either a manually-built list (session.exercises, already has a plain .name since the
// user typed it directly, no locale split needed) or, failing that, a known generated template,
// rotated to that particular week's picks (date defaults to today, for callers -- Home, Log
// Performance -- that only ever mean "today").
function exercisesForSession(session, date){
  if(!session || session.t!=='strength') return null;
  if(session.exercises && session.exercises.length) return session.exercises;
  const slots = STRENGTH_TEMPLATES[session.en.title];
  if(!slots) return null;
  const seed = weekSeedForDate(date || TODAY_DATE);
  return slots.map((options, i)=>{
    const ex = options[(seed + i) % options.length];
    return {...ex, name: state.lang==='es' ? ex.es : ex.en};
  });
}

}

function buildWeek(focusIdx){
  const pool = WEEK_TABLES[focusIdx].filter(d => d.p.t !== 'rest');
  let slot = 0;
  const week = [];
  for(let i=0;i<7;i++){
    // Days before today have no real record -- fabricating what the rotation "would have
    // suggested" would just be invented history, so the calendar starts truly blank there instead
    // of showing a workout the user never actually saw. This reruns on every sign-in, so it applies
    // consistently, not just at first signup. Any real logged data for these dates (a manual entry,
    // a custom plan) is layered on separately by loadWorkoutDataFromCloud()/getDayData(), same as
    // any other day.
    if(i < TODAY_IDX){
      week.push({p:ses('rest','Rest Day','','Día de descanso',''), c:null, completed:true});
    } else if(state.trainingDays.includes(i)){
      const src = pool[slot % pool.length];
      // Today/future training days default to NOT completed -- there's no real record for them yet,
      // and claiming they're done would fabricate history. loadWorkoutDataFromCloud() overlays the
      // real completed_override wherever one actually exists once cloud data loads.
      week.push({p:{...src.p}, c:{...src.c}, completed: false});
      slot++;
    } else {
      week.push({p:ses('rest','Rest Day','','Día de descanso',''), c:null, completed:true});
    }
  }
  return week;
}
// Switching focus and/or training days mid-week (via the Adjust Plan sheet) must not rewrite
// history: days already completed or missed keep their real content and status untouched. Only
// days not yet locked in -- today, unless today is already done, in which case tomorrow -- pick
// up the new focus/training-day pattern, with its own rotation starting fresh from that point.
// A day the user explicitly planned themselves (isCustom) is ALSO left untouched -- it's their
// content now, not the auto-generator's, so a focus/intensity change shouldn't silently erase it.
function regenerateUpcomingWeek(focusIdx, newTrainingDays){
  const pool = WEEK_TABLES[focusIdx].filter(d => d.p.t !== 'rest');
  const fromIdx = isTodayDone() ? TODAY_IDX+1 : TODAY_IDX;
  const week = state.week.map(d => ({...d}));
  let slot = 0;
  for(let i=fromIdx;i<7;i++){
    if(week[i].isCustom) continue;
    if(newTrainingDays.includes(i)){
      const src = pool[slot % pool.length];
      week[i] = {p:{...src.p}, c:{...src.c}, completed:false};
      slot++;
    } else {
      week[i] = {p:ses('rest','Rest Day','','Día de descanso',''), c:null, completed:true};
    }
  }
  return week;
}

function todaySession(){

function isTodayDone(){

  let done = state.todayCompleted || (log && log.manualEntries.length>0) || (log && log.extraWorkouts && log.extraWorkouts.some(w=>w.completed));
  if(log && typeof log.completedOverride === 'boolean') done = log.completedOverride;
  return !!done;
}
// Which of today's active workouts the record flow (Log Performance / Interval Timer) is currently
// targeting -- null means the day's primary session, an id targets a specific extra workout, so

function activeSession(){

function computeDoneCount(){

  // rather than state.week[i].completed directly -- a day whose completedOverride was set while it
  // was still "today" (via ensureDayLog(...).completedOverride, not state.week[idx].completed) must
  // still count as done here once it's no longer "today", or the ring undercounts real completions.
  return weekDates(0).filter(date=>{

}
function dayStatus(i){

  // (Calendar, Progress, Plan, Day Detail) already uses -- instead of reading state.week[i].completed
  // directly, which misses a completedOverride set while this day was still "today" (see
  // computeDoneCount() above for the same fix and why it matters).
  return dayDataStatus(getDayData(weekDates(0)[i]));
}

/* ---------------- calendar day lookups (any date, past or future) ---------------- */
function sessionForDate(date){
  if(date.getTime() < TODAY_DATE.getTime()){
    // No real record for a past date with no explicit log -- see buildWeek() for the same rule
    // applied to the current week.
    return {p: ses('rest','Rest Day','','Día de descanso',''), c: null};
  }
  const dow = (date.getDay()+6)%7;
  if(!state.trainingDays.includes(dow)){
    return {p: ses('rest','Rest Day','','Día de descanso',''), c: null};
  }
  const slot = state.trainingDays.indexOf(dow);
  const pool = WEEK_TABLES[state.focusRatio].filter(d => d.p.t !== 'rest');
  const src = pool[slot % pool.length];
  return {p:{...src.p}, c:{...src.c}};
}
function getDayData(date){
  ensureWeek();
  const key = dateKey(date);
  const wd = weekDates(0);
  const idxInCurrentWeek = wd.findIndex(d => dateKey(d)===key);
  let p, c, planCompleted, isCustom=false;
  if(idxInCurrentWeek>=0){
    const d = state.week[idxInCurrentWeek];
    p = (idxInCurrentWeek===TODAY_IDX) ? todaySession() : d.p;
    c = d.c;
    planCompleted = (idxInCurrentWeek===TODAY_IDX) ? state.todayCompleted : d.completed;
    isCustom = !!d.isCustom;
  } else {
    const overrideLog = state.dayLog[key];
    const gen = (overrideLog && overrideLog.session)
      ? {p:{...overrideLog.session.p}, c: overrideLog.session.c ? {...overrideLog.session.c} : null}
      : sessionForDate(date);
    p = gen.p; c = gen.c;
    planCompleted = p.t==='rest' ? true : date.getTime() < TODAY_DATE.getTime();
    isCustom = !!(overrideLog && overrideLog.session && overrideLog.session.isCustom);
  }
  const log = state.dayLog[key];
  const manualEntries = (log && log.manualEntries) ? log.manualEntries : [];
  const extraWorkouts = (log && log.extraWorkouts) ? log.extraWorkouts : [];
  let completed = planCompleted || manualEntries.length>0 || extraWorkouts.some(w=>w.completed);
  if(log && typeof log.completedOverride === 'boolean') completed = log.completedOverride;
  // The distance actually run, as reported in Log Performance -- null until a run is actually
  // logged for this day, in which case it should be used instead of the plan's prescribed
  // distance (see weekStats()) since what actually happened rarely matches the plan exactly.
  const actualRunDistance = (log && log.actualRunDistance!=null) ? log.actualRunDistance : null;
  return {
    key, date, p, c, completed, manualEntries, isCustom, extraWorkouts, actualRunDistance,
    isToday: key===dateKey(TODAY_DATE),
    isPast: date.getTime() < TODAY_DATE.getTime(),
    isFuture: date.getTime() > TODAY_DATE.getTime(),
  };
}
function dayDataStatus(dd){
  if(dd.p.t==='rest'){
    // A GENUINE rest day (not a training day under the current plan) never shows the green "done"
    // status, even if something extra was logged on it -- only a real workout turns green when
    // completed. A day that WAS a training day but has since fallen into the past has its content
    // blanked to "Rest Day" by buildWeek() (no fabricated history for days before today) -- for
    // that specific case a real logged entry is the only surviving record of what actually
    // happened, so it still counts as done (this is what past-day completion tests rely on).
    const dow = (dd.date.getDay()+6)%7;
    if(state.trainingDays.includes(dow) && dd.manualEntries.length>0) return 'done';
    return 'rest';
  }
  if(dd.isToday) return dd.completed ? 'done' : 'today';
  if(dd.completed) return 'done';
  return dd.isFuture ? 'upcoming' : 'missed';
}

function statusClassFor(status, isToday){

  if(!state.dayLog[key].extraWorkouts) state.dayLog[key].extraWorkouts = []; // back-compat for logs created before this existed

function planCustomWorkout(key, opts){

  if(opts.interval) session.interval = opts.interval; // {rounds, workSec, restSec} -- read by the interval timer
  if(opts.exercises && opts.exercises.length) session.exercises = opts.exercises; // user-built sets/reps list
  // The first custom workout for a day still takes the primary slot (unchanged behavior), and
  // explicitly revising that existing primary (tapping its bubble to edit) keeps updating it in
  // place. Otherwise, once a day already has a custom primary workout, a newly-added one goes into
  // extraWorkouts instead of replacing it, so adding a second workout to a day never deletes the first.
  const existing = getRawDaySlot(parseDateKey(key));
  if(existing.isCustom && !opts.replacePrimary){

    const target = {};
    if(opts.type==='strength'){ target.weight = opts.target.weight; target.reps = opts.target.reps; }
    if(opts.type==='run'){ target.pace = opts.target.pace; }

function reorderWithinWeek(weekIdx, sourceIdx, targetIdx){
  if(sourceIdx === targetIdx) return;
  const dates = weekDates(weekIdx);
  const step = sourceIdx < targetIdx ? 1 : -1;
  const movingSlot = getRawDaySlot(dates[sourceIdx]);
  for(let i=sourceIdx; i!==targetIdx; i+=step){
    writeDaySlot(dates[i], getRawDaySlot(dates[i+step]));
  }
  writeDaySlot(dates[targetIdx], movingSlot);

function shiftWeekFromMissed(missedIdx){
  const range = [];

  const movable = range.filter(i => !(state.week[i].p.t!=='rest' && state.week[i].completed));
  const missedContent = {p: state.week[missedIdx].p, c: state.week[missedIdx].c};
  const contents = [missedContent, ...movable.map(i => ({p: state.week[i].p, c: state.week[i].c}))];

  state.week[missedIdx].p = ses('rest','Rest Day','','Día de descanso','');
  state.week[missedIdx].c = null;

/* ---------------- sliders ---------------- */
function makeSlider(trackEl, thumbEl, fillEl, getVal, setVal, onChange){
  function paint(){
    const v = getVal();
    const pct = (v/4)*100;
    fillEl.style.width = pct+'%';
    thumbEl.style.left = pct+'%';
    thumbEl.setAttribute('aria-valuenow', v);
  }
  function posToVal(clientX){
    const r = trackEl.getBoundingClientRect();
    let pct = (clientX - r.left)/r.width;
    pct = Math.max(0, Math.min(1, pct));
    return Math.round(pct*4);
  }
  function commit(clientX){
    const v = posToVal(clientX);
    if(v!==getVal()){ setVal(v); onChange(v); }
    paint();
  }
  const hitEl = trackEl.parentElement;
  hitEl.addEventListener('pointerdown', (e)=>{
    e.preventDefault();
    commit(e.clientX);
    try{ hitEl.setPointerCapture(e.pointerId); }catch(err){}
    const move = (ev)=>commit(ev.clientX);
    const up = ()=>{
      hitEl.removeEventListener('pointermove',move);
      hitEl.removeEventListener('pointerup',up);
      hitEl.removeEventListener('pointercancel',up);
    };
    hitEl.addEventListener('pointermove',move);
    hitEl.addEventListener('pointerup',up);
    hitEl.addEventListener('pointercancel',up);
  });
  thumbEl.addEventListener('keydown', (e)=>{
    let v = getVal();
    if(e.key==='ArrowLeft'||e.key==='ArrowDown'){ v=Math.max(0,v-1); setVal(v); onChange(v); paint(); }
    if(e.key==='ArrowRight'||e.key==='ArrowUp'){ v=Math.min(4,v+1); setVal(v); onChange(v); paint(); }
  });
  paint();
  return {paint};
}

/* ---------------- loading screen ---------------- */
function runLoading(){
  const items = document.querySelectorAll('#checklist .check-item');
  items.forEach(it=>{ it.className='check-item'; it.querySelector('.st').innerHTML=''; });
  let step=0;
  function tick(){
    if(step>0){
      const prev = items[step-1];
      prev.className='check-item done';
      prev.querySelector('.st').innerHTML = `<span style="color:var(--ok-icon)">${ICONS.checkSm}</span>`;
    }
    if(step<items.length){
      items[step].className='check-item active';
      items[step].querySelector('.st').innerHTML = `<span class="spin">${ICONS.spinner}</span>`;
      step++;
      state.loadTimer = setTimeout(tick, 850);
    } else {
      ensureWeek();
      state.week = buildWeek(state.focusRatio);
      if(state.signedIn && state.userId) saveProfileToCloud();
      state.loadTimer = setTimeout(()=>showScreen('home'), 550);
    }
  }
  tick();
}
