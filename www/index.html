async function loadWorkoutDataFromCloud(){
  if(!state.userId) return;
  try{
    // Select every workout_logs column individually, one call per newer column, falling back to
    // dropping just that column on error rather than losing the whole week's plan -- a schema
    // migration (e.g. adding actual_run_distance) can ship in code before it's been applied to a
    // given Supabase project's live database, and the client doesn't throw on a bad column name,
    // it just returns no rows, which previously wiped out every planned workout from view.
    let logsRes = await sb.from('workout_logs')
      .select('log_date, completed_override, planned_type, planned_title, planned_detail, planned_interval_rounds, planned_interval_work_sec, planned_interval_rest_sec, actual_run_distance, manual_entries(id, name, type, volume, notes, distance, duration_min)')
      .eq('user_id', state.userId);
    if(logsRes.error){
      logsRes = await sb.from('workout_logs')
        .select('log_date, completed_override, planned_type, planned_title, planned_detail, planned_interval_rounds, planned_interval_work_sec, planned_interval_rest_sec, manual_entries(id, name, type, volume, notes)')
        .eq('user_id', state.userId);
    }
    const logs = logsRes.data;
    if(logs){
      logs.forEach(row=>{
        const key = row.log_date; // Postgres `date` serializes as 'YYYY-MM-DD', same shape as dateKey()
        const customSession = row.planned_type
          ? ses(row.planned_type, row.planned_title, row.planned_detail||'', row.planned_title, row.planned_detail||'')
          : null;
        if(customSession && row.planned_type==='interval' && row.planned_interval_rounds!=null){
          customSession.interval = {rounds: row.planned_interval_rounds, workSec: row.planned_interval_work_sec, restSec: row.planned_interval_rest_sec};
        }
        state.dayLog[key] = {
          completedOverride: row.completed_override,
          manualEntries: (row.manual_entries||[]).map(e=>(
            { id:'m'+e.id, supabaseId:e.id, name:e.name, type:e.type, volume:e.volume||'', notes:e.notes||'', distance: e.distance ?? null, durationMin: e.duration_min ?? null }
          )),
          session: customSession ? {p: customSession, c: null, isCustom: true} : null,
          actualRunDistance: row.actual_run_distance ?? null,
        };
        // The current week's non-today slots track completion (and, for a custom plan, the session
        // itself) on state.week[i] directly rather than through dayLog -- mirror both there too so
        // the Home week-strip (which reads state.week directly) agrees with Day Detail / Calendar
        // (which read dayLog).
        const idx = currentWeekIdxFor(key);
        if(idx>=0){
          if(idx!==TODAY_IDX && typeof row.completed_override==='boolean'){
            state.week[idx].completed = row.completed_override;
          } else if(idx!==TODAY_IDX && customSession){
            // A freshly-loaded custom plan with no completion record yet defaults to not-done,
            // matching buildWeek()'s own default for a future/today training day -- but only when
            // there's no completed_override to respect. This used to run unconditionally AFTER the
            // override mirror above, silently clobbering a real completion back to false for any
            // custom day that was actually completed while it was still "today" -- the Home week
            // strip (which reads state.week directly) would show it as missed even though Calendar/
            // Progress/Day Detail (which read completedOverride straight off dayLog) had it right.
            state.week[idx].completed = false;
          }
          if(customSession){
            state.week[idx].p = customSession;
            state.week[idx].c = null;
            state.week[idx].isCustom = true;
          }
        }
      });
    }
    // Same defensive fallback as the workout_logs select above -- actual_distance can ship in code
    // before its migration is applied to a given project's live database.
    let extrasRes = await sb.from('planned_workouts')
      .select('id, log_date, session_type, title, detail, exercises, interval_rounds, interval_work_sec, interval_rest_sec, completed, actual_distance')
      .eq('user_id', state.userId);
    if(extrasRes.error){
      extrasRes = await sb.from('planned_workouts')
        .select('id, log_date, session_type, title, detail, exercises, interval_rounds, interval_work_sec, interval_rest_sec, completed')
        .eq('user_id', state.userId);
    }
    const extras = extrasRes.data;
    if(extras){
      extras.forEach(row=>{
        const key = row.log_date;
        const session = ses(row.session_type, row.title, row.detail||'', row.title, row.detail||'');
        if(row.exercises) session.exercises = row.exercises;
        if(row.session_type==='interval' && row.interval_rounds!=null){
          session.interval = {rounds: row.interval_rounds, workSec: row.interval_work_sec, restSec: row.interval_rest_sec};
        }
        const log = ensureDayLog(key);
        log.extraWorkouts.push({ id:'w'+row.id, supabaseId: row.id, session, completed: !!row.completed, notes:'', actualDistance: row.actual_distance ?? null });
      });
    }
    const { data: targets } = await sb.from('progression_targets').select('*').eq('user_id', state.userId);
    if(targets){
      const prog = {};
      targets.forEach(t=>{
        const entry = {};
        if(t.weight!=null) entry.weight = t.weight;
        if(t.reps!=null) entry.reps = t.reps;
        if(t.pace_min!=null) entry.pace = t.pace_min;
        prog[t.session_key] = entry;
      });
      state.progression = prog;
    }
    state.doneCount = computeDoneCount();
  }catch(e){ /* local state remains authoritative if this fails */ }
}

document.getElementById('googleSignInBtn').addEventListener('click', async function(){
  const btn = this;
  if(btn.disabled) return;
  const labelEl = btn.querySelector('.glabel');
  const L = STR[state.lang];
  btn.disabled = true;
  labelEl.textContent = L.signingInMsg;
  document.getElementById('authError').textContent = '';
  const { error } = await sb.auth.signInWithOAuth({ provider: 'google' });
  if(error){
    // Expected until Google OAuth is configured in the Supabase dashboard
    // (Authentication -> Providers -> Google). Surface it rather than fake success.
    document.getElementById('authError').textContent = error.message;
    btn.disabled = false;
    labelEl.textContent = L.googleSignInBtn;
  }
  // On success Supabase redirects the page to Google and back; onAuthStateChange below
  // picks up the resulting session, so there's nothing further to do here.
});

function updateEmailSignupBtn(){
  const email = document.getElementById('emailInput').value.trim();
  const pw = document.getElementById('passwordInput').value;
  document.getElementById('emailSignupBtn').disabled = !(email.includes('@') && email.length>4 && pw.length>=4);
}
document.getElementById('emailInput').addEventListener('input', updateEmailSignupBtn);
document.getElementById('passwordInput').addEventListener('input', updateEmailSignupBtn);
document.getElementById('emailSignupBtn').addEventListener('click', async function(){
  const btn = this;
  if(btn.disabled) return;
  const L = STR[state.lang];
  const email = document.getElementById('emailInput').value.trim();
  const password = document.getElementById('passwordInput').value;
  const errEl = document.getElementById('authError');
  errEl.style.color = 'var(--accent)';
  errEl.textContent = '';
  btn.disabled = true;
  btn.textContent = authMode==='signup' ? L.creatingAccountMsg : L.signingInMsg;
  try{
    if(authMode==='signup'){
      const { data, error } = await sb.auth.signUp({ email, password });
      if(error) throw error;
      if(!data.session){
        // Email confirmation is required by this Supabase project's Auth settings --
        // there's no session yet, so don't pretend the user is signed in.
        errEl.style.color = 'var(--ok-icon)';
        errEl.textContent = L.confirmEmailMsg;
        authMode = 'signin';
        return;
      }
      state.signedIn = true;
      state.userEmail = email;
      state.userName = email.split('@')[0];
      state.userId = data.user.id;
      showScreen('loading');
    } else {
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if(error) throw error;
      state.signedIn = true;
      state.userEmail = email;
      state.userName = email.split('@')[0];
      state.userId = data.user.id;
      await loadProfileFromCloud(); // overwrites userName if a real full_name is on file
      await loadWorkoutDataFromCloud();
      await loadPRsFromCloud();
      // Go straight to Home, not the "Building your plan" loading screen -- that screen's
      // animation ends by regenerating state.week from scratch, which would silently wipe out
      // the real planned/logged workouts just merged in above (a returning user's plan already
      // exists, there's nothing to "build"). The signup branch above still uses it, since a
      // brand-new account genuinely has no plan yet.
      showScreen('home');
    }
  }catch(err){
    errEl.style.color = 'var(--accent)';
    errEl.textContent = err.message || 'Something went wrong.';
  }finally{
    btn.disabled = false;
    updateAuthModeUI();
  }
});

sb.auth.onAuthStateChange((event, session)=>{
  if(event==='SIGNED_IN' && session && !state.signedIn){
    state.signedIn = true;
    state.userEmail = session.user.email;
    state.userName = session.user.email.split('@')[0];
    state.userId = session.user.id;
    loadProfileFromCloud().then(loadWorkoutDataFromCloud).then(loadPRsFromCloud).then(()=> showScreen('home'));
  }
  if(event==='SIGNED_OUT'){
    state.signedIn = false;
    state.userId = null;
  }
});

/* ---------------- how-it-works tutorial ---------------- */
const TUTORIAL_SLIDE_COUNT = 5;
let tutorialSlide = 0;
let tutorialOrigin = 'welcome';
function renderTutorialSlide(){
  document.querySelectorAll('.tut-slide').forEach(s=>{
    s.hidden = parseInt(s.getAttribute('data-slide'),10) !== tutorialSlide;
  });
  const dotsEl = document.getElementById('tutorialDots');
  dotsEl.innerHTML = Array.from({length:TUTORIAL_SLIDE_COUNT}).map((_,i)=>`<span class="tut-dot ${i===tutorialSlide?'on':''}"></span>`).join('');
  document.getElementById('tutorialBack').style.visibility = tutorialSlide===0 ? 'hidden' : 'visible';
  const L = STR[state.lang];
  document.getElementById('tutorialNext').textContent = tutorialSlide === TUTORIAL_SLIDE_COUNT-1
    ? (tutorialOrigin==='settings' ? L.tutDone : L.tutGetStarted)
    : L.tutNext;
}
function openTutorial(origin){
  tutorialOrigin = origin || 'welcome';
  tutorialSlide = 0;
  renderTutorialSlide();
  document.getElementById('tutorialOverlay').hidden = false;
}
function closeTutorial(){
  document.getElementById('tutorialOverlay').hidden = true;
}
document.getElementById('openTutorialBtn').addEventListener('click', ()=> openTutorial('welcome'));
document.getElementById('settingsTutorialBtn').addEventListener('click', ()=> openTutorial('settings'));
document.getElementById('tutorialSkip').addEventListener('click', closeTutorial);
document.getElementById('tutorialBack').addEventListener('click', ()=>{
  if(tutorialSlide>0){ tutorialSlide--; renderTutorialSlide(); }
});
document.getElementById('tutorialNext').addEventListener('click', ()=>{
  if(tutorialSlide < TUTORIAL_SLIDE_COUNT-1){ tutorialSlide++; renderTutorialSlide(); }
  else {
    closeTutorial();
    if(tutorialOrigin==='welcome') showScreen('onb-goal');
  }
});

  // resolves -- a returning signed-in user briefly sees Welcome, then jumps to Home.
  try{
    await supabaseReady; // don't ask the offline stub whether a real session exists

      state.signedIn = true;
      state.userEmail = session.user.email;
