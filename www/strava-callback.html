<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connecting Strava…</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0E0E10;color:#B9B9C0;font:14px/1.4 system-ui,-apple-system,sans-serif;}
  @media (prefers-color-scheme: light){ body{background:#F6F6F4;color:#55555C;} }
</style>
</head>
<body>
<p>Connecting Strava…</p>
<script>
// Strava sends the browser here after "Authorize" (or "Cancel") with ?code=...&scope=... (or
// ?error=...). The app itself finishes the connection -- see finishStravaConnect() in index.html.
// It's handed over through localStorage rather than left in the app's own URL, where Supabase's
// sign-in handling would try to read ?code/?error as a sign-in of its own.
try{ localStorage.setItem('altiro_strava_callback', JSON.stringify({search: location.search, at: Date.now()})); }catch(e){}
location.replace('./');
</script>
</body>
</html>
