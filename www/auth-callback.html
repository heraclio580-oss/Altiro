<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signing in…</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0E0E10;color:#B9B9C0;font:14px/1.4 system-ui,-apple-system,sans-serif;}
  @media (prefers-color-scheme: light){ body{background:#F6F6F4;color:#55555C;} }
  [hidden]{display:none !important;}
</style>
</head>
<body>
<div style="text-align:center;"><p>Signing in…</p><a id="back" hidden style="display:inline-block;margin-top:10px;padding:12px 22px;border-radius:999px;background:#DA1419;color:#fff;font-weight:600;text-decoration:none;"></a></div>
<script>
// Google or Apple sends the phone's browser here after signing in from the store app (the app asks for
// this page as the place to come back to; see oauthSignIn in index.html), with ?code=... -- a one-time code
// only the app can use. It goes back into the app through an altiro:// link (finishOAuthReturn), with a
// button in case the phone asks first or the automatic jump is blocked. Nothing is kept here: this page
// doesn't sign the browser in.
var back = 'altiro://auth-callback' + location.search + location.hash;
var es = /^es/i.test(navigator.language || '');
document.querySelector('p').textContent = es ? 'Volviendo a Altiro…' : 'Returning to Altiro…';
var a = document.getElementById('back');
a.href = back; a.textContent = es ? 'Abrir Altiro' : 'Open Altiro'; a.hidden = false;
location.href = back;
</script>
</body>
</html>
