name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Stamp the build so open copies of the site can tell a newer version is out (see checkForUpdate).
      - name: Stamp build
        run: |
          sed -i "s/__ALTIRO_BUILD__/${GITHUB_SHA}/" www/index.html
          # (apk: the fingerprint of the app's code, which the Android test app compares with its own.)
          printf '{"build":"%s","apk":"%s"}\n' "$GITHUB_SHA" "$(sh scripts/app-content-id.sh)" > www/version.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deployment
        uses: actions/deploy-pages@v4
